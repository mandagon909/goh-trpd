<script>
/* ======= СПРАВОЧНИКИ ======= */
const ST={str:"Сила",spd:"Скорость",dur:"Стойкость",end:"Выносливость",tech:"Техника БИ",ctrl:"Контроль Чарёка",gp:"Запас GP",per:"Восприятие",all:"Все физ. параметры"};
const TT={
  melee:["Холодное оружие","#FF6A1A","Мечи, копья, посохи, булавы, топоры, кнуты и нунчаки. Самый большой класс сокровищ: оружие, прославленное в руках героев и мастеров, которое режет силу чарёка как сталь."],
  ranged:["Стрелковое","#3DDC84","Луки, пистолеты, винтовки и ракетные установки. Сокровищам не важно, древний это лук или современный автомат: важна слава, которую предмет заработал в истории."],
  guard:["Щиты и доспехи","#4D9CFF","Зеркала, щиты и боевые доспехи. Почти не ранят сами, зато держат удары, которые сносят здания, и делают носителя тем, кого невозможно пробить в лоб."],
  relic:["Реликвии","#2EE6FF","Чаши, кресты, нити, карты и ларцы. Не оружие в привычном смысле: они лечат, связывают, обманывают и меняют правила боя вокруг носителя."],
  divine:["Вещи богов и Мудрецов","#FFD23F","Оружие и снаряжение самих богов и Мудрецов. Стоят выше любого национального сокровища, в руки игроков попадают только по сюжету и с решения ГМа."]
};
const TORDER=["melee","ranged","guard","relic","divine"];

/* ======= ИСТОРИЯ ======= */
const LORE=[
 ["lead","Национальные сокровища — это предметы из истории человечества, которые обрели огромную славу. Мечи героев, луки великих стрелков, чаши святых, доспехи полководцев. Чем громче слава предмета, тем больше силы он копит, и тем сильнее люди хотят им завладеть."],
 ["","В Ватикане их называют халидомами — святынями. Каждая страна хранит свои сокровища как самое ценное, что у неё есть: в закрытых хранилищах, монастырях и курганах, под охраной людей, о которых не знает даже правительство. В музеях часто лежат копии, а оригиналы видели единицы."],
 ["h","Откуда они берутся"],
 ["","Одни сокровища дарят боги или совет контракторов. Другие создают великие мастера-оружейники. Третьи просто становятся сокровищами со временем: слава, которая веками копится вокруг вещи, сама наполняет её силой. Поэтому среди сокровищ есть и древний лук Геракла, и нунчаки Брюса Ли, и южнокорейский автомат K2."],
 ["","Важная деталь: сокровище, которое дал бог, — не оригинальное оружие этого бога, а его отражение. Настоящее оружие предка может призвать только его прямой потомок, когда раскрывает силу контракта до конца."],
 ["h","У каждого сокровища своя воля"],
 ["","Сокровище нельзя просто взять. Оно само выбирает хозяина, самого достойного из всех, кто к нему тянется. Это называют экзаменом на сертификацию национального сокровища: предмет откликается на того, кого признал. Меч может сам переместиться к своему человеку через весь город, и этим всё сказано."],
 ["","Сокровища помнят прежних владельцев: их битвы, клятвы и смерть. Одни тяжелеют в чужих руках так, что их не поднять, другие обжигают, третьи просто молчат и не отдают ни капли силы. Носитель не владеет сокровищем, а заключает с ним союз."],
 ["h","Что умеет любое сокровище"],
 ["","Сокровище является к хозяину по зову или когда оно нужно, с любого расстояния. Оно может парить в воздухе и само лететь в руку. В бою оно усиливает удары, легко режет мощный чарёк и выдерживает атаки, которые сломали бы любое обычное оружие. А ещё сокровище умеет раздувать чарёк носителя, но только три раза подряд, после чего ему нужно время."],
 ["h","Третий путь силы"],
 ["","Боевое искусство человек строит сам, своим телом. Чарёк — контракт с богом, чужая сила взаймы. Сокровище — третий путь: сила, заключённая в предмете. Её нельзя выучить, её можно только получить. А значит, её можно потерять, отдать или отнять. Поэтому вокруг сокровищ всегда идёт охота: за ними гоняются NOX, чёрные коллекционеры, разведки чужих стран и боги, которые хотят вернуть своё."],
 ["","На сервере «Царь Горы» сокровище — редкость. Большинство бойцов проходят весь путь без него. Тот, у кого оно есть, носит не просто оружие, а частицу истории своей страны и всё, что за ней тянется."]
];

const TREASURES=[
 {id:"bongseon",look:"Прямой одноручный меч с узким клинком светлой стали, по которому при движении пробегает лунный отблеск. Гарда простая, крестовая, рукоять обмотана тёмно-красным шнуром, на навершии вырезан маленький иероглиф «奉先». В руке хозяйки меч почти невесомый, в чужих руках тяжелеет, как лом.",name:"Бонсон",orig:"봉선 · Bong-Seon",type:"melee",country:"Корея",wielder:["Ю Мира","25-я наследница стиля Лунного Меча"],holders:[["Люй Бу","великий воин Троецарствия, Фэнсянь"]],

  can:"Бонсон — меч, созданный для скорости. Он выдерживает те взмахи Лунного Меча, на которых обычная сталь просто разлетается, и не тупится, сколько бы ни рубил. В руках хозяйки он режет силу чарёка так же легко, как ткань, и принимает удары, способные снести здание.\n\nГлавное в мече — его родство с Люй Бу. Если носитель связан с Люй Бу или другим великим воином Китая, Бонсон откликается особенно сильно: каждый из трёх подряд всплесков чарёка, которые даёт сокровище, превращает взмах в удар полководца. Меч чувствует намерение хозяина и ложится в руку раньше, чем тот успевает его позвать.\n\nДля носителя без такой связи это просто идеальный клинок: быстрый, острый, неломающийся, и он всегда возвращается к руке.",

 {id:"tinydragon",look:"Две короткие чёрные палки из полированного дерева на стальной цепочке. На каждой вырезан маленький жёлтый дракон, концы окованы потёртым металлом. С виду обычные спортивные нунчаки, пока не начинают вращаться так быстро, что сливаются в чёрно-жёлтый круг.",name:"Нунчаки Маленького Дракона",orig:"Tiny Dragon's Nunchucks",type:"melee",country:"Китай",wielder:["Ма Бора","владелица в манхве"],holders:[["Брюс Ли","мастер, по прозвищу «Маленький Дракон»"]],

  manhwa:"Принадлежат Ма Боре.",

 {id:"teddy",look:"Коричневый плюшевый медведь размером с ребёнка, с глазами-пуговицами и бантом на шее. Из спины торчит пусковая труба, в животе спрятан барабан на несколько ракет. Медведь потрёпан и зашит в нескольких местах — похоже, это не первая его война.",name:"Мишка-ракетомёт Mk.3",orig:"Teddy-Bear Launcher Mk.3",type:"ranged",country:"Неизвестно",wielder:["Сатурн","владелец в манхве"],holders:[],

 {id:"grail",look:"Простая чаша размером с ладонь, из потемневшего дерева, без украшений. В спокойном состоянии её легко принять за обычную посуду. Когда сокровище работает, чаша сама наполняется прозрачной водой и светится изнутри мягким белым светом.",name:"Святой Грааль",orig:"Holy Grail · Sangreal",type:"relic",country:"Ватикан",wielder:["Пауль","носитель в манхве"],holders:[["Иосиф Аримафейский","по преданию, собрал в чашу кровь Христа"],["Сэр Галахад","рыцарь Круглого стола, нашедший Грааль"]],
  about:"Чаша, из которой, по преданию, пили на Тайной вечере. Рыцари Круглого стола искали её годами, и найти её смог только чистый сердцем Галахад. Ватикан хранит Грааль как одну из главных своих святынь.",
  manhwa:"Халидом Пауля. В Ватикане национальные сокровища называют халидомами.",
  can:"Грааль — сокровище исцеления. Носитель наполняет чашу водой и даёт её выпить раненому или выливает на рану: раны затягиваются за секунды, кости срастаются, кровь останавливается. Вода Грааля смывает яды, проклятия, контроль разума и эффекты, наложенные чужим чарёком.\n\nКогда чаша светится, союзники рядом с носителем чувствуют прилив сил: дыхание выравнивается, страх уходит, и они могут сражаться дольше. Грааль не делает носителя сильнее в ударе, но превращает его в того, кого почти невозможно добить и за кем идут остальные.",

 {id:"adameve",look:"Два длинноствольных пистолета одной формы: Адам — из белого металла с золотой гравировкой яблони, Ева — из чёрного металла с гравировкой змея. Рукояти из слоновой кости и чёрного дерева. Адама носят в правой руке, Еву — в левой.",name:"Адам и Ева",orig:"Adam & Eve",type:"ranged",country:"Ватикан",wielder:["Джон","носитель в манхве"],holders:[],

 {id:"malleus",look:"Тяжёлая булава на длинной окованной рукояти с шипастым навершием из чёрного железа. На рукояти выбиты латинские строки из трактата, с навершия свисает цепочка с маленьким железным крестом. От булавы пахнет старым воском и дымом.",name:"Молот ведьм",orig:"Malleus Maleficarum",type:"melee",country:"Ватикан",wielder:["Мария","носительница в манхве"],holders:[],

  ult:["Суд инквизиции","Носитель обрушивает булаву на землю, и в круге вокруг него гаснут все чужие техники и барьеры. Один раз за бой."],
  limits:"Против чистого боевого искусства без чарёка особые свойства не работают."},

 {id:"kopia",look:"Пика длиной почти пять метров с полым древком в красно-белую полосу и небольшим флажком под наконечником. Наконечник гранёный, узкий, как жало. Когда носитель разгоняется, за его спиной проступают призрачные гусарские крылья из орлиных перьев.",name:"Копия",orig:"Kopia",type:"melee",country:"Польша",wielder:["Алдон Ски","владелец в манхве"],holders:[["Крылатые гусары","польская тяжёлая конница XVI–XVIII веков"]],
  about:"«Копия» — польское название длинной кавалерийской пики крылатых гусар. С такими пиками гусары сокрушали армии, вдвое превосходящие их числом, а в 1683 году решили судьбу битвы под Веной.",
  manhwa:"Принадлежит Алдону Ски.",
  can:"Пика даёт носителю силу таранного удара. Разогнавшись, он бьёт с мощью несущейся конницы и пробивает щиты, строй и стены. Настоящие гусарские пики ломались после первого удара, а Копия не ломается никогда.\n\nЗа спиной носителя слышен шум крыльев: призрачные гусарские крылья пугают противника и сбивают ему концентрацию. На открытом месте носитель с Копией почти неостановим.",
  passive:[["spd",3],["str",2]],
  ult:["Атака под Веной","Носитель разгоняется, за ним встаёт призрачная гусарская хоругвь, и вся она таранит противника. Один раз за бой."],
  limits:"Нужен разбег: в тесном помещении сила таранного удара падает."},

 {id:"mjolnir",look:"Боевой молот с массивной прямоугольной головкой из тёмного металла, покрытой рунами, и непривычно короткой рукоятью, обмотанной кожей. На конце рукояти — ремешок-петля для броска. Перед ударом по рунам бегут голубые искры.",name:"Мьёльнир",orig:"Mjölnir",type:"melee",country:"Норвегия",wielder:["Анна","владелица в манхве"],holders:[["Тор","бог грома"]],
  about:"Молот Тора, выкованный гномами Брокком и Эйтри. Рукоять у него короткая: Локи в облике мухи мешал кузнецам в последний момент. По мифу, молот всегда возвращается в руку хозяина и не ломается ни о что.",
  manhwa:"Принадлежит Анне. Форма сокровища в манхве точно не показана, на вики его тип значится как неизвестный.",
  can:"Мьёльнир бьёт молнией: в момент попадания из головки срывается разряд, который оглушает противника. Брошенный молот летит по прямой, сносит всё на пути и сам возвращается в руку.\n\nРаскрутив молот за ремешок и бросив его, носитель может лететь следом и за миг сокращать любую дистанцию. Над тем, кто держит Мьёльнир, всегда немного пахнет грозой.",
  passive:[["str",4],["dur",2]],
  ult:["Призыв бури","Носитель поднимает молот к небу, над полем собираются тучи, и в выбранную область бьёт столб молний. Один раз за бой."],
  limits:"Пока молот в полёте, носитель безоружен. Двуручных ударов нет: рукоять слишком короткая."},

 {id:"ascalon",look:"Прямой меч крестоносца с длинным узким клинком и крестовой гардой. На клинке выгравирован красный крест святого Георгия, навершие сделано в виде головы дракона, пронзённой копьём. Клинок всегда холодный на ощупь, даже рядом с огнём.",name:"Аскалон",orig:"Ascalon",type:"melee",country:"Великобритания",wielder:["Шим Бонса","владелец в манхве"],holders:[["Святой Георгий","победитель дракона, покровитель Англии"]],
  about:"Меч святого Георгия, которым тот, по легенде, победил дракона и спас царевну. Георгий — покровитель Англии, его крест стоит на английском флаге.",
  manhwa:"Принадлежит Шим Бонсе.",
  can:"Аскалон — меч против чудовищ. Он пробивает чешую и шкуру, а огонь и яд не причиняют носителю вреда, пока клинок в руке. Против огромного противника меч находит одно точное место для удара.\n\nСвятой Георгий не знал страха, и меч передаёт это носителю: техники, внушающие ужас и подавляющие волю, на него почти не действуют.",
  passive:[["dur",3],["str",2]],
  ult:["Победа над змием","Носитель одним ударом пригвождает противника к земле, и тот не может двигаться, пока не вырвется. Против существ-чудовищ удар вдвое сильнее. Один раз за бой."],
  limits:"Против обычного человека без чарёка особые свойства слабеют."},

 {id:"mulungma",look:"Копьё с длинным листовидным наконечником и круглый щит, обтянутый кожей и окованный по краю металлом. На щите и у основания наконечника повторяется один и тот же выцветший узор: видно, что их делали как пару. В манхве внешний вид почти не показан.",name:"Мулунгма и Сеанн",orig:"Mulungma & Seanne",type:"guard",country:"Неизвестно",wielder:["Моджахед","владелец в манхве"],holders:[],
  about:"Пара сокровищ: копьё Мулунгма и щит Сеанн. Происхождение пары в манхве не раскрыто.",
  manhwa:"Принадлежат Моджахеду. Подробно в бою не показаны.",
  can:"Копьё и щит работают как одно целое: щит держит удар, а копьё отвечает из-за его края, пока противник ещё открыт после атаки. Носитель, привыкший к этой паре, почти не делает лишних движений.\n\nЩит выдерживает атаки, которые пробили бы стену, а копьё легко режет чарёк. Пара особенно сильна в обороне и в долгом бою.",
  passive:[["dur",3],["tech",2]],
  ult:["Стена и остриё","Носитель на ход становится неподвижной стеной: щит принимает всё, а копьё отвечает на каждую атаку контрударом. Один раз за бой."],
  limits:"Без одного предмета из пары второй теряет особые свойства. Данные в манхве скудные, ГМ может уточнить."},

 {id:"torments",look:"Сотня с лишним предметов самого разного вида: мечи, топоры, посохи, копья, винтовки, базуки, гранаты. Со Ханрян не носит их при себе: сокровища являются по зову и выстраиваются вокруг него в воздухе. Многие носят имена корейских гор, праздников, храмов и символов.",name:"108 мук человечества",orig:"108 Torments of Mankind",type:"melee",country:"Корея",wielder:["Со Ханрян","глава Национальной ассоциации бездомных"],holders:[],
  about:"Полный арсенал Со Ханряна: 108 национальных сокровищ. Число 108 в буддизме — число страстей и мук, которые держат человека в круге перерождений. Мечи, посохи, топоры, копья, винтовки, базуки и гранаты — Со Ханрян собрал их больше, чем кто-либо в мире.",
  manhwa:"Со Ханрян одолжил свои сокровища Хуэй Мори, и все они сломались в его руках, кроме посоха Га Болг. Со Ханрян сражался с Зевсом и засунул ему в рот гранату, пожертвовав рукой и выбив богу зуб.",
  can:"Сила арсенала — в разнообразии. Носитель вызывает нужное сокровище из любого места и меняет оружие посреди боя: меч для ближней схватки, топор против брони, винтовка против дальней цели, базука против толпы. Противник не может подготовиться, потому что не знает, что будет в руке через секунду.\n\nНа сервере это не одно сокровище, а коллекция. Носитель коллекции получает доступ к нескольким предметам сразу, но каждый слабее отдельного сокровища.",
  passive:[["tech",3],["per",2]],
  ult:["Сто восемь мук","Носитель вызывает весь арсенал разом, и десятки сокровищ обрушиваются на противника со всех сторон. Один раз за арку."],
  limits:"Только по сюжету. Если сокровища ломаются, восстановить их может только ГМ.",plot:true},

 {id:"gaebolg",look:"Простой деревянный посох в рост человека, тёмный, отполированный руками до блеска, с зарубками и заплатками из верёвки. Выглядит как палка нищего, и не случайно: это символ главы Национальной ассоциации бездомных. Ничто в нём не выдаёт, что он может ранить бога.",name:"Га Болг",orig:"Gáe Bolg",type:"melee",country:"Корея",wielder:["Со Ханрян","глава Национальной ассоциации бездомных"],holders:[["Кухулин","герой Ольстера, по мифу — копьё"]],
  about:"В ирландском эпосе Га Болг — копьё Кухулина, которое раскрывало в ране тридцать зазубрин. В мире «Бога старшей школы» это простой с виду деревянный посох. Он символ главы Национальной ассоциации бездомных и самое освоенное сокровище Со Ханряна.",
  manhwa:"В руках Со Ханряна этот посох мог ранить тело бога. Единственное из 108 сокровищ, которое не сломалось, когда Ханрян одолжил их Хуэй Мори.",
  can:"Га Болг выглядит как палка нищего, и этим обманывает всех. Деревянный посох выдерживает удары, от которых ломается сталь, и бьёт с такой плотностью, что пробивает защиту богов. Носитель может вложить в посох всю силу тела, и посох не треснет.\n\nВ посохе живёт память ирландского копья: удары им оставляют раны, которые долго не закрываются, а брошенный посох находит цель, даже если та уклоняется. В Корее посох передают от главы ассоциации к следующему главе, и вместе с ним передаётся власть над всеми бездомными страны.",
  passive:[["str",3],["dur",3]],
  ult:["Удар, ранящий бога","Носитель вкладывает в посох всё, что у него есть, и наносит удар, который пробивает любую защиту, включая божественную. Один раз за бой."],
  limits:"Выдача только по сюжету: посох принадлежит главе ассоциации и переходит лишь к его наследнику.",plot:true},

 {id:"chohong",look:"Катана в простых чёрных ножнах. Клинок с красноватым отливом по линии закалки, цуба круглая и без украшений. Рукоять обмотана красной лентой.",name:"Чохон",orig:"Cho-hong",type:"melee",country:"Корея",wielder:["Со Ханрян","из 108 сокровищ"],holders:[],
  about:"Катана из коллекции 108 сокровищ Со Ханряна.",
  manhwa:"Одно из сокровищ Ханряна, сломалось в руках Хуэй Мори.",
  can:"Чохон — меч скорости и чистого реза. Он выходит из ножен быстрее, чем противник замечает движение, и оставляет на цели тонкий, но глубокий разрез. Катана хорошо работает с иайдо и кендо: одно точное движение решает больше, чем серия.\n\nКак и все сокровища коллекции, Чохон режет чарёк и является к хозяину по зову.",
  passive:[["spd",3],["tech",2]],
  ult:["Алый рез","Мгновенное выхватывание: удар проходит раньше, чем противник начинает атаку, и прерывает её. Один раз за бой."],
  limits:"Тонкий клинок плохо держит блок против тяжёлого оружия."},

 {id:"chuseok",look:"Длинноствольное оружие с оптическим прицелом: ствол заметно длиннее, чем у обычной винтовки. Корпус тёмный, на прикладе выгравирована полная луна. Выглядит громоздким, но носитель держит его легко.",name:"Чусок",orig:"Chuseok",type:"ranged",country:"Корея",wielder:["Со Ханрян","из 108 сокровищ"],holders:[],
  about:"Оружие с прицелом и очень длинным стволом. Названо в честь Чусока — корейского праздника урожая и полной луны.",
  manhwa:"Одно из сокровищ Ханряна.",
  can:"Чусок бьёт с огромной дистанции, на которой противник даже не видит стрелка. Длинный ствол даёт пуле силу пробить стену, а прицел позволяет попасть в щель доспеха.\n\nВ полнолуние, как говорят, оружие не промахивается вовсе. На сервере это значит: в ночном бою под открытым небом точность носителя выше.",
  passive:[["per",4],["tech",1]],
  ult:["Полная луна","Один выстрел, который попадает в цель, даже если та уклоняется или прячется. Один раз за бой."],
  limits:"Медленно наводится: вплотную почти бесполезен."},

 {id:"dabo",look:"Широкий тяжёлый клинок, похожий на огромный тесак, с прямым обухом и скошенным концом. На плоскости вытравлен многоярусный силуэт пагоды Дабо-тхап. Рукоять короткая, обмотанная тёмной тканью.",name:"Дабо",orig:"Dabo",type:"melee",country:"Корея",wielder:["Со Ханрян","из 108 сокровищ"],holders:[],
  about:"Меч, похожий на тесак. Название отсылает к Дабо-тхап — Пагоде многих сокровищ в храме Пульгукса, одному из символов Кореи.",
  manhwa:"Одно из сокровищ Ханряна.",
  can:"Дабо — тяжёлый широкий клинок, который рубит, а не режет. Удар им ломает блок вместе с оружием противника. Пагода, давшая мечу имя, стоит больше тысячи лет, и меч так же устойчив: его невозможно выбить из руки.",
  passive:[["str",3],["dur",2]],
  ult:["Тысяча лет камня","Носитель на ход становится неподвижным, как пагода, и ни один удар не сдвигает его с места, а ответный удар Дабо идёт с двойной силой."],
  limits:"Тяжёлый клинок медленнее обычного меча."},

 {id:"daeungjeon",look:"Обоюдоострый клинок-тесак, широкий и почти прямоугольный, заточенный с обеих сторон. Металл светлый, с золотистым отливом, у основания клинка — узор из лотосов, как на дверях храмового зала. Рукоять длинная, под две руки.",name:"Тэунджон",orig:"Daeungjeon",type:"melee",country:"Корея",wielder:["Со Ханрян","из 108 сокровищ"],holders:[],
  about:"Обоюдоострый меч-тесак. Тэунджон — главный зал буддийского храма, где стоит статуя Будды.",
  manhwa:"Одно из сокровищ Ханряна.",
  can:"Две режущие кромки позволяют бить в обе стороны без разворота клинка: каждый замах — двойной удар. Меч дышит спокойствием храмового зала: носитель не теряет головы даже в самом яростном бою, и техники, внушающие страх или ярость, на него действуют слабо.",
  passive:[["tech",3],["ctrl",2]],
  ult:["Зал Будды","Носитель на миг замирает, и вокруг него становится тихо: следующие два удара противника проходят мимо, а носитель отвечает двойным разрезом."],
  limits:"Требует обеих рук."},

 {id:"greenring",look:"Чёрно-зелёный рыцарский ланс: длинное коническое остриё и широкий раструб-щиток, прикрывающий руку. У основания острия — кольцо зелёного металла, которое вспыхивает в момент удара. Тяжёлый на вид, но двигается быстро.",name:"Зелёное кольцо",orig:"Green Ring",type:"melee",country:"Корея",wielder:["Со Ханрян","из 108 сокровищ"],holders:[],
  about:"Чёрно-зелёный рыцарский ланс из коллекции Со Ханряна.",
  manhwa:"Одно из сокровищ Ханряна.",
  can:"Ланс создан для таранного выпада: носитель бьёт вперёд всем телом, и остриё пробивает строй и щиты. Конический наконечник защищает руку, поэтому лансом можно и колоть, и закрываться. Вокруг острия в момент удара вспыхивает зелёное кольцо света, которое расширяет зону поражения.",
  passive:[["str",3],["spd",2]],
  ult:["Кольцо прорыва","Носитель с разбега пробивает всё перед собой, и зелёная волна сносит противников по бокам от линии удара."],
  limits:"Плох в тесноте и в ближнем клинче."},

 {id:"k2",look:"Штурмовая винтовка в облике корейского автомата K2: тёмный корпус, складной приклад, изогнутый магазин. От армейского образца её отличают только едва заметные золотые насечки на ствольной коробке. Сокровище легко спутать с обычным оружием.",name:"K2",orig:"K2",type:"ranged",country:"Корея",wielder:["Со Ханрян","из 108 сокровищ"],holders:[],
  about:"Штурмовая винтовка. Её реальный прототип — Daewoo K2, основной автомат армии Южной Кореи. Миллионы солдат прошли с ним службу, и эта слава сделала его сокровищем.",
  manhwa:"Одно из сокровищ Ханряна.",
  can:"K2 стреляет очередями, которые пробивают защиту чарёка, и не перегревается. Патронов сокровищу не нужно. Винтовка надёжна, как солдат-срочник: она не заедает и не подводит в самый важный момент.",
  passive:[["per",3],["spd",1]],
  ult:["Огневой вал","Носитель ведёт непрерывный огонь, не давая противнику поднять голову: тот не может атаковать, пока не уйдёт из-под обстрела."],
  limits:"Пули не так сильны против богов и сверхпрочной защиты."},

 {id:"k15",look:"Белая базука с толстой трубой и прицельной планкой. Корпус белоснежный, без единой царапины, на боку короткая маркировка «K15». Носитель держит её на плече одной рукой, хотя выглядит она тяжёлой.",name:"K15",orig:"K15",type:"ranged",country:"Корея",wielder:["Со Ханрян","из 108 сокровищ"],holders:[],
  about:"Белая базука из коллекции Со Ханряна. Названа по корейскому армейскому индексу.",
  manhwa:"Одно из сокровищ Ханряна.",
  can:"Каждый выстрел K15 — взрыв, который сносит стену и разбрасывает толпу. Против брони и укреплений она незаменима. Как и все сокровища коллекции, она прилетает к хозяину и перезаряжается сама.",
  passive:[["str",3],["per",1]],
  ult:["Белый залп","Серия из трёх выстрелов в одну точку: пробивает любую защиту из камня, металла и щитов чарёка."],
  limits:"Вплотную стрелять опасно для себя. Медленная перезарядка."},

 {id:"mugunghwa",look:"Двусторонний топор на длинном тёмно-зелёном древке, с жёлтым остриём на каждом конце. Лезвия выгнуты как лепестки, а в центре древка вырезан пятилепестковый цветок мугунхва.",name:"Мугунхва",orig:"Mugunghwa",type:"melee",country:"Корея",wielder:["Со Ханрян","из 108 сокровищ"],holders:[],
  about:"Топор с жёлтыми остриями на обоих концах. Мугунхва — сирийский гибискус, национальный цветок Кореи. Его имя значит «вечный цветок, который не увядает».",
  manhwa:"Одно из сокровищ Ханряна.",
  can:"Двусторонний топор бьёт обоими концами: носитель вращает его и рубит без пауз. Как цветок, который не увядает, топор не устаёт: чем дольше бой, тем свежее носитель себя чувствует.",
  passive:[["str",3],["end",2]],
  ult:["Неувядающий цветок","Носитель раскручивает топор и превращается в вихрь лезвий, задевая всех вокруг. Пока вихрь крутится, он не теряет Выносливость."],
  limits:"Тяжёлый: медленно меняет направление удара."},

 {id:"mireu",look:"Станковая снайперская винтовка с сошками и очень длинным стволом. Корпус серый, приклад украшен узором, похожим на нимб Будды. Её ставят на опору: держать на руках её почти невозможно.",name:"Мирык",orig:"Mireu",type:"ranged",country:"Корея",wielder:["Со Ханрян","из 108 сокровищ"],holders:[],
  about:"Станковая снайперская винтовка. Имя отсылает к Мирык — Майтрее, Будде грядущего, который придёт спасти мир.",
  manhwa:"Одно из сокровищ Ханряна.",
  can:"Мирык бьёт с дистанции в километры. Винтовку ставят на опору, и выстрел пробивает здание насквозь. Носитель видит в прицел сквозь дым и пыль, а пуля летит так быстро, что от неё почти невозможно уйти.",
  passive:[["per",4],["str",1]],
  ult:["Грядущий","Носитель целится целый ход, и следующий выстрел бьёт с силой, способной ранить даже бога."],
  limits:"Нужна опора и время на прицел. В ближнем бою бесполезна."},

 {id:"seorak",look:"Белый топор с широким лезвием, жёлтым кольцом у основания и коричневым узором на рукояти, похожим на прожилки горной породы. Обух массивный: им можно бить как молотом.",name:"Сорак",orig:"Seorak",type:"melee",country:"Корея",wielder:["Со Ханрян","из 108 сокровищ"],holders:[],
  about:"Белый топор с жёлтым кольцом и коричневым узором. Назван в честь Сораксана — одной из самых высоких и красивых гор Кореи.",
  manhwa:"Одно из сокровищ Ханряна.",
  can:"Топор тяжёл, как гора, и так же устойчив. Его удар раскалывает камень и проламывает защиту. Носитель, держащий Сорак, крепко стоит на земле: его трудно сбить с ног или отбросить.",
  passive:[["str",4],["dur",1]],
  ult:["Обвал","Носитель бьёт по земле, и перед ним рушится лавина камня."],
  limits:"Медленный замах."},

 {id:"bluecloud",look:"Узкий прямой меч с голубоватым клинком цвета ясного неба. По плоскости вьётся узор облаков, маленькая гарда сделана в форме арки моста. Остриё очень тонкое: меч создан для укола.",name:"Голубое облако",orig:"Blue Cloud",type:"melee",country:"Корея",wielder:["Со Ханрян","из 108 сокровищ"],holders:[],
  about:"Меч, имя которого отсылает к Мосту голубых облаков — Чхонун-гё в храме Пульгукса, по которому, по преданию, путь ведёт из мира людей в мир Будды.",
  manhwa:"В манхве им пробивают стену толщиной десять метров.",
  can:"Голубое облако — меч прокола. Его колющий удар проходит сквозь стену толщиной в десять метров, а значит, и сквозь любую обычную защиту. Клинок лёгкий, носитель держит его одной рукой и бьёт точно.",
  passive:[["str",3],["tech",2]],
  ult:["Мост в иной мир","Один выпад, который пробивает всё на своей линии: стены, щиты и барьеры чарёка."],
  limits:"Режущие удары слабее колющих."},

 {id:"jeanne",look:"Тонкая рапира с длинным узким клинком и закрытой чашкой-гардой, украшенной лилиями — гербом французских королей. На эфесе вырезаны слова «Jhesus Maria». Сталь светлая, но у острия видны следы, похожие на копоть.",name:"Рапира Жанны д'Арк",orig:"Rapier of Jeanne D'Arc",type:"melee",country:"Франция",wielder:["Андре Оскар","мастер Lance de Combat"],holders:[["Жанна д'Арк","Орлеанская дева, героиня Столетней войны"]],
  about:"Клинок, связанный с Жанной д'Арк — крестьянской девушкой, которая повела Францию к победе в Столетней войне и была сожжена на костре. Её прославили как святую, и вещь, связанная с ней, стала одной из главных святынь Франции.",
  manhwa:"Принадлежит Андре Оскару, мастеру фехтовального стиля Lance de Combat.",
  can:"Рапира — оружие точности. Она колет в щели защиты, а в руках фехтовальщика двигается так быстро, что противник видит только серию бликов. Носитель Lance de Combat получает от неё особую пользу: связки стиля становятся длиннее и точнее.\n\nВ клинке живёт вера Орлеанской девы. Он не подводит носителя в безнадёжном бою и даёт силу стоять, когда другие отступают. Вокруг острия иногда вспыхивает пламя: память о костре, на котором погибла Жанна.",
  passive:[["spd",3],["tech",3]],
  ult:["Знамя Орлеана","Носитель поднимает рапиру, и союзники вокруг получают её решимость: страх и подавление на них не действуют, а их удары сильнее до конца хода. Сам носитель бьёт серией горящих уколов."],
  limits:"Тонкий клинок плохо держит блок тяжёлого оружия."},

 {id:"apollon",look:"Тяжёлая боевая дубина из тёмного, почти чёрного дерева, утолщённая к концу и окованная бронзовыми кольцами. На кольцах выбиты солнечные лучи — знак Аполлона. Длиной в руку, массивная, но идеально сбалансированная.",name:"Посох Аполлона",orig:"Staff of Apollon",type:"melee",country:"Греция",wielder:["Самуэль Росинанте","капитан сборной Аргентины, позже Судья"],holders:[],
  about:"Тяжёлая боевая дубина, связанная с греческими богами. Вики манхвы предполагает, что это настоящая дубина Геракла, которую Самуэль призывает, раскрывая силу контракта.",
  manhwa:"Посох Аполлона оказался прочнее посоха, который Со Ханрян дал Хуэй Мори: при столкновении тот разлетелся. Самуэль — потомок Геракла и его контрактор.",
  can:"Главное свойство дубины — прочность и вес. Она ломает чужое оружие при столкновении и не получает ни царапины. Удар ею несёт физическую мощь Геракла: проламывает защиту и отбрасывает противника.\n\nДля контрактора греческого героя или бога она раскрывается сильнее: каждый удар становится тяжелее, а техники силы работают вместе с ней.",
  passive:[["str",4],["dur",2]],
  ult:["Подвиг силы","Удар, в который носитель вкладывает силу Геракла: ломает оружие противника и сбивает его с ног."],
  limits:"Тяжёлая: медленные удары, мало пользы против быстрого противника."},

 {id:"heracles",look:"Большой составной лук из светлого рога и бронзы с тетивой, которая звенит как струна. На плечах лука выгравированы двенадцать подвигов. В полном облачении носитель надевает серебряные доспехи Геракла, синий плащ и шоколадную юбку с зелёными птеригами в золотой кайме.",name:"Лук Геракла",orig:"Bow of Heracles",type:"ranged",country:"Греция",wielder:["Самуэль Росинанте","капитан сборной Аргентины, позже Судья"],holders:[["Геракл","величайший герой Греции"]],
  about:"Настоящий лук Геракла, выкованный Гефестом, кузнецом богов. Стрелы Геракла были отравлены ядом Лернейской гидры и убивали даже бессмертных.",
  manhwa:"Самуэль случайно раскрыл силу контракта до конца и получил настоящий лук. В полном облачении на нём серебряные доспехи Геракла и синий плащ. Лук очень разрушителен, но уступает в прочности посоху Жуи Цзиньгу: Хуэй Мори разбил его своим посохом.",
  can:"Стрелы лука бьют с силой, сравнимой с взрывом, и пробивают броню, стены и защиту чарёка. Носитель стреляет быстро и далеко, а выпущенная им стрела летит прямо, без снижения.\n\nВместе с луком приходят доспехи героя, которые защищают тело носителя. Для потомка Геракла лук — не сокровище, а наследство, и раскрывается полностью.",
  passive:[["str",3],["per",3]],
  ult:["Стрела гидры","Отравленная стрела: рана от неё не заживает и каждый ход отнимает силы, пока её не исцелят. Один раз за бой."],
  limits:"Лук хрупок против божественного оружия: удар оружием уровня Мудреца может его сломать."},

 {id:"kusanagi",look:"Прямой обоюдоострый меч древнего японского типа (цуруги) с простой рукоятью. Клинок светлый, с зеленоватым отливом, будто под металлом течёт вода. В полном облачении после Рагнарёка у меча вырастают ветви, а носителя покрывают самурайские доспехи.",name:"Кусанаги",orig:"草薙剣 · Kusanagi no Tsurugi",type:"melee",country:"Япония",wielder:["Кусанаги Кёити","первенец клана, носитель Ямата-но-Ороти"],holders:[["Сусаноо","нашёл меч в хвосте змея Ороти"],["Ямато Такэру","скосил мечом горящую траву"]],
  about:"Одна из трёх императорских регалий Японии. Бог бури Сусаноо нашёл меч в хвосте восьмиглавого змея Ороти. Принц Ямато Такэру, окружённый огнём, скосил им траву, и ветер развернул пламя на врагов — отсюда имя «Косящий траву».",
  manhwa:"У Кусанаги Кёити все три императорские регалии. В его клане змей Ороти запечатан в первенце и становится его чарёком. Меч усиливает разрезы Кёити, позволяет призывать из них Ороти и, главное, держать под контролем силу змея внутри. После Рагнарёка в полном облачении у меча вырастают ветви, а Кёити покрывают самурайские доспехи.",
  can:"Кусанаги — меч-ключ к чудовищу. Без него сила Ороти рвёт носителя изнутри, с ним она подчиняется. Каждый разрез может выпустить змеиную голову, которая кусает цель вместо клинка, и восемь голов могут атаковать с разных сторон.\n\nКак меч бури, Кусанаги управляет ветром: широкий взмах посылает режущий вихрь, а встречный ветер разворачивает огонь и газ на атакующего. Для носителя без чарёка Ороти это мощный ветряной клинок; для носителя с ним — единственный способ не потерять себя.",
  passive:[["tech",3],["ctrl",3]],
  ult:["Ямата-но-Ороти","Носитель полностью выпускает силу змея, и на поле встаёт настоящий восьмиглавый Ороти. Только с мечом в руке носитель удерживает над ним контроль. Один раз за арку."],
  limits:"Без меча носитель с чарёком Ороти рискует потерять контроль над телом."},

 {id:"yata",look:"Круглое бронзовое зеркало размером со щит. Лицевая сторона идеально гладкая, на обороте — узор из восьми лучей. Кёити держит его как щит, и в нём отражается не только свет, но и движение противника.",name:"Зеркало Ята",orig:"八咫鏡 · Yata no Kagami",type:"guard",country:"Япония",wielder:["Кусанаги Кёити","владелец всех трёх регалий"],holders:[["Аматэрасу","богиня солнца, которую зеркалом выманили из пещеры"]],
  about:"Вторая из трёх императорских регалий Японии. По мифу, этим зеркалом выманили из пещеры богиню солнца Аматэрасу, когда она спряталась и мир погрузился во тьму. Третья регалия — яшмовое ожерелье Ясакани.",
  manhwa:"Сокровище Кусанаги Кёити, используется как щит. Даёт почти абсолютную защиту от прямых атак.",
  can:"Зеркало принимает прямую атаку и гасит её почти полностью: удар кулаком, клинком, луч энергии, техника, летящая в лоб. Пока носитель держит зеркало перед собой, пробить его спереди почти невозможно.\n\nЗеркало отражает свет солнца и может ослепить противника вспышкой. Атаки сбоку, сзади и по площади оно держит гораздо хуже, поэтому опытный противник постарается зайти с фланга.",
  passive:[["dur",4],["per",1]],
  ult:["Свет Аматэрасу","Зеркало отражает одну атаку обратно в нападающего с полной силой и ослепляет всех, кто смотрел на него."],
  limits:"Защищает только от прямой атаки: удары сбоку, сзади и по площади проходят."},

 {id:"purplesnake",look:"Длинный кнут из тёмно-фиолетовой кожи, сплетённый как змеиная чешуя. Рукоять сделана в виде змеиной головы с зелёными камнями вместо глаз. В движении кнут извивается сам, будто живой.",name:"Пурпурный змей",orig:"Purple Snake",type:"melee",country:"Неизвестно",wielder:["Вайолет Элла Вонг Перес","владелица в манхве"],holders:[],
  about:"Кнут из числа национальных сокровищ. Происхождение в манхве не раскрыто.",
  manhwa:"Принадлежит Вайолет Элле Вонг Перес.",
  can:"Кнут движется как живой змей: изгибается в воздухе, огибает блоки и бьёт с неожиданной стороны. Он достаёт цель на дистанции в десяток метров и может обвить руку, ногу или оружие противника, чтобы вырвать его или сбить с ног.\n\nУдар кнута оставляет жгучий след, который ослабляет мышцы, будто от яда.",
  passive:[["spd",3],["tech",2]],
  ult:["Укус","Кнут обвивает противника целиком и сжимается: тот не может атаковать, пока не вырвется, и каждый ход теряет силы."],
  limits:"Слаб в ближнем клинче. Данные в манхве скудные, ГМ может уточнить."},

 {id:"murasaki",look:"Катана в пурпурных лакированных ножнах. Клинок с фиолетовым отливом и волнистой линией закалки, похожей на языки пламени. Рукоять обмотана чёрно-лиловым шнуром, цуба в форме цветка.",name:"Демонический меч Мурасаки",orig:"Devil Sword: Murasaki",type:"melee",country:"Япония",wielder:["Эрик Син","владелец в манхве"],holders:[],
  about:"Проклятый японский меч. «Мурасаки» значит «пурпурный». В японских легендах есть целый род «демонических мечей», которые жаждут крови и сводят хозяев с ума.",
  manhwa:"Принадлежит Эрику Сину.",
  can:"Мурасаки режет не только тело, но и силу: разрез оставляет пурпурный след, который рассеивает чарёк противника вокруг раны. Клинок жаждет крови, и с каждым пролитым ударом становится острее и быстрее.\n\nУ этой силы есть цена. Меч шепчет носителю, подталкивает к жестокости и не любит возвращаться в ножны, не напившись.",
  passive:[["str",3],["spd",2]],
  ult:["Пурпурная луна","Серия разрезов, каждый из которых сильнее предыдущего; если хоть один попал, меч требует продолжать до конца."],
  limits:"Если за бой никто не ранен, носитель теряет Выносливость. Меч толкает к жестокости."},

 {id:"jebe",look:"Сильно изогнутый монгольский составной лук из рога, дерева и сухожилий, обтянутый берёстой. Концы плеч загнуты назад, по ним идёт потёртый узор из красных полос. К луку прилагается колчан со стрелами в сером оперении.",name:"Лук Джэбэ",orig:"Jebe's Bow",type:"ranged",country:"Монголия",wielder:["Жрец Фанъу","владелец в манхве"],holders:[["Джэбэ","полководец Чингисхана"]],
  about:"Лук Джэбэ, одного из лучших полководцев Чингисхана. По преданию, в бою он подстрелил коня под самим Чингисханом. Хан не казнил его, а взял к себе и дал имя «Джэбэ» — «стрела».",
  manhwa:"Принадлежит жрецу Фанъу.",
  can:"Монгольский составной лук бьёт дальше и сильнее любого другого. Стрелы Джэбэ точны даже с несущегося коня и на полном бегу: носитель стреляет в движении так же метко, как стоя.\n\nПервый выстрел по сильнейшему противнику — особый: он целит не в тело, а в опору. Стрела выбивает у противника то, на чём держится его сила: коня, оружие, позицию.",
  passive:[["per",4],["spd",2]],
  ult:["Стрела, сбившая хана","Выстрел, который лишает противника опоры: выбивает оружие, сбивает с ног или прерывает технику."],
  limits:"Мало пользы вплотную."},

 {id:"merlin",look:"Высокий посох из старого корявого дерева, выше человеческого роста. Навершие обвито корнями, в которых держится мутный кристалл. По древку вырезаны знаки, похожие на древние руны и карты звёзд.",name:"Посох Мерлина",orig:"Staff of Merlin",type:"relic",country:"Великобритания",wielder:["Арго","владелец в манхве"],holders:[["Мерлин","маг и наставник короля Артура"]],
  about:"Посох Мерлина — величайшего мага британских легенд, наставника короля Артура, который видел будущее.",
  manhwa:"Принадлежит Арго.",

let IMG={},ADMIN=false,DB=null,AS=null,IMGJSON="{}",FIG={},REV={};
const imgOf=k=>IMG[k]?(window.BLOB_BASE||"")+IMG[k]:"";
const norm=x=>String(x||"").toLowerCase().replace(/ё/g,"е").replace(/\.[a-z0-9]+$/i,"").replace(/[^a-zа-я0-9]+/g,"");
const TYPEMAP={"Холодное оружие":"melee","Стрелковое":"ranged","Щиты и доспехи":"guard","Реликвии":"relic"};
function toast(m,keep){const t=document.getElementById("gtoast");t.textContent=m;t.hidden=false;clearTimeout(t._t);if(!keep)t._t=setTimeout(()=>t.hidden=true,5000)}
function rerender(){const y=window.scrollY;const a=document.activeElement&&document.activeElement.id;route(CUR);window.scrollTo(0,y);if(a==="q"){const n=document.getElementById("q");if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}}}
function buildPlayers(){
  const out=[];
  for(const uid in FIG){const f=FIG[uid]||{},tr=f.tr,r=REV[uid]||{};
    if(!tr||typeof tr!=="object"||tr.none||r.trStatus!=="approved"||!tr.name)continue;
    const g=(Array.isArray(f.trGallery)?f.trGallery:[]).find(x=>x&&x.id&&x.kind!=="video");
    out.push({id:"p-"+uid,player:true,name:String(tr.name),orig:tr.orig||"",type:TYPEMAP[tr.type]||"relic",country:tr.country||"Неизвестно",
      wielder:[f.name||"Боец",(f.discord?"игрок "+f.discord:"игрок сервера")],link:"./#f-"+uid,holders:[],how:tr.how||"",
      about:tr.about||"",origin:tr.origin||"",owners:tr.owners||"",look:tr.look||"",can:tr.can||"",passiveText:tr.passive||"",ult:tr.ultimate||"",limits:tr.limits||"",synergy:tr.synergy||"",
      img:g?(window.BLOB_BASE||"")+g.id:""})}
  out.sort((a,b)=>a.name.localeCompare(b.name,"ru"));
  const j=JSON.stringify(out);if(j!==buildPlayers.last){buildPlayers.last=j;PLAYERS=out;rerender()}
}
async function initDB(){
  try{
    if(!window.claude)return;
    DB=await claude.use("db");if(!DB)return;
    DB.doc("config/treasures").onSnapshot(sn=>{const d=(sn.exists&&sn.data().img)||{};const j=JSON.stringify(d);if(j!==IMGJSON){IMG=d;IMGJSON=j;rerender()}},()=>{});
    DB.collection("fighters").onSnapshot(sn=>{const m={};sn.docs.forEach(d=>m[d.id]=d.data());FIG=m;buildPlayers()},()=>{});
    DB.collection("reviews").onSnapshot(sn=>{const m={};sn.docs.forEach(d=>m[d.id]=d.data());REV=m;buildPlayers()},()=>{});
    const u=await claude.use("user");ADMIN=u?!!(await u.isOwner()):false;
    if(ADMIN){AS=await claude.use("assets");rerender()}
  }catch(e){}
}
async function shrinkImg(f){
  if(/gif|svg/.test(f.type)||f.size<350000)return f;
  try{const bmp=await createImageBitmap(f);const k=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,"image/webp",.86));return b&&b.size<f.size?b:f}catch(e){return f}
}
async function putImgs(pairs){
  if(!AS){toast("Войди на главном сайте под аккаунтом ГМа.");return}
  let ok=0,fail=[];const next=Object.assign({},IMG),old=[];
  for(const [k,f] of pairs){toast(`Загружаю ${ok+fail.length+1} из ${pairs.length}…`,true);
    try{const b=await shrinkImg(f);const r=await AS.upload(b,{type:b.type||f.type});if(next[k])old.push(next[k]);next[k]=r.id;ok++}
    catch(e){fail.push(f.name+(e&&e.code==="too_large"?" (больше 20 МБ)":e&&e.code==="unsupported_type"?" (формат не подходит)":""))}}
  if(ok){try{await DB.doc("config/treasures").set({img:next});IMG=next;IMGJSON=JSON.stringify(next);rerender()}
    catch(e){toast("Картинки загрузились, но не сохранились в базе. Обнови страницу и попробуй ещё раз.");return}
    old.forEach(id=>AS.delete(id).catch(()=>{}))}
  toast(`Готово: ${ok} загружено.`+(fail.length?`\nНе вышло: ${fail.join(", ")}`:""));
}
async function delImg(k){
  if(!IMG[k])return;const next=Object.assign({},IMG);const id=next[k];delete next[k];
  try{await DB.doc("config/treasures").set({img:next});IMG=next;IMGJSON=JSON.stringify(next);rerender();AS&&AS.delete(id).catch(()=>{});toast("Картинка убрана.")}
  catch(e){toast("Не удалось удалить. Попробуй ещё раз.")}
}

    const g=app.querySelector("#list .bar");g&&g.before(bar);
    document.getElementById("gbulk").onclick=()=>pickMany(files=>{const pairs=[],miss=[];
      for(const f of files){const n=norm(f.name);const t=TREASURES.find(x=>[x.name,x.id,x.orig.split("·").pop()].map(norm).includes(n))||TREASURES.find(x=>n.length>3&&norm(x.name).startsWith(n));t?pairs.push([t.id,f]):miss.push(f.name)}
      if(!pairs.length){toast("Ни один файл не совпал с названием сокровища.");return}
      putImgs(pairs).then(()=>{if(miss.length)toast(`Не нашёл сокровище для: ${miss.join(", ")}`)})})}
  app.querySelectorAll("[data-slot]").forEach(el=>{const k=el.dataset.slot;const w=document.createElement("span");w.className="slotbtns";
    w.innerHTML=`<button type="button" title="Заменить картинку" aria-label="Заменить картинку">✎</button>${IMG[k]?`<button type="button" class="del" title="Убрать картинку" aria-label="Убрать картинку">✕</button>`:""}`;
    w.children[0].onclick=e=>{e.stopPropagation();pickOne(f=>putImgs([[k,f]]))};
    if(w.children[1])w.children[1].onclick=e=>{e.stopPropagation();if(w.children[1].dataset.armed!=="1"){w.children[1].dataset.armed="1";w.children[1].textContent="?";setTimeout(()=>{w.children[1].dataset.armed="";w.children[1].textContent="✕"},3000);return}delImg(k)};
    el.appendChild(w)});
}

function go(id,sc){try{history.replaceState(null,"",id?"#"+id:"#")}catch(e){}route(id,sc);if(!sc)window.scrollTo(0,0)}
let CUR="";
function route(id,sc){CUR=id||"";id?renderOne(id):renderHome(sc);gmTools()}
document.getElementById("home").onclick=()=>go("");
document.getElementById("toall").onclick=e=>{e.preventDefault();go("");const l=document.getElementById("list");l&&l.scrollIntoView()};
document.getElementById("torules").onclick=e=>{e.preventDefault();go("","rules")};
route((location.hash||"").slice(1));
initDB();
</script>
