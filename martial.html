  moves:[
   M("Разбитие Сотни Кирпичей","Удар ладонью / кулаком","Как делается: удар ребром ладони или кулаком, доведённый до автоматизма годами набивки, как в тамэсивари — искусстве ломать предметы голой рукой. Боец вкладывает всю массу тела в одну точку контакта.\nКак бьёт: бьёт по корпусу или конечностям и пробивает даже жёсткую защиту за счёт полной концентрации силы в точке удара — такой удар способен расколоть стопку из сотни кирпичей.",[["str",5]],"При попадании стойкость соперника падает на 2 уровня.",[["spd",-2]],"На время исполнения удара."),
   M("Чоку Дзуки","Прямой удар + рубящий","Как делается: прямой удар кулаком по кратчайшей траектории от бедра к цели: кулак идёт в грудь снизу вверх и приподнимает соперника. Пока тот ещё в воздухе, боец добивает его рубящим ударом ребра ладони сверху вниз. Удар прост в исполнении, но требует безупречной работы бёдер и полного вложения веса тела.\nКак бьёт: первый удар ломает сопернику стойку, второй вбивает его в землю.\nКогда применять: это основа всего стиля — от постановки этого удара зависит сила всех последующих техник.",[["str",2]],"На следующий удар при точном попадании.",[],"Отсутствуют."),
   M("Базовый удар","Прямой удар рукой","Как делается: из боевой стойки боец без замаха выбрасывает передний кулак по прямой, разворачивая кулак костяшками вниз в последний момент. Плечо не поднимается, бёдра лишь чуть доворачиваются, рука сразу возвращается к подбородку.\nКак бьёт: короткий хлёсткий удар в челюсть или нос: не столько ломает, сколько встряхивает голову и сбивает ритм дыхания.\nКогда применять: первым ударом в обмене, чтобы ослепить соперника и открыть его под тяжёлую технику.",[["spd",2]],"",[],"Отсутствуют."),
   M("Базальтовый кулак","Прямой удар рукой","Как делается: боец врастает стопами в землю, опускает центр тяжести и резко скручивает бёдра и корпус, проводя силу снизу вверх по цепочке: стопа → колено → бедро → спина → плечо. Кулак летит по прямой, рука выпрямляется до конца в момент контакта и мгновенно напрягается целиком.\nКак бьёт: в точку удара приходит вся масса тела, поэтому кулак работает как каменный таран: проламывает блок, ломает рёбра и может встретить чужую атаку лоб в лоб и раздробить её.\nКогда применять: когда соперник атакует прямо — кулак в кулак, или когда нужен один тяжёлый удар через защиту.",[["str",6]],"Может встретить и сбить атаку соперника, если тот бьёт в тот же момент.",[["spd",-1]],"Нужна устойчивая стойка: в прыжке или на скользкой опоре не работает."),
   M("Тройной Базальтовый кулак","Серия прямых ударов","Как делается: три Базальтовых кулака подряд: правая, левая, снова правая. После каждого удара боец не возвращается в исходную стойку, а использует обратный разворот бёдер как замах для следующего, так что инерция не теряется.\nКак бьёт: три тяжёлых удара в одну линию, каждый ложится в момент, когда соперник ещё не оправился от предыдущего. Каждым кулаком можно встретить отдельный удар чужой серии.\nКогда применять: против многоударных связок — например, против трёх ударов Третьей стойки Хвечхука.",[["str",6],["spd",2]],"Отменяет до трёх ударов соперника в одной связке.",[["end",-2]],"Сильно выматывает руки."),
   M("Базальтовый апперкот","Апперкот","Как делается: боец ныряет под атаку, сгибая колени, и выстреливает вверх ногами, проводя этот толчок через корпус в кулак, который идёт снизу по вертикали.\nКак бьёт: кулак врезается в подбородок или солнечное сплетение и подбрасывает соперника в воздух; если рядом стоят другие, их задевает волна и тоже отрывает от земли.\nКогда применять: как ответ на размашистую атаку сверху или чтобы подбросить врага под воздушное добивание.",[["str",6]],"Подбрасывает противника (и стоящих вплотную) в воздух.",[["dur",-1]],"В момент нырка корпус открыт."),
   M("Бразильский удар","Удар ногой сверху вниз","Как делается: нога поднимается как для обычного высокого бокового удара, но на пике колено резко складывается, и голень с пяткой обрушиваются сверху вниз. Боец решает, куда бить, уже в полёте — в голову, ключицу или бедро.\nКак бьёт: удар приходит под неожиданным углом сверху, поверх поднятых рук, и вбивает соперника вниз. Блок, поставленный против бокового удара, его не ловит.\nКогда применять: против соперника, который закрывается высоко, или когда нужно приземлить противника перед добиванием.",[["str",4],["tech",2]],"Соперник получает Восприятие −2 против этого удара.",[["dur",-1]],"Пока нога в воздухе, опора одна."),
   M("Хай-кик","Удар ногой","Как делается: разворот на подушечке опорной стопы, колено поднимается к груди, и голень хлёстом заходит по кругу на уровень головы. Таз полностью доворачивается, руки прикрывают лицо.\nКак бьёт: голень врезается в висок или челюсть всей скоростью разворота — один чистый хай-кик может отключить соперника.\nКогда применять: когда соперник открыл голову — после серии по корпусу или когда он опустил руки.",[["str",4]],"",[["per",-1]],"Если соперник ждал удара, промах открывает бойца."),
   M("Срезание бычьего рога","Рубящий удар ладонью","Как делается: ладонь раскрыта, пальцы сжаты, большой палец прижат. Боец разворачивает плечо и рубит ребром ладони по диагонали сверху вниз, как топором.\nКак бьёт: ребро ладони бьёт по шее, ключице или виску; удар режущий, проходит между прямыми блоками и может вывести руку соперника из строя при ударе по ключице.\nКогда применять: против глухой прямой защиты: диагональ проходит в щель между руками.",[["str",4],["tech",1]],"",[],"Отсутствуют."),
   M("Смертельный удар","Добивающий удар","Как делается: боец замирает на мгновение, полностью расслабляется и собирает силу в одной точке, после чего выпускает её одним прямым ударом кулака. Ни одна лишняя мышца не работает, ни одна капля энергии не уходит в сторону.\nКак бьёт: вся сила тела без потерь приходит в одну точку — в голову или грудь. Удар рассчитан на то, чтобы закончить бой одним попаданием.\nКогда применять: когда соперник раскрылся или оглушён: сама подготовка удара даёт врагу мгновение на ответ.",[["str",9]],"Если попадает в незащищённого соперника — считается нокаутирующим (по решению ГМа).",[["spd",-3],["per",-2]],"На время концентрации боец уязвим."),
   M("Кулак Чёрной Черепахи","1-я стойка · прерывание","Как делается: первая стойка Четырёх Богов. Боец встречает начатую атаку соперника мощным прямым кулаком, бьющим прямо в атакующую руку, ногу или корпус, и в момент удара напрягает всё тело, как панцирь.\nКак бьёт: удар ломает атаку на старте и выпускает ударную волну, которая отталкивает всех вокруг; вокруг бойца начинает закручиваться поток воздуха для следующих стоек.\nКогда применять: первым ходом Танца Четырёх Богов — чтобы сорвать атаку соперника.",[["str",4],["dur",2]],"Прерывает технику соперника, если боец успел ударить первым.",[],"Отсутствуют."),
   M("Удар Феникса","2-я стойка · ударная волна","Как делается: вторая стойка. Боец поднимает ногу и с огромной силой топает в землю рядом с соперником или прямо по его стопе. Сила уходит в пол и расходится волной.\nКак бьёт: ударная волна бьёт противника снизу по ногам и выбивает равновесие; при сильном топе плиты пола встают дыбом и опрокидывают врага.\nКогда применять: после Кулака Черепахи — чтобы соперник потерял опору перед серией.",[["str",3],["tech",2]],"Скорость соперника −2 на следующий ход: он теряет равновесие.",[["spd",-1]],"Нужна твёрдая поверхность под ногами."),
   M("Танец Белого Тигра","3-я стойка · серия","Как делается: третья стойка. Боец без остановки обрушивает серию ударов руками и ногами под разными углами — в голову, корпус, ноги, — непрерывно двигаясь вперёд. Каждый удар продолжает вращение потока воздуха вокруг тела.\nКак бьёт: шквал ударов разламывает защиту по частям: пока соперник закрывает одно место, открывается другое. Работает и против толпы.\nКогда применять: когда соперник потерял равновесие от Удара Феникса — ломать защиту перед финалом.",[["str",4],["spd",3]],"Работает против нескольких противников одновременно.",[["end",-2]],""),
   M("Буря Синего Дракона","4-я стойка · финал","Как делается: четвёртая стойка. Первые три стойки закрутили вокруг бойца вихрь; теперь боец «берёт» его под контроль и последним мощным ударом выталкивает весь поток в соперника.\nКак бьёт: в противника врезается сжатый смерч, который режет кожу ветром и разрушает всё на пути: тело соперника покрывается порезами, а арену разносит.\nКогда применять: финалом Танца Четырёх Богов, когда соперник уже без равновесия и защиты.",[["str",10],["tech",3]],"Режущий урон по площади. Если до этого были 1–3 стойки — ещё +3 к Силе.",[["end",-4],["spd",-2]],"Без трёх предыдущих стоек сила вдвое ниже (по решению ГМа)."),
   M("Танец Четырёх Богов: Предел — Основа","Истинная форма","Как делается: после трёх стоек боец не выпускает вихрь наружу, а втягивает весь поток и энергию в себя, сжимая их вокруг тела, и затем разряжает всё одним прямым ударом кулака.\nКак бьёт: вся мощь трёх стоек приходит в одну точку: удар ощущается как столкновение с горой. Силу можно дозировать, если нужно не убить.\nКогда применять: как высшая форма финала, когда Буря Синего Дракона недостаточна.",[["str",14],["tech",4]],"",[["end",-6],["spd",-3]],"Требует выполнить три стойки перед этим. После удара — откат на ход."),
   M("Обратный Синий Дракон","Контратака","Как делается: когда на бойца летит поток ветра, он входит в него, ведёт руками по направлению потока и разворачивает его по кругу обратно.\nКак бьёт: соперник получает назад часть собственной ветряной атаки.\nКогда применять: против бойцов, атакующих ветром и вихрями.",[["tech",3],["dur",2]],"Возвращает часть урона от ветровой атаки соперника.",[["spd",-1]],""),
   M("Обратный Хвечхук Знака Дракона: Древний Синий Дракон","Контратака на удар ногой","Как делается: в момент, когда соперник выполняет вихревой удар ногой, боец касается его бьющей ноги, перехватывает рождающийся вокруг неё ветер и закручивает его в собственную Бурю Синего Дракона.\nКак бьёт: соперник получает удар собственной силой, усиленной стилем: ветер, который должен был ударить бойца, возвращается к нему смерчем.\nКогда применять: только против вихревых ударов ногами — Хвечхука Знака Дракона и похожих.",[["tech",5],["str",4]],"Работает только против вихревых ударов ногами.",[["dur",-2]],"Ошибка тайминга — удар приходит в полную силу."),
   M("Двойной удар (с Хэтхэ)","Чарёк + стойка","Как делается: боец выполняет Удар Феникса: поднимает ногу и с силой топает в землю рядом с соперником. В момент удара о пол он вливает в землю водяную силу чарёка Хэтхэ, и вода идёт следом за ударной волной.\nКак бьёт: по полу к сопернику катится волна воды, которая сбивает его с ног, заливает опору и отбрасывает назад — удар ощущается и толчком, и тяжестью воды.\nКогда применять: при контракте с водяным чарёком, вместо второй стойки Танца Четырёх Богов.",[["str",4],["ctrl",3]],"",[["gp",-2]],"Только при контракте с водяным чарёком."),
   M("Водяная стрела (с Хэтхэ)","Чарёк + серия","Как делается: боец ставит перед собой водяную стену чарёка, а затем, как в Танце Белого Тигра, бьёт по ней руками и ногами в быстром ритме. Каждый удар выбивает из стены сгусток воды.\nКак бьёт: десятки водяных снарядов летят в соперника с разных углов и накрывают его со всех сторон; каждый бьёт как камень.\nКогда применять: при водяном чарёке — чтобы атаковать на дистанции.",[["spd",3],["ctrl",3]],"Атака на дистанции.",[["gp",-2]],"Только при контракте с водяным чарёком."),
   M("Буря Водяного Дракона (с Хэтхэ)","Чарёк + финал","Как делается: Базальтовый кулак, Двойной удар и Водяная стрела закручивают поток, который боец наполняет водой чарёка и выпускает как водяного дракона.\nКак бьёт: огромная масса воды врезается в противника, давит и сносит его — не режет, а дробит ударом.\nКогда применять: финал водяного Танца Четырёх Богов.",[["str",10],["ctrl",4]],"",[["gp",-4],["end",-3]],"Только при контракте с водяным чарёком.")]},

 {id:"re-tkd",name:"Ре-Тхэквондо",orig:"Renewal Taekwondo",rarity:"special",types:["strike"],base:"Тхэквондо",
  founder:"Джин Тхэджин",masters:[["Джин Мори","главный носитель"],["Джин Тхэджин","основатель"],["Хуэй Мори","клон Джин Мори"],["Дан Мори","использовал стиль одной рукой"]],
  about:"Современное корейское боевое искусство, выросшее из мощных линейных ударов ногами ITF-тхэквондо. Джин Тхэджин создал его как ответ Северному ITF-тхэквондо: добавил удары руками, сваливания и навыки скрытного боя, чтобы бить в слабые места этой школы. Основа стиля — Хвечхук (удар с разворота) и десятки его вариаций, а вершина — «безоткатные» техники, в которых сила удара целиком уходит в цель и не возвращается в тело бойца.",
  passive:[["spd",2],["tech",2]],
  ability:["Безоткатность","Когда боец выполняет технику с идеально собранной энергией, отдача от удара не возвращается в тело — вся сила уходит в цель. Безоткатная версия любой техники стиля бьёт многократно сильнее и пробивает даже сверхпрочную броню."],
  limits:"«Безоткатность» требует безупречной базы: доступна только при Технике БИ ранга A и выше.",
  moves:[
   M("Хвечхук","Удар ногой с разворота","Как делается: боец разворачивается на подушечке опорной ноги, поднимает бьющую ногу коленом вверх и выбрасывает её по горизонтальной дуге, ведя пяткой или подошвой. Корпус уходит в сторону, руки защищают голову.\nКак бьёт: пятка врезается в висок или челюсть со всей скоростью вращения тела — удар оглушает и сносит соперника.\nКогда применять: основной удар стиля; из него вырастают почти все остальные техники.",[["str",3],["spd",2]],"",[],"Отсутствуют."),
   M("Фронтальный Хвечхук","Удар ногой","Как делается: без полного разворота: передняя нога поднимается коленом вперёд и хлёстом заходит в голову сбоку, опорная стопа доворачивается лишь наполовину.\nКак бьёт: быстрый боковой удар голенью или подъёмом в голову — слабее полного Хвечхука, но почти не оставляет времени на реакцию.\nКогда применять: как стартер связки или быстрое добивание.",[["spd",3]],"",[],"Отсутствуют."),
   M("Нижайший Хвечхук","Подсечка","Как делается: боец резко приседает почти до самого пола, опирается рукой о землю и раскручивается на опорной ноге на 180°, проводя прямую бьющую ногу над землёй по широкой дуге.\nКак бьёт: пятка подсекает обе ноги соперника сзади на уровне щиколоток, и он падает на спину, не успев понять, откуда пришёл удар.\nКогда применять: против соперника в высокой стойке или в момент, когда он готовит удар ногой.",[["tech",2],["spd",2]],"Сбивает соперника с ног при попадании.",[["dur",-1]],"Боец в низкой позиции."),
   M("Третья стойка Хвечхука","Серия из трёх ударов","Как делается: три Хвечхука подряд без пауз: первый с одной стороны, второй сразу с противоположной (смена направления вращения), третий — разворотом из-за спины.\nКак бьёт: первые два удара бьют в голову с разных сторон и встряхивают мозг, третий добивает. Если соперник пытается отступить назад, он попадает под третий удар на полной скорости.\nКогда применять: когда соперник заблокировал одиночный удар: три направления подряд закрыть невозможно.",[["str",5],["spd",4]],"Безоткатная версия (Техника БИ A+): ещё +5 к Силе.",[["per",-2]],"Во время вращения боец теряет соперника из виду."),
   M("Хвечхук Знака Дракона (Джин Хвечхук)","Вихревой удар","Как делается: Хвечхук, выполненный с такой скоростью и идеальной траекторией вращения, что воздух вокруг ноги закручивается в вихрь — «дракона».\nКак бьёт: соперник получает удар ногой и одновременно удар сжатым ветром, который отбрасывает и задевает стоящих рядом.\nКогда применять: когда обычный Хвечхук не пробивает: вихрь бьёт даже через блок.",[["str",7],["spd",3]],"Ветер задевает и стоящих рядом.",[["end",-2]],""),
   M("Удар Синего Дракона","Вихревой удар","Как делается: боец делает вихревой Хвечхук и продолжает вести рождённый поток движением ноги и корпуса, направляя «дракона» в нужную сторону.\nКак бьёт: вихрь летит к цели и может обогнуть препятствие или повернуть за уклонившимся соперником.\nКогда применять: на средней дистанции против уклоняющегося врага.",[["str",7],["tech",3]],"Атака на средней дистанции, можно менять траекторию.",[["end",-3]],""),
   M("Джин Хвечхук Ноль","Безоткатный вихрь","Как делается: боец выполняет Джин Хвечхук, но так, что вращение тела, удар ноги и рождающийся вихрь идеально синхронизированы: ни одно движение не тормозит другое, и отдача не возвращается в тело.\nКак бьёт: нога и вихрь сливаются в одну безоткатную волну, вся энергия которой уходит в соперника, — удар пробивает любую защиту и сносит цель.\nКогда применять: как финальный удар при Технике БИ A+.",[["str",12],["spd",4]],"",[["end",-5]],"Только при Технике БИ A+."),
   M("Аран","Удар локтем","Как делается: на ближней дистанции боец доворачивает бёдра и плечо и проводит согнутый локоть короткой горизонтальной дугой в голову или корпус соперника.\nКак бьёт: локоть ломает защиту, а от точки удара расходится ударная волна, которая отбрасывает соперника и разрывает клинч.\nКогда применять: в клинче или когда соперник прорвался вплотную и ногам не размахнуться.",[["str",4]],"Волна отталкивает соперника, разрывая клинч.",[],"Отсутствуют."),
   M("Клыки","Двойной удар локтями","Как делается: боец поднимает оба локтя над головой, сводит их и одновременно обрушивает вниз, как сомкнувшиеся челюсти.\nКак бьёт: два локтя бьют по плечам, ключицам или затылку — соперник проваливается вниз и теряет стойку.\nКогда применять: когда соперник согнулся или пытается пройти в ноги.",[["str",5]],"",[["dur",-1]],"Корпус открыт снизу."),
   M("Ловец Дракона","Бросок","Как делается: боец прыгает с вращением, в полёте обхватывает шею соперника рукой и, выходя из оборота, всем весом тянет его за собой вниз, разворачивая головой к земле.\nКак бьёт: соперник врезается головой в землю с силой вращения и веса бойца — тяжёлый бросок-добивание.\nКогда применять: как добивание после подбрасывающих ударов.",[["str",5],["tech",3]],"",[["dur",-2]],"Если соперник вырвался — боец падает сам."),
   M("Пэкту","Удар коленом","Как делается: боец делает короткий шаг вперёд и резко поднимает колено вверх, толкая таз навстречу сопернику.\nКак бьёт: колено врезается в подбородок или лицо и подбрасывает соперника вверх, открывая его для воздушной связки. Безоткатная версия бьёт многократно сильнее.\nКогда применять: навстречу нырку или наклону соперника.",[["str",4]],"Подбрасывает соперника для комбо.",[],"Отсутствуют."),
   M("Бо-Бып","Передвижение","Как делается: особая работа ног: боец переносит вес и толкается так резко, что тело смещается рывком без видимой подготовки. Со стороны это выглядит как телепортация.\nКак бьёт: сам не бьёт, но за долю секунды выводит бойца за спину или сбоку от соперника, откуда следующий удар приходит неожиданно.\nКогда применять: перед любой атакой, чтобы ударить с неожиданной стороны.",[["spd",5]],"Следующая атака заходит с неожиданной стороны: соперник −2 Восприятия против неё.",[["end",-1]],""),
   M("Топор","Удар ногой сверху","Как делается: боец отталкивается, в прыжке поднимает прямую ногу выше головы соперника и рубит ей вниз, как топором, после чего по инерции уходит в сальто вперёд.\nКак бьёт: пятка обрушивается на голову или плечо, а воздушная волна от удара отрывает от земли соперников вокруг точки удара.\nКогда применять: против группы или соперника, закрывшегося спереди.",[["str",5]],"Подбрасывает соперников вокруг точки удара.",[["dur",-1]],"После сальто нужно время, чтобы встать в стойку."),
   M("Пэк Рок","Удар ногой вверх","Как делается: боец поднимает ногу строго снизу вверх по вертикали на 180°, проводя стопу вдоль центральной линии тела соперника.\nКак бьёт: стопа врезается в подбородок снизу и запрокидывает голову назад, открывая горло и корпус.\nКогда применять: когда соперник наклонился вперёд или бросился в атаку.",[["str",4],["spd",1]],"",[],"Отсутствуют."),
   M("Давление воздуха","Ударная волна","Как делается: боец делает резкий хлопок ладонями или быстрый взмах ногой, сжимая перед собой воздух в плотный сгусток, и направляет его в соперника.\nКак бьёт: волна давления бьёт в лицо и грудь, сбивает дыхание и ритм; урон небольшой, но атака соперника срывается.\nКогда применять: чтобы сбить атаку на расстоянии.",[["spd",2],["per",1]],"Атака на дистанции.",[],"Отсутствуют."),
   M("Ледяной удар","Контр-удар ногой","Как делается: когда удары ногами сталкиваются, рождается турбулентность; боец ловит её своим ударом и закручивает в противоположную сторону.\nКак бьёт: чужой поток гасится полностью, сила вражеского удара обнуляется.\nКогда применять: против вихревых и огненных ударов ногами.",[["tech",5],["dur",3]],"Гасит вихревую или огненную атаку ногой.",[["spd",-1]],""),
   M("Захват серпом","Подсечка-захват","Как делается: боец заводит ногу крюком за ногу или шею соперника, как серп, и резко дёргает её на себя, одновременно толкая корпус соперника рукой в обратную сторону.\nКак бьёт: соперник теряет опору и падает в сторону бойца, прямо под добивание.\nКогда применять: перед Волчком или любым ударом по падающему.",[["tech",3]],"Соперник теряет равновесие: −1 Скорость на ход.",[],"Отсутствуют."),
   M("Волчок","Двойной удар с разворота","Как делается: пока соперник падает после Захвата серпом, боец не останавливает вращение, а закручивается дальше и бьёт двумя ударами ногой с разворота подряд.\nКак бьёт: две пятки одна за другой приходят в падающего соперника, который не может ни закрыться, ни увернуться.\nКогда применять: сразу после Захвата серпом.",[["str",4],["spd",2]],"",[["per",-1]],""),
   M("Земляная борозда","Низкий удар","Как делается: боец приседает и раскручивается на месте, вдавливая носок бьющей ноги в землю, и ведёт ногу по дуге на уровне колен соперника.\nКак бьёт: нога бьёт по коленям, вывернутая земля и обломки летят в соперника, а вращение у самой земли разбивает встречный поток ветра.\nКогда применять: против бойцов, атакующих ветром, и против высокой стойки.",[["str",3],["tech",3]],"Гасит ветровую атаку низом.",[["dur",-1]],""),
   M("Гор Ё","Двойной удар ногой","Как делается: боец поднимает бьющую ногу и, не опуская её на пол, дважды хлещет ей по горизонтали — туда и обратно.\nКак бьёт: два удара в голову за одно движение: первый заставляет поднять блок, второй попадает с другой стороны.\nКогда применять: когда соперник блокирует первый удар.",[["spd",4]],"",[],"Отсутствуют."),
   M("Прямой удар ногой","Удар ногой","Как делается: боец поднимает колено к груди, выводит его на цель и выстреливает стопу вперёд по прямой, толкая бедром.\nКак бьёт: подошва врезается в живот или грудь и отталкивает соперника назад, сбивая его наступление.\nКогда применять: чтобы держать дистанцию.",[["str",2],["spd",1]],"",[],"Отсутствуют."),
   M("Чонгвон","Прямой удар рукой","Как делается: прямой удар кулаком по центральной линии с короткой подачей бедра; Джин Тхэджин добавил удары руками в стиль именно для ближней дистанции. Обычно бьётся сериями.\nКак бьёт: быстрые удары в лицо и грудь не дают сопернику войти в ближний бой и сбивают его, пока ноги заняты.\nКогда применять: когда соперник лезет вплотную и ногам тесно.",[["spd",3]],"",[],"Отсутствуют."),
   M("Халла","Удар ногой вверх","Как делается: боец резко поднимает ногу снизу вверх по центральной линии, разгибая колено в последний момент.\nКак бьёт: стопа врезается под подбородок, голова соперника уходит назад, и корпус раскрывается для следующего удара.\nКогда применять: навстречу атакующему сопернику.",[["str",3],["spd",2]],"",[],"Отсутствуют."),
   M("Сокса","Удар коленом","Как делается: боец хватает соперника за плечи или затылок, притягивает его на себя и одновременно бьёт коленом вверх.\nКак бьёт: колено врезается в лицо или солнечное сплетение с двойной силой — навстречу притянутому телу.\nКогда применять: в клинче или навстречу нырку.",[["str",4]],"",[],"Отсутствуют."),
   M("Тхэбэк","Боковой удар ногой","Как делается: боец поднимает колено, разворачивает корпус боком к сопернику и выстреливает ногой ребром стопы в сторону, как поршнем.\nКак бьёт: стопа таранит корпус и отбрасывает соперника, не давая ему подойти.\nКогда применять: против наступающего соперника.",[["str",4]],"Отбрасывает соперника.",[],"Отсутствуют."),
   M("Силла","Удар ногой вниз","Как делается: боец поднимает ногу высоко над головой соперника и опускает её вниз, вкладывая вес тела.\nКак бьёт: пятка бьёт сверху по голове, затылку или плечам и вбивает соперника вниз.\nКогда применять: чтобы добить пригнувшегося соперника.",[["str",4]],"",[],"Отсутствуют."),
   M("Ножницы","Прыжковый удар","Как делается: боец прыгает и в воздухе выбрасывает ногу по диагонали, а вторая нога уходит в противоположную сторону, как раскрывающиеся лезвия ножниц.\nКак бьёт: удар голенью или стопой приходит по шее и голове под непривычным диагональным углом.\nКогда применять: против соперника, ожидающего горизонтальных ударов.",[["str",3],["spd",2]],"",[["dur",-1]],"В воздухе нет опоры."),
   M("Нигава","Удар с сальто","Как делается: боец отталкивается и уходит в сальто назад; в верхней точке он бьёт ногой, а приземляясь, обрушивает стопу на упавшего соперника.\nКак бьёт: первый удар подбрасывает или роняет соперника, второй добивает его сверху ударом стопы.\nКогда применять: в ближнем бою, чтобы разорвать дистанцию и сразу ударить.",[["str",4],["spd",2]],"",[["end",-1]],""),
   M("Восходящий удар назад","Удар ногой","Как делается: не оборачиваясь, боец переносит вес на опорную ногу, наклоняет корпус вперёд и выбрасывает другую ногу назад и вверх пяткой.\nКак бьёт: пятка врезается в корпус или подбородок того, кто зашёл со спины или прыгнул сзади.\nКогда применять: против атаки сзади.",[["str",3],["per",1]],"",[],"Отсутствуют."),
   M("Обратный размашистый удар","Удар ногой","Как делается: боец разворачивается спиной к сопернику на опорной ноге и проводит прямую ногу пяткой по широкому кругу.\nКак бьёт: пятка врезается в голову с огромной инерцией разворота, но на мгновение боец теряет соперника из виду.\nКогда применять: когда соперник ждёт удара спереди.",[["str",4]],"",[["per",-1]],"Секунду боец не видит соперника."),
   M("Раундхаус","Круговой удар","Как делается: боец разворачивает опорную стопу, поднимает колено сбоку и выбрасывает ногу по кругу, ударяя подъёмом стопы или голенью.\nКак бьёт: удар в корпус или голову сбоку — быстрый и универсальный.\nКогда применять: как базовый удар для связок.",[["str",3],["spd",1]],"",[],"Отсутствуют."),
   M("Мах-панч","Удар рукой","Как делается: боец разгоняет прямой удар рукой до такой скорости, что воздух перед кулаком сжимается в волну.\nКак бьёт: сначала кулак, а сразу за ним ударная волна сжатого воздуха — соперник получает двойной толчок.\nКогда применять: для быстрой атаки на скорости.",[["spd",5]],"",[["end",-1]],""),
   M("Винтовой удар","Удар рукой","Как делается: прямой удар кулаком, который в последнюю треть траектории резко скручивается предплечьем вокруг своей оси, как сверло.\nКак бьёт: вращающийся кулак ввинчивается в защиту и проходит сквозь блок, а не останавливается на нём.\nКогда применять: против бойцов, закрывающихся руками.",[["str",3],["tech",2]],"Игнорирует 1 уровень Стойкости соперника.",[],"Отсутствуют."),
   M("Звуковой удар рукой и ногой","Серия","Как делается: боец разгоняет руку или ногу быстрее скорости звука, без замаха и подготовки.\nКак бьёт: удар приходит раньше, чем соперник слышит хлопок, — увидеть и увернуться почти невозможно.\nКогда применять: только при огромной Скорости.",[["spd",7],["str",3]],"",[["end",-3]],"Только при Скорости ранга A+."),
   M("Пробивание защиты","Связка","Как делается: боец ныряет под боковой удар ногой, ловит голень соперника и зажимает её на своём бицепсе, после чего тянет на себя и бьёт коленом в голову.\nКак бьёт: соперник стоит на одной ноге, не может отступить и получает колено в голову.\nКогда применять: против бойцов, бьющих ногами по кругу.",[["tech",3],["str",3]],"Отменяет блок соперника.",[],"Отсутствуют."),
   M("Двойной драконий удар","Вихревой удар","Как делается: два вихревых удара разными ногами подряд: первый рождает вихрь, второй — второй вихрь с противоположным вращением, и боец направляет их так, чтобы они сошлись на цели.\nКак бьёт: два «дракона» сталкиваются на сопернике, и его зажимает между встречными потоками.\nКогда применять: когда одного вихря мало.",[["str",7],["spd",3]],"",[["end",-3]],""),
   M("Удар Громового Дракона","Удар + молния","Как делается: боец вбирает в ногу молнию и выполняет вихревой удар, так что вихрь пронизан электричеством.\nКак бьёт: удар ногой, вихрь и молния бьют одновременно; но молния проходит и через самого бойца, раня его.\nКогда применять: как отчаянный финальный удар.",[["str",12],["spd",4]],"",[["dur",-4]],"Боец получает часть урона сам."),
   M("Рельсотрон","Удар + оружие","Как делается: боец ставит посох Жуи (или любой длинный шест) перед собой остриём к цели и бьёт ногой по его торцу.\nКак бьёт: посох вылетает как снаряд рельсотрона и пробивает цель на большой дистанции.\nКогда применять: при наличии посоха — против дальней цели.",[["str",10],["spd",5]],"Атака на большой дистанции.",[["end",-3]],"Нужен длинный предмет-снаряд."),
   M("Ориджинал Джин Мори: Ось (Чичхук)","Удар + посох","Как делается: боец вбивает посох в землю как якорь, хватается за него и раскручивается вокруг, используя посох как ось вращения, чтобы набрать огромную скорость.\nКак бьёт: удар ногой с этой скоростью оставляет в земле целое ущелье.\nКогда применять: как сокрушительный удар по площади.",[["str",14]],"",[["end",-5],["spd",-2]],"Нужен посох или прочный шест."),
   M("Безоткатный удар","Концепция","Как делается: не отдельный удар, а принцип: тело работает так слаженно, что отдача от удара не возвращается в бойца, а целиком уходит в цель. Применим к любой технике стиля.\nКак бьёт: вся сила удара переходит в соперника — техника бьёт многократно сильнее и пробивает даже сверхпрочную броню.\nКогда применять: при Технике БИ A+, вместе с любой техникой стиля.",[["str",6]],"Добавляется к любой другой технике стиля.",[["end",-2]],"Только при Технике БИ A+."),
   M("Подарочный набор (Хуэй Мори)","Ультимативная связка","Как делается: Хуэй Мори связывает все свои техники в одну нескончаемую серию: каждый удар заканчивается стартом следующего.\nКак бьёт: соперник получает удар за ударом из всего арсенала стиля без единой паузы.\nКогда применять: как полный финал.",[["str",10],["spd",6]],"",[["end",-6]],"После связки боец выдохся."),
   M("Удар Имуги (Хуэй Мори)","Вихревой удар","Как делается: вихревой удар ногой, в котором поток закручивается не в дракона, а в длинного змея-имуги, обвивающего цель.\nКак бьёт: вихрь-змей обвивает и сносит соперника, сдавливая его потоком.\nКогда применять: как альтернатива Знаку Дракона.",[["str",8]],"",[["end",-3]],"")]},
 {id:"moonsword",name:"Стиль Лунного Меча",orig:"Moon Light Sword Style",rarity:"special",types:["weapon","strike"],base:"Неизвестно",
  founder:"Неизвестен (25 мастеров меча носили титул)",masters:[["Ю Мира","нынешний мастер меча"],["Отец Ю Миры","прошлый мастер меча"],["Жрец Рю","мастер стиля"],["Судья P","копировал стиль на финале турнира"]],
  about:"Фехтовальное искусство, которым владеет Ю Мира. Главный принцип — выбирать технику под ситуацию: давить грубой силой, когда она есть, и гибкостью, когда её не хватает. Техники называются «танцами» и пронумерованы. Происхождение стиля почти неизвестно. Кроме танцев с мечом, у стиля есть безмечная ветвь для боя голыми руками.",
  passive:[["tech",2],["spd",1],["per",1]],
  ability:["Безмечный стиль","Ладонь становится клинком: боец может применять приёмы стиля без оружия — резать ребром ладони и посылать волну ки через ладони."],
  limits:"Танцы с мечом требуют клинка или длинного предмета (палки, трубы). Без оружия доступна только безмечная ветвь.",
  moves:[
   M("8-й танец: Падение Луны","Меч · дуговой удар","Как делается: клинок поднимается над правым плечом остриём назад. Боец делает полшага вперёд и опускает меч по нисходящей дуге справа налево, проводя остриё через линию глаз соперника, — как заходящий полумесяц.\nКак бьёт: остриё режет по лицу и глазам. Глубокий разрез может навсегда лишить соперника зрения, лёгкий — заливает глаза кровью.\nКогда применять: когда соперник поднимает голову или открывает лицо, атакуя сверху.",[["str",3],["spd",2]],"При попадании по лицу соперник −2 Восприятия до конца боя (по решению ГМа).",[],"Отсутствуют."),
   M("13-й танец: Вихрь","Меч · контратака","Как делается: боец не уходит от удара, а разворачивается всем телом навстречу ему, принимая атаку плоскостью клинка. Не останавливая разворот, он доводит меч по кругу и режет в бок, который соперник открыл своим же ударом.\nКак бьёт: защита и атака в одном движении: чужой удар соскальзывает по клинку в сторону, а продолжение того же разворота рассекает соперника.\nКогда применять: только в ответ на удар соперника — это контратака.",[["dur",2],["str",2]],"Контратака: срабатывает в ответ на удар соперника.",[["spd",-1]],""),
   M("14-й танец: Бумеранг","Меч · бросок","Как делается: боец закручивает меч кистью и бросает его с вращением по изогнутой дуге, рассчитывая траекторию так, чтобы клинок описал петлю.\nКак бьёт: вращающийся меч пролетает большое расстояние, режет цель на лету и по той же петле возвращается в руку хозяина.\nКогда применять: против цели на дистанции; пока меч летит, боец безоружен.",[["spd",3]],"Атака на дистанции.",[],"Пока меч в полёте, боец безоружен."),
   M("17-й танец","Меч · воздушный","Как делается: танец исполняется только в воздухе — в прыжке или при падении: тело и клинок вращаются вместе, и удар наносится с высоты.\nКак бьёт: полностью танец в манхве не показан; удар приходит сверху или в полёте под непривычным углом.\nКогда применять: в воздухе; точный эффект решает ГМ.",[["spd",3],["tech",2]],"",[["dur",-1]],"Только в воздухе."),
   M("28-й танец: Рассечение","Меч · горизонтальный удар","Как делается: боец отводит клинок за спину на уровне пояса и, разворачивая корпус, проводит идеально ровный горизонтальный разрез. Важна не сила, а точность линии: лезвие идёт строго по одной плоскости.\nКак бьёт: разрез настолько чистый, что режет стекло и металл; мастер рассекает машину даже простой деревянной палкой.\nКогда применять: против брони, оружия и препятствий.",[["str",5]],"Работает с любым длинным предметом.",[["spd",-2]],"На время замаха."),
   M("35-й танец: Марионетки","Меч · выхватывание","Как делается: меч остаётся в ножнах до последнего момента. Боец рывком проходит мимо группы противников и выхватывает клинок одним непрерывным движением, рисуя им несколько линий за один проход.\nКак бьёт: каждый из минимум трёх соперников получает несколько разрезов по разным частям тела, и они падают, как марионетки с перерезанными нитями.\nКогда применять: против группы противников.",[["spd",5],["tech",2]],"Атакует до трёх целей.",[["end",-2]],"Сильно выматывает."),
   M("Опадающие листья","Меч · серия","Как делается: три быстрых удара подряд, без возврата клинка: сверху вниз в голову, горизонтально в живот и снизу по подколенной впадине. Клинок «падает» с уровня на уровень, как лист.\nКак бьёт: верх, середина и низ поражаются почти одновременно — закрыть все три уровня одним блоком невозможно.\nКогда применять: против бойца, который полагается на один крепкий блок.",[["spd",3],["tech",1]],"",[],"Отсутствуют."),
   M("Буйство Полной Луны","Меч · шквал","Как делается: боец резко ускоряется и рубит без остановки, постоянно смещаясь вокруг соперника, так что каждый следующий удар приходит с новой стороны.\nКак бьёт: шквал разрезов под разными углами: соперник не успевает перестроить защиту, и удары проходят один за другим.\nКогда применять: как основная атакующая серия, когда соперник уже на пятках.",[["str",4],["spd",4]],"",[["end",-3]],"После серии боец вымотан."),
   M("Лунное гало","Меч · нисходящий удар","Как делается: клинок поднимается по широкой дуге, похожей на нимб, и опускается вниз; вся сила удара собирается в последней трети траектории.\nКак бьёт: мощный нисходящий разрез рассекает даже бронекостюм — так был прорезан доспех эксперимента Короля Обезьян.\nКогда применять: против бронированных противников.",[["str",6],["tech",2]],"Игнорирует 2 уровня Стойкости брони.",[["spd",-1]],""),
   M("Небесный Разрез","Меч · вертикальный удар","Как делается: боец поднимает клинок высоко над головой, собирает силу всего тела и проводит вертикальный удар сверху вниз, продолжая линию далеко за пределы клинка.\nКак бьёт: разрез уходит так далеко вверх и вниз, что рассекает облака и раскалывает гору надвое.\nКогда применять: как ультимативный удар по огромной цели.",[["str",14],["tech",4]],"Огромная дальность по вертикали.",[["end",-6],["spd",-2]],"Долгий замах."),
   M("Раскол Галактики","Меч · рубящий","Как делается: боец поднимает меч обеими руками высоко над головой, приседает, напрягая всё тело, и обрушивает клинок вниз, вкладывая в удар вес и разгибание ног.\nКак бьёт: разрез проходит через соперника сверху вниз и раскалывает землю под ним длинной трещиной.\nКогда применять: против соперника прямо перед бойцом.",[["str",8]],"",[["spd",-2]],""),
   M("Раскол Горы","Меч · рубящий с шагом","Как делается: клинок поднимается высоко вверх, боец делает широкий шаг вперёд и рубит вниз ровно в момент постановки ноги, так что в удар уходит вся инерция шага.\nКак бьёт: нисходящий удар обрушивается с силой гигантской волны и сносит защиту.\nКогда применять: чтобы закончить сближение мощным ударом.",[["str",7]],"",[["spd",-2]],""),
   M("Ледяной шторм","Меч · шквал","Как делается: боец рубит, не останавливаясь, в разных направлениях и из разных положений тела — с разворота, в низкой стойке, в прыжке, — как будто вокруг него метель.\nКак бьёт: град разрезов накрывает всё вокруг: Рю за мгновение разрубил так двух Жрецов на куски.\nКогда применять: против нескольких противников вплотную.",[["str",6],["spd",5]],"Атакует несколько целей рядом.",[["end",-4]],""),
   M("Тонкое скольжение","Меч · диагональный","Как делается: боец без замаха ведёт клинок по короткой диагонали сверху вниз — от плеча соперника к противоположному бедру, скользя лезвием.\nКак бьёт: быстрый точный разрез, который трудно заметить заранее, рассекает корпус наискось.\nКогда применять: для быстрой контратаки, когда нет времени на замах.",[["spd",3]],"",[],"Отсутствуют."),
   M("Нулевой месяц","Меч · особый","Как делается: особая техника вне счёта пронумерованных танцев; в манхве её механика не раскрыта. На сервере ГМ описывает её как мощный удар, собирающий силу всех танцев в одном движении.\nКак бьёт: мощный удар клинком; точный эффект и форму определяет ГМ.\nКогда применять: по решению ГМа.",[["str",6],["tech",3]],"",[["end",-3]],""),
   M("Разрез морского тумана","Меч · скрытный","Как делается: боец прячет клинок за телом или опускает его в тень так, что соперник не видит положение лезвия, и бьёт из этого скрытого положения, не показывая траекторию до последнего момента.\nКак бьёт: соперник видит удар слишком поздно — меч появляется словно из тумана и рассекает его.\nКогда применять: против соперника, который внимательно следит за клинком.",[["spd",4],["tech",2]],"Соперник −1 Восприятия против удара.",[],"Отсутствуют."),
   M("Дуговой лунный разрез (Судья P)","Меч · двуручный","Как делается: два меча поднимаются к противоположным плечам, и боец одновременно проводит ими два встречных диагональных разреза.\nКак бьёт: клинки сходятся крест-накрест, оставляя на сопернике Х-образную рану.\nКогда применять: только с двумя клинками.",[["str",5],["spd",2]],"",[["end",-2]],"Нужны два клинка."),
   M("Яростный сотрясающий разрез (Судья P)","Меч · выпад","Как делается: клинок оттягивается назад к бедру остриём вперёд, боец сжимается, как пружина, и выстреливает вперёд глубоким выпадом.\nКак бьёт: колющий удар пробивает защиту и пронзает соперника насквозь.\nКогда применять: против соперника прямо перед собой.",[["str",5]],"",[["dur",-1]],""),
   M("Лунный свет × Пумба: Кубическая нарезка","Меч · совместная","Как делается: двумя клинками боец одновременно выполняет движения Лунного Меча и Пумбы, проходя по объекту частой сеткой горизонтальных и вертикальных разрезов.\nКак бьёт: препятствие распадается на ровные кубы — так Ю Мира разрезала преграду на куски.\nКогда применять: против стен, машин и крупных объектов.",[["str",6],["tech",4]],"",[["end",-3]],"Нужны два клинка и знание Пумбы."),
   M("1-й танец: Кран","Безмечный · захват","Как делается: боец хватает голову соперника двумя руками — одна на подбородке, другая на затылке — и резким рывком скручивает её, как кран.\nКак бьёт: тяжёлая травма шеи; может повторяться несколько раз подряд.\nКогда применять: без оружия, вплотную, особенно в ярости.",[["str",4]],"",[["dur",-2]],"Требует подойти вплотную."),
   M("Режущая ладонь","Безмечный","Как делается: пальцы плотно сжаты, ладонь напряжена и становится плоской, как клинок. Боец рубит ребром ладони, повторяя траекторию удара мечом — сверху наискось или горизонтально.\nКак бьёт: ребро ладони рассекает плоть почти как настоящий меч, оставляя резаную рану.\nКогда применять: когда оружия нет.",[["str",3]],"",[],"Отсутствуют."),
   M("Пронзающий импульс","Безмечный · ки","Как делается: боец ставит ладонь на тело соперника или бьёт ей вплотную и в момент касания выпускает через ладонь волну ки.\nКак бьёт: ударная волна отбрасывает противника на большое расстояние и подбрасывает его в воздух.\nКогда применять: без оружия, чтобы разорвать дистанцию.",[["str",3]],"Отбрасывание.",[["gp",-1]],""),
   M("Взрыв Божественного Пальца","Безмечный · снаряд","Как делается: мелкий предмет — камешек, монету, осколок — боец кладёт на сгиб пальца и выстреливает щелчком с огромной силой.\nКак бьёт: снаряд летит со скоростью пули и пробивает дерево и тело.\nКогда применять: против цели на дистанции.",[["spd",3],["per",2]],"Атака на дистанции.",[],"Отсутствуют.")]},

 {id:"nabong",name:"Игла Набон",orig:"Nabong Needle Ryu",rarity:"special",types:["medic","strike"],base:"Акупунктура",
  founder:"Вероятно, На Бончим",masters:[["На Бончим","«Божественный доктор», член Шестёрки"],["Джин Мори","освоил открытие точек"],["Ли Хянтан","ученица"],["Хуэй Мори","копия стиля"],["Нефритовый Император","владеет"],["666: Сатана","владеет"]],
  about:"Боевое искусство на основе акупунктуры: быстрые и мощные удары пальцами работают как иглы по точкам давления и жизненным точкам. Удар может ослабить противника, вернуть чувствительность онемевшей конечности, остановить кровь союзнику или сорвать ограничители собственного тела. Самый опасный стиль в руках того, кто знает анатомию.",
  passive:[["tech",2],["per",2]],
  ability:["Карта точек","Боец видит точки давления противника: при точном попадании по нужной точке может временно снизить один параметр соперника на 1 уровень."],
  limits:"Техники снятия ограничителей опасны для жизни: «Без боли» вместе со «Снятием ограничителей» может убить человека.",
  moves:[
   M("Иглоукалывание","Точки","Как делается: боец складывает пальцы в «иглу» и бьёт кончиками точно в выбранную точку на теле. Чтобы ослабить врага, он бьёт по точкам, через которые идёт сила; чтобы помочь союзнику, — по точкам, отвечающим за чувствительность.\nКак бьёт: внешне удар почти не наносит урона, но меняет состояние тела: у врага слабеет параметр, у союзника возвращается чувствительность онемевшей конечности.\nКогда применять: в любом бою; промах по точке может навредить самому бойцу.",[["tech",2]],"Снижает параметр соперника на 1 уровень или лечит онемение союзника.",[],"При провале броска ГМ может обратить эффект на бойца."),
   M("Запечатывающая кровь игла","Точки","Как делается: боец быстро бьёт пальцем по нескольким меридианам вокруг одного участка тела, перекрывая пути, по которым кровь уходит из этого места.\nКак бьёт: кровь перестаёт выходить из запечатанного участка, скапливается и давит изнутри: рвутся сосуды, появляются тяжёлые внутренние повреждения.\nКогда применять: против выносливых соперников, которых не берут обычные удары.",[],"Выносливость соперника −2 до конца боя.",[["spd",-1]],""),
   M("Блок артерий","Точки","Как делается: боец наносит серию быстрых тычков пальцами вдоль артерий руки или ноги, пережимая их в нескольких точках.\nКак бьёт: кровь перестаёт поступать в конечность, она немеет, и соперник не может ей пользоваться, пока блок не снимут.\nКогда применять: чтобы выключить руку или ногу соперника.",[],"Скорость и Сила соперника −2 на 2 поста (или блок одной конечности).",[],"Отсутствуют."),
   M("Нейтрализация акупунктуры","Точки · защита","Как делается: боец бьёт по точкам, противоположным тем, в которые ударили, отменяя чужое воздействие; Хуэй Мори делал это даже ногой.\nКак бьёт: эффект чужого точечного удара снимается: возвращаются кровоток, чувствительность и сила.\nКогда применять: когда ты или союзник под действием точечной техники.",[["tech",2]],"Снимает один эффект точечного удара.",[],"Отсутствуют."),
   M("Без боли","Самоусиление","Как делается: боец бьёт себя пальцем в определённую точку у сердца, отключая ограничители, связанные с болью.\nКак бьёт: скорость и сила резко растут, а боль не чувствуется часами: Джин Мори так разгонялся до невидимой скорости и ломал Щит Эгиды.\nКогда применять: в критической ситуации; когда эффект кончится, вся боль придёт разом.",[["str",6],["spd",6]],"",[["dur",-3]],"Когда эффект закончится — сильный откат и вся накопленная боль разом."),
   M("Снятие ограничителей","Самоусиление","Как делается: боец принимает Пилюлю Мудреца и бьёт себя пальцем в точку в голове, отключая все ограничители тела.\nКак бьёт: все параметры резко возрастают, тело работает на пределе своих возможностей.\nКогда применять: только с Пилюлей Мудреца — без неё, особенно вместе с «Без боли», это может убить человека.",[["all",9]],"",[["end",-6]],"Без Пилюли Мудреца — смертельно опасно. Вместе с «Без боли» может убить человека."),
   M("Пентаграмма","Точки · печать","Как делается: пальцем-иглой боец быстро «рисует» в воздухе пятиугольник, вкладывая силу в каждую линию, и направляет фигуру на соперника.\nКак бьёт: фигура работает как печать: она гасит способность чарёка соперника — так На Бончим остановил силу Пак Мубона.\nКогда применять: против сильной способности чарёка.",[["tech",5],["ctrl",4]],"Может погасить одну способность чарёка соперника.",[["gp",-3]],""),
   M("Ыйён Бончим","Лечение","Как делается: боец по очереди бьёт по десятку меридианных точек на теле пациента в строгом порядке — от груди к рукам и животу.\nКак бьёт: кровотечение останавливается, часть ран начинает заживать.\nКогда применять: вне боя или во время передышки.",[],"Восстанавливает союзнику или себе 1 уровень Стойкости (раз за бой).",[["spd",-2]],"Требует времени вне боя."),
   M("Лечение Дим Мак","Лечение · боевое","Как делается: быстрая серия тычков по нескольким ключевым точкам прямо посреди боя — гораздо быстрее, чем полное лечение.\nКак бьёт: снимает часть ранения, но пациенту нельзя перенапрягаться, иначе эффект сорвётся.\nКогда применять: в бою, чтобы быстро вернуть союзника.",[],"Снимает 1 штраф от ранения.",[["end",-1]],"Пациент не должен перенапрягаться."),
   M("Мгновенная смерть","Точки · смертельный","Как делается: боец бьёт сложенными пальцами точно в сердце, вкладывая силу в глубину, а не в поверхность.\nКак бьёт: удар должен остановить сердце и убить на месте.\nКогда применять: только против незащищённого соперника и с разрешения ГМа.",[["tech",6]],"Против неподготовленного соперника — смертельный удар (только с разрешения ГМа).",[["spd",-2]],"Нужен точный удар в незакрытую грудь."),
   M("Временная анабиоза","Точки","Как делается: боец бьёт пальцем в «ямку» под рёбрами — слабое место над желудком.\nКак бьёт: соперник ненадолго впадает в состояние мнимой смерти и выпадает из боя.\nКогда применять: чтобы выключить соперника, не убивая его.",[["tech",4]],"Соперник пропускает ход.",[],"Отсутствуют.")]},

 {id:"ssamsu",name:"Ссамсу Тхэккён",orig:"Ssam-Su Taekkyeon",rarity:"original",types:["strike"],base:"Тхэккён + Ре-Тхэквондо",
  founder:"Пак Ильтхэ",masters:[["Пак Ильпхё","первый мастер, внук основателя"],["Пак Ильтхэ","основатель, солдат отряда Джин Тхэджина"],["Джин Мори","освоил частично"]],
  about:"Стиль создал Пак Ильтхэ, солдат из отряда Джин Тхэджина: во время операции «Гильгамеш» он писал письма сыну, где соединял Практический Тхэккён с Ре-Тхэквондо, закрывая слабые места одного приёмами другого. Ильтхэ погиб, письма дошли только до его внука Пак Ильпхё. Упор на сильные и быстрые удары ногами, подсечки и работу всем телом. Узнаётся по характерному дыханию тхэккёна: короткое «ик» и протяжное «и-ик».",
  passive:[["spd",2],["per",1]],
  ability:["Ритм Тхэккёна","Текучие раскачивающиеся движения сбивают противника с толку: первая атака в бою против бойца Ссамсу получает Восприятие −1."],
  limits:"Отсутствуют.",
  moves:[
   M("Хвечхук","Удар ногой с разворота","Как делается: разворот на подушечке опорной стопы, колено бьющей ноги поднимается, и нога выбрасывается по горизонтальной дуге пяткой вперёд. Приём унаследован от Ре-Тхэквондо.\nКак бьёт: пятка бьёт в висок или челюсть всей скоростью вращения корпуса.\nКогда применять: основной удар ногой стиля.",[["str",3],["spd",2]],"",[],"Отсутствуют."),
   M("Хвечхук Знака Дракона","Вихревой удар","Как делается: боец выполняет Хвечхук на предельной скорости и с идеально ровной траекторией вращения, так что воздух вокруг бьющей ноги закручивается в вихрь.\nКак бьёт: соперник получает удар ногой и одновременно удар сжатым ветром, который задевает и тех, кто стоит рядом.\nКогда применять: когда обычный удар не пробивает защиту.",[["str",7],["spd",3]],"",[["end",-2]],""),
   M("Бо-Бып","Передвижение","Как делается: резкие смещающие шаги, взятые из Ре-Тхэквондо: боец толкается и переносит вес так, что тело смещается рывком без подготовки.\nКак бьёт: сам не бьёт, но выводит бойца за спину или сбоку от соперника.\nКогда применять: перед атакой, чтобы ударить с неожиданной стороны.",[["spd",5]],"",[["end",-1]],""),
   M("Боевой пульс","Ладонь · ки","Как делается: боец кладёт ладонь на цель или бьёт ей вплотную и в момент касания выпускает через неё импульс энергии.\nКак бьёт: на месте удара на мгновение проступает отпечаток руки, а соперника отбрасывает назад.\nКогда применять: в ближнем бою, чтобы разорвать клинч.",[["str",3]],"Отбрасывание.",[["gp",-1]],""),
   M("Просветление","Чтение","Как делается: боец касается соперника, чаще всего его запястья, и через пальцы ощущает, какие мышцы у того начинают напрягаться.\nКак бьёт: по напряжению мышц боец предсказывает следующее движение соперника и встречает его заранее. Против двух атак, начатых одновременно, не работает.\nКогда применять: в ближнем бою, чтобы опередить соперника.",[["per",5]],"Можно заранее заявить уклонение от следующей атаки соперника.",[],"Не работает против одновременных атак."),
   M("Удар в лицо","Удар коленом","Как делается: боец обеими руками тянет голову соперника вниз и бьёт коленом вверх, повторяя удар несколько раз подряд без остановки.\nКак бьёт: серия ударов коленом в лицо, каждый из которых приходит раньше, чем соперник выпрямится.\nКогда применять: в клинче.",[["str",3],["spd",1]],"",[],"Отсутствуют."),
   M("Рыболовный крюк","Захват ноги","Как делается: боец ловит атакующую ногу руками, подпрыгивает и обвивает её своими ногами, повисая на ней всем весом.\nКак бьёт: весом всего тела боец выкручивает колено или голеностоп соперника рычагом и роняет его.\nКогда применять: против ударов ногами.",[["tech",4]],"Соперник −2 Скорости до конца боя при полном рычаге.",[["dur",-1]],""),
   M("Удар Неба и Земли","Удар ногой сверху","Как делается: боец поднимает ногу выше головы соперника и рубит ей сверху вниз, как топором, вкладывая вес тела.\nКак бьёт: пятка обрушивается на голову или плечо и вбивает соперника вниз.\nКогда применять: против пригнувшегося или низко стоящего соперника.",[["str",5]],"",[["dur",-1]],""),
   M("Удар подъёмом вверх","Удар ногой","Как делается: боец выстреливает ногой снизу вверх и в конце ломает её в колене, ударяя подъёмом стопы навстречу чужой ноге.\nКак бьёт: удар встречает и сбивает удар ногой снизу — так Пак Ильпхё остановил «Халлу» Ре-Тхэквондо.\nКогда применять: как контратака на удары ногами.",[["str",3],["tech",1]],"Контратака на удар ногой снизу.",[],"Отсутствуют."),
   M("Внутренняя подсечка","Подсечка","Как делается: боец заходит сбоку и бьёт стопой сзади по подколенной впадине опорной ноги соперника.\nКак бьёт: колено соперника подгибается, и он теряет равновесие, падая вперёд или вниз.\nКогда применять: как часть связки «Нирвана».",[["tech",2]],"Соперник теряет равновесие.",[],"Отсутствуют."),
   M("Удар коленом","Удар коленом","Как делается: удерживая руку соперника в замке, боец тянет его вниз к себе и одновременно бьёт коленом навстречу.\nКак бьёт: колено врезается в лицо наклонившегося соперника с двойной силой.\nКогда применять: после Замка на ногу, перед Нирваной.",[["str",3]],"",[],"Отсутствуют."),
   M("Замок на ногу","Рычаг","Как делается: несмотря на название, это рычаг на руку: боец захватывает руку соперника обеими руками и выкручивает её против сустава.\nКак бьёт: запястье или локоть соперника могут вывихнуться, а сам захват даёт бойцу опору для удара коленом.\nКогда применять: как опора для Удара коленом и Нирваны.",[["tech",3]],"Сила соперника −1 при вывихе.",[],"Отсутствуют."),
   M("Нирвана","Удар всем телом","Как делается: связка всем телом: замок на руку → колено в лицо → внутренняя подсечка. Пока соперник падает, боец прыгает следом и обрушивается на него коленом.\nКак бьёт: колено вместе со всем весом бойца врезается в лицо соперника при падении.\nКогда применять: как финал связки.",[["str",7],["tech",3]],"",[["dur",-2]],"Требует трёх предыдущих приёмов."),
   M("Накён","Серия из трёх ударов","Как делается: три удара ногой подряд без пауз: подсечка по ногам, прямой толчок стопой в корпус и удар назад в голову.\nКак бьёт: удары приходят по трём уровням подряд — низ, середина, верх, — и закрыть все три невозможно.\nКогда применять: как ответ на Третью стойку Хвечхука.",[["str",4],["spd",3]],"Контратака на Третью стойку Хвечхука.",[["end",-1]],""),
   M("Толчок ногой","Прямой удар ногой","Как делается: боец поднимает колено к груди и толкает стопой вперёд по прямой, вкладывая вес.\nКак бьёт: подошва врезается в корпус и сбивает соперника вместе с его атакой — так Ильпхё сбил «Ножницы» в прыжке.\nКогда применять: против прыжковых ударов.",[["str",2],["spd",2]],"",[],"Отсутствуют."),
   M("Удар задней лошади","Удар назад","Как делается: боец, не оборачиваясь, переносит вес на опорную ногу и бьёт другой ногой назад, как лягает лошадь.\nКак бьёт: пятка врезается в корпус или голову того, кто атакует снизу или со спины.\nКогда применять: против низких атак вроде Земляной борозды.",[["str",4]],"",[],"Отсутствуют."),
   M("Раундхаус и коса","Ложный удар + бросок","Как делается: боец начинает круговой удар ногой, но в последний момент сгибает колено и подколенным сгибом захватывает шею соперника, как косой.\nКак бьёт: инерцией удара соперника переворачивает и прижимает к земле одной ногой, после чего его можно добить кулаком.\nКогда применять: против соперника, который ставит блок под обычный удар.",[["tech",4],["str",2]],"Соперник прижат к земле.",[],"Отсутствуют."),
   M("Синусоида","Передвижение","Как делается: боец волнообразно раскачивает корпус из стороны в сторону, смещая центр тяжести в характерном ритме тхэккёна.\nКак бьёт: сам не бьёт, но сбивает сопернику прицел: удар соперника приходит туда, где бойца уже нет.\nКогда применять: для уклонения и обмана перед атакой.",[["spd",3]],"",[],"Отсутствуют."),
   M("Внешний удар Ссамсу","Удар ногой","Как делается: боец выводит ногу снаружи по широкой дуге, огибая выставленные руки соперника.\nКак бьёт: удар попадает в голову сбоку, мимо блока.\nКогда применять: против закрытой стойки.",[["str",3],["spd",1]],"",[],"Отсутствуют."),
   M("Реверс","Контратака","Как делается: боец уходит с линии атаки поворотом корпуса и тем же поворотом, не останавливаясь, возвращает удар.\nКак бьёт: удар приходит в место, которое соперник открыл своей атакой.\nКогда применять: в ответ на удар соперника.",[["tech",2],["per",2]],"",[],"Отсутствуют."),
   M("Блок и отвод","Защита","Как делается: предплечье принимает удар соперника, а ладонь сразу же уводит его руку или ногу в сторону.\nКак бьёт: атака проходит мимо, бок соперника открывается для удара.\nКогда применять: перед контратакой.",[["dur",3]],"",[],"Отсутствуют."),
   M("Проливной удар","Серия","Как делается: боец обрушивает град быстрых ударов руками и ногами без пауз, не давая сопернику перевести дух.\nКак бьёт: многочисленные удары по корпусу и голове не дают сопернику поднять защиту.\nКогда применять: как давящая серия.",[["spd",4]],"",[["end",-1]],""),
   M("Ёкчхук","Обратный удар","Как делается: обратный удар ногой с разворота: нога идёт по дуге в направлении, противоположном обычному Хвечхуку.\nКак бьёт: пятка бьёт в голову с той стороны, откуда соперник не ждёт удара.\nКогда применять: как основа Истинного обнуляющего вращения.",[["str",4],["tech",1]],"",[],"Отсутствуют."),
   M("Истинное обнуляющее вращение","Вихрь","Как делается: боец вбивает опорную стопу в землю и проводит силу вверх: колено → таз → поясница → кончик бьющей ноги, выполняющей Ёкчхук. Вокруг тела закручивается ветер и собирается вокруг ноги.\nКак бьёт: при контакте с целью собранный ветер превращается в гигантский смерч.\nКогда применять: как мощный финал.",[["str",10],["tech",3]],"",[["end",-4]],""),
   M("Секретная техника: Огненный удар","Огонь · 1-я ступень","Как делается: боец с огромным давлением трёт стопой землю, так что сжатый воздух у подошвы воспламеняется, а затем ударом ноги посылает это пламя вперёд.\nКак бьёт: огненная волна летит в соперника и обжигает его.\nКогда применять: чтобы атаковать на дистанции; первая ступень огненной серии.",[["str",6]],"Огненный урон.",[["end",-2]],""),
   M("Огненный удар, 2-я ступень: Двойной сфероид","Огонь · ловушка","Как делается: боец дважды подбрасывает пламя Огненного удара ударами ноги вверх, закручивая огонь по кругу вокруг соперника.\nКак бьёт: огонь смыкается кольцом вокруг соперника и запирает его внутри.\nКогда применять: чтобы запереть соперника перед третьей ступенью.",[["str",6],["tech",2]],"Соперник заперт в огненном кольце на ход.",[["end",-3]],"Требует 1-й ступени."),
   M("3-я ступень: Огненная Нирвана","Огонь · ультима","Как делается: боец собирает весь огонь в ноге, поднимает её высоко вверх, вытягивая пламя, и опускает вниз.\nКак бьёт: огонь вытягивается в гигантский огненный клинок, который обрушивается на соперника.\nКогда применять: как финал огненной серии.",[["str",12]],"Огненный урон по площади.",[["end",-5]],"Требует 1-й и 2-й ступени."),
   M("Девятый хвост + Огненная Нирвана: Тройной разрушительный адский клык","Огонь + чарёк","Как делается: боец высвобождает силу всех девяти хвостов чарёка-кумихо, ударом вверх поднимает гигантскую волну огня, а ударом вниз обрушивает её.\nКак бьёт: огненная волна накрывает соперника целиком — так был побеждён Третий наследный принц.\nКогда применять: с огненным чарёком, как последний удар.",[["str",18],["ctrl",4]],"",[["gp",-6],["end",-6]],"Только с огненным чарёком и девятью хвостами.")]},
 {id:"practical-tk",name:"Практический Тхэккён",orig:"Practical Taekkyeon",rarity:"special",types:["strike"],base:"Тхэккён",
  founder:"Неизвестен (эпоха Чосон)",masters:[["Пак Сынъа","практик"],["Пак Сынмин","практик"],["Пак Ильтхэ","владел вместе с Ре-Тхэквондо"]],
  about:"Боевое искусство времён королевства Чосон. Строится на ударах ногами и движении всего тела, руки работают в тесной связке с ногами: много подсечек, бросков и ударов ладонью с вибрацией. Позже Пак Ильтхэ на его основе создал Ссамсу Тхэккён — и линия Пак Сынъа до сих пор недолюбливает эту «смесь».",
  passive:[["spd",1],["tech",1]],
  ability:null,limits:"Отсутствуют.",
  moves:[
   M("Импульс ки","Ладонь · ки","Как делается: боец задерживает ки в ладони, держит руку расслабленной и бьёт открытой ладонью, в момент касания пуская по ней вибрацию.\nКак бьёт: вибрация уходит внутрь тела и повреждает органы изнутри. Удар по уху сбивает чувство равновесия: так Пак Сынъа повредила внутреннее ухо Джин Мори.\nКогда применять: против крепких соперников, которых не пробивают обычные удары.",[["str",2]],"Игнорирует 1 уровень Стойкости соперника. При ударе в голову — Скорость соперника −1 на 2 хода.",[["gp",-1]],""),
   M("Подсечка с захватом руки","Бросок + локоть","Как делается: правая рука заходит под левую ногу соперника, правая нога цепляет его правую ногу, а левая нога закидывается на правое плечо. Боец прыгает вперёд, отрывает противника от земли и переворачивается всем телом.\nКак бьёт: соперник летит вперёд и падает, а боец по инерции обрушивает на него локоть всем весом.\nКогда применять: в ближнем бою, когда соперник стоит вплотную.",[["tech",3],["str",2]],"",[["spd",-1]],"Если соперник устоял — боец на земле."),
   M("Удар Чудовищного Змея","Удар ногой сверху","Как делается: боец поднимает ногу выше головы соперника, на пике переносит на неё вес тела и рубит вниз, как топором.\nКак бьёт: пятка обрушивается на голову или плечо — удар Пак Сынъа проломил центр ринга.\nКогда применять: против соперника, который пригнулся или стоит близко.",[["str",5]],"",[["dur",-1]],""),
   M("Лоу-кик","Удар ногой","Как делается: боец разворачивается на опорной стопе и бьёт голенью по внешней или внутренней стороне бедра или по икре соперника.\nКак бьёт: удар отсушивает ногу и ломает равновесие, а сильный может сломать ногу.\nКогда применять: чтобы замедлить подвижного соперника.",[["str",2]],"При попадании Скорость соперника −1.",[],"Отсутствуют.")]},

 {id:"monkey",name:"Хоахёракгёк",orig:"Whoahyorakgeyok · Небесное искусство, 48-я форма",rarity:"special",types:["strike","mixed"],base:"Кунг-фу обезьяны",
  founder:"Король Обезьян",masters:[["Обезьяна горы Хвагва","нынешний практик"],["Король Обезьян","создатель"],["Чаруру","практик"],["Миху","практик"],["Джин Мори","практик"],["Нефритовый Император","владеет"]],
  about:"Стиль, который Король Обезьян создал века назад для обезьян Царства Мудрецов. Сейчас его называют «Небесное искусство, 48-я форма». Опирается на их скорость, силу и непредсказуемость: агрессивный, акробатичный, со звериной манерой движения и такой же звериной работой ног. Показан лишь частично.",
  passive:[["spd",3],["str",2],["per",1]],
  ability:["Звериная непредсказуемость","Движения невозможно прочитать: противник не может применять контратаки против первой атаки бойца в каждом обмене."],
  limits:"Изначально доступен только Королю Обезьян и его подчинённым. Для игроков — только с разрешения ГМа и по сюжету.",
  moves:[
   M("Удар Хоа","Удар рукой","Как делается: боец резко бросается вперёд по звериной непредсказуемой траектории и бьёт рукой с неожиданного угла — снизу, сбоку или в прыжке.\nКак бьёт: удар в голову или корпус, траекторию которого невозможно прочитать заранее.\nКогда применять: первым ударом связки «Удар — Скольжение — Пинок».",[["str",4],["spd",1]],"",[],"Отсутствуют."),
   M("Скольжение Хоа","Передвижение","Как делается: боец резко падает низко — на четвереньки или на бок — и скользит по земле, проскакивая под рукой или ногой соперника.\nКак бьёт: сам не бьёт, но выводит бойца под руки или за спину соперника, в слепую зону, откуда идёт следующий удар.\nКогда применять: для уклонения и захода в слепую зону.",[["spd",5]],"",[],"Отсутствуют."),
   M("Пинок Хоа","Удар ногой","Как делается: прямо из скольжения, не вставая, боец выбрасывает ногу снизу вверх под неудобным углом.\nКак бьёт: удар ногой в корпус или подбородок приходит снизу, откуда его не ждут.\nКогда применять: сразу после Скольжения Хоа.",[["str",3],["spd",2]],"",[],"Отсутствуют."),
   M("Затухающий удар","Подсечка","Как делается: боец бросается на соперника, в последний момент ныряет вниз, встаёт на руки и раскручивает ноги по кругу, как «флэр» в брейк-дансе.\nКак бьёт: вращающиеся ноги подсекают соперника и сносят его с ног.\nКогда применять: против соперника, ждущего удара на уровне корпуса.",[["spd",4],["tech",2]],"Сбивает с ног.",[],"Отсутствуют."),
   M("Серое вознесение","Подброс","Как делается: боец перекатывается назад на руки, мощно толкается ими от земли вверх-вперёд и в полёте выстреливает ногой.\nКак бьёт: удар ногой подбрасывает соперника высоко в воздух.\nКогда применять: чтобы подбросить врага под Удар Небесного Тигра.",[["str",5],["spd",3]],"Подбрасывает соперника.",[],"Отсутствуют."),
   M("Удар Небесного Тигра","Воздушная серия","Как делается: когда соперник в воздухе, боец приседает, как кошка перед прыжком, прыгает к нему и осыпает его лицо кулаками, добавляя удары ногами с разных сторон.\nКак бьёт: многочисленные удары в воздухе, где соперник не может ни закрыться, ни увернуться.\nКогда применять: только против соперника в воздухе.",[["str",6],["spd",5]],"Только по противнику в воздухе.",[["end",-2]],""),
   M("Молот Серого Дракона","Удар ногой-сверло","Как делается: боец прыгает и бьёт летящим боковым ударом ногой сверху вниз, вращаясь вокруг своей оси, как сверло.\nКак бьёт: сила так велика, что соперник продолжает лететь, вспахивая землю и оставляя за собой полосу разрушений.\nКогда применять: как мощное добивание.",[["str",10],["spd",4]],"",[["end",-3]],""),
   M("Высшее тайное искусство: Обезьяний коготь","Энергетические лезвия","Как делается: боец растопыривает пальцы, как когти, и делает размашистый удар «тигриной лапой», выпуская энергию через ногти.\nКак бьёт: из ногтей вылетают пять гигантских энергетических лезвий, режущих камень, — и вблизи, и на дистанции. Удар можно повторять подряд.\nКогда применять: как высшая техника стиля.",[["str",12],["spd",4]],"Атака на дистанции, до 5 целей.",[["gp",-4]],"")]},

 {id:"northern-itf",name:"Северное ITF-тхэквондо",orig:"Northern ITF Taekwondo · Пукпха",rarity:"special",types:["strike"],base:"Тхэквондо (ITF) + китайские и русские БИ",
  founder:"Правительство КНДР",masters:[["Ли Сухёк","практик"],["Мун Чхунсик","практик"],["Ли Сучжин","практик"],["Кан Мансок","практик"],["Ма Бора","практик"],["Кан Дэхёп","практик"],["Нефритовый Император","владеет"]],
  about:"Северокорейская школа, созданная правительством как «совершенная машина для убийства»: к ITF-тхэквондо добавили наработки китайских и русских боевых искусств. Прямые быстрые атаки, бой без защиты и без правил. Стиль делится на две стойки фламинго: Правая — уничтожение соперника, Левая — защита и пробивание обороны. Против этой школы Джин Тхэджин создал Ре-Тхэквондо.",
  passive:[["str",2],["spd",1]],
  ability:["Стойки фламинго","В начале хода боец выбирает стойку: Правая — +2 Силы к атакующим техникам, Левая — +2 Стойкости и +1 Техники к защитным."],
  limits:"Сменить стойку можно один раз за ход.",
  moves:[
   M("Моран","Удар ногой","Как делается: из стойки боец без подготовки и без замаха выстреливает прямым ударом по центральной линии, сразу возвращая ногу или руку.\nКак бьёт: быстрый удар в голову или корпус, который открывает бой и сбивает соперника с ритма.\nКогда применять: первым ударом в схватке.",[["spd",3]],"",[],"Отсутствуют."),
   M("Тройной удар","Серия по нескольким целям","Как делается: за одно непрерывное движение боец раздаёт три удара в разные стороны, разворачиваясь от одного противника к другому.\nКак бьёт: каждый из трёх соперников получает по удару почти одновременно.\nКогда применять: против группы противников.",[["spd",3],["str",2]],"До трёх целей.",[["end",-1]],""),
   M("Гиперскорость","Рывок","Как делается: боец резко толкается задней ногой и рывком сокращает дистанцию, сохраняя стойку.\nКак бьёт: сам не бьёт, но разгон переносится в следующую технику и усиливает её.\nКогда применять: перед любым сильным ударом.",[["spd",5]],"Следующая техника +2 Силы.",[["end",-1]],""),
   M("Отражение волны","Правая стойка","Как делается: из Правой стойки фламинго боец с силой топает в землю, посылая свою ударную волну навстречу чужой.\nКак бьёт: волны сталкиваются, и чужой удар отражается обратно к сопернику.\nКогда применять: против волновых атак.",[["dur",3],["tech",2]],"Отражает одну волновую атаку.",[],"Отсутствуют."),
   M("Северный прямой удар ногой","Правая стойка","Как делается: из Правой стойки фламинго боец поднимает колено и выстреливает стопой вперёд по прямой — без лишних движений, но в полную силу, а не по-спортивному.\nКак бьёт: подошва таранит корпус соперника и может сломать рёбра.\nКогда применять: чтобы держать дистанцию и пробивать корпус.",[["str",3],["spd",1]],"",[],"Отсутствуют."),
   M("Пэкту (северный)","Правая стойка · колено","Как делается: ложный удар заставляет соперника опустить защиту; боец хватает его голову обеими руками и притягивает её на поднимающееся колено.\nКак бьёт: колено врезается в лицо с двойной силой — навстречу притянутой голове.\nКогда применять: против соперника, реагирующего на финты.",[["str",5],["tech",1]],"",[],"Отсутствуют."),
   M("Северный захват серпом","Правая стойка","Как делается: боец заводит ногу крюком за ногу или шею соперника и резко дёргает на себя.\nКак бьёт: соперник падает в сторону бойца — прямо под удар сверху.\nКогда применять: перед добиванием.",[["tech",3]],"",[],"Отсутствуют."),
   M("Трёхзубый удар","Правая стойка · серия","Как делается: северный оригинал Третьей стойки Хвечхука: три удара ногами с трёх направлений подряд — короткими жёсткими траекториями, без широких разворотов.\nКак бьёт: три удара приходят с разных сторон так быстро, что закрыть все невозможно.\nКогда применять: против бойца, закрывающего одну сторону.",[["str",5],["spd",3]],"",[["per",-1]],""),
   M("Метеоритный удар","Правая стойка","Как делается: боец бьёт ногами сверху вниз, удар за ударом, меняя ноги в воздухе, будто с неба падают метеоры.\nКак бьёт: серия ударов сверху по голове и плечам вбивает соперника вниз.\nКогда применять: против пригнувшегося соперника.",[["str",6],["spd",2]],"",[["dur",-1]],""),
   M("Удар вбок","Правая стойка","Как делается: боец разворачивает корпус боком, поднимает колено и выстреливает ногой ребром стопы в сторону.\nКак бьёт: удар сносит соперника с линии атаки и выбивает из позиции.\nКогда применять: чтобы выбить врага из позиции.",[["str",3]],"",[],"Отсутствуют."),
   M("Резак соломы","Левая стойка","Как делается: из Левой стойки фламинго боец встречает атакующую ногу соперника голенью снизу, подрезая её.\nКак бьёт: удар ногой соперника сбивается, а сама его нога получает удар.\nКогда применять: как защита от ударов ногами.",[["dur",2],["tech",2]],"Сбивает удар ногой соперника.",[],"Отсутствуют."),
   M("Подвес резака","Левая стойка · захват","Как делается: нога, поймавшая удар соперника Резаком соломы, не отпускает его ногу, а удерживает её на весу.\nКак бьёт: соперник остаётся на одной ноге и теряет равновесие, открываясь для добивания.\nКогда применять: после Резака соломы.",[["tech",4]],"Соперник теряет ход опоры.",[],"Отсутствуют."),
   M("Северный Хвечхук","Левая стойка","Как делается: короткий жёсткий удар с разворота из Левой стойки фламинго — по меньшей дуге, чем обычный Хвечхук.\nКак бьёт: пятка пробивает защиту и попадает в голову.\nКогда применять: для пробивания блока.",[["str",3],["spd",2]],"",[],"Отсутствуют.")]},

 {id:"hallyang",name:"Пумба стиля Ханрян",orig:"Hanryang Style Pumba · Посох Национальной ассоциации бездомных",rarity:"special",types:["weapon"],base:"Неизвестно (передаётся главам Ассоциации бездомных)",
  founder:"Неизвестен",masters:[["Со Ханрян","создатель школы, глава Ассоциации бездомных"],["Джин Мори","ученик"],["Хуэй Мори","ученик"],["Ю Мира","ученица"]],
  about:"Оружейный стиль Со Ханряна, главы Национальной ассоциации бездомных. Основное оружие — посох, но подходят и мечи, и любое длинное оружие. Стиль позволяет как бы «гнуть» оружие невозможным образом и выжимать из него всё. Техники называются «куплетами» и «стойками» — по уличным песням бродяг-пумба.",
  passive:[["tech",2],["dur",1]],
  ability:["Гибкое оружие","Оружие в руках бойца будто гнётся: атаки огибают препятствия, щиты и союзников соперника."],
  limits:"Требует оружия (посох, меч, шест). Часть техник можно выполнить голыми руками, но слабее.",
  moves:[
   M("0-я стойка: Нищий","Ультима","Как делается: боец раскручивается всем телом на месте и ведёт посох по диагонали снизу вверх через грудь врага, вкладывая в удар всю инерцию вращения.\nКак бьёт: удар рассекает землю огромным полукругом, оставляя трещину; Со Ханрян с посохом Га Болг оставил синяк на груди самого Зевса.\nКогда применять: как высшая техника стиля.",[["str",15],["tech",4]],"",[["end",-6],["spd",-2]],""),
   M("8-й куплет: Танец песни нищего","Защита по сфере","Как делается: боец вращает посох вокруг себя во всех плоскостях — над головой, перед собой, за спиной, — так что он образует сферу.\nКак бьёт: сфера отражает все атаки и отбрасывает врагов вокруг, а боец может в любой момент ударить из неё в любом направлении.\nКогда применять: в окружении.",[["dur",5],["tech",2]],"Отражает атаки со всех сторон на ход.",[["end",-2]],""),
   M("13-й куплет: Змей","Гибкий удар","Как делается: боец ведёт посох так, что тот будто изгибается, огибая препятствия на пути к цели.\nКак бьёт: удар достаёт соперника за щитом или за союзником, не задевая того, кого задевать не нужно.\nКогда применять: против прикрытых целей.",[["tech",5]],"Игнорирует блок или прикрытие.",[],"Отсутствуют."),
   M("17-й куплет: Рёккын","Рубящий удар","Как делается: боец сжимает все мышцы тела, а затем одним взрывом обрушивает посох сверху вниз.\nКак бьёт: сокрушительный удар сверху: Хуэй Мори так снёс голову Громовой птице и одновременно вырубил Белого Ястреба.\nКогда применять: против сильного соперника.",[["str",9]],"",[["spd",-2]],""),
   M("19-й куплет: Торговец собаками","Вихрь","Как делается: боец раскручивает посох и резко останавливает его руками; вращение втягивает воздух вокруг, и боец выталкивает его вперёд.\nКак бьёт: смерч сносит всё между бойцом и врагом. Можно выполнить и без оружия, как Джин Мори.\nКогда применять: против цели на дистанции.",[["str",7],["tech",2]],"Атака на дистанции по линии.",[["end",-3]],""),
   M("27-й куплет: Нарезка","Многоклинковый","Как делается: боец работает сразу несколькими мечами, проводя ими серии разрезов по объекту, как скульптор.\nКак бьёт: материал режется и приобретает нужную форму: так Ханрян заточил небоскрёбы в шипы.\nКогда применять: против крупных объектов.",[["tech",6],["str",3]],"",[["end",-3]],"Нужно несколько клинков."),
   M("46-я стойка: Опора земли","Поддержка","Как делается: три посоха — по одному в каждой руке и один в зубах — складываются треугольником и упираются в обрушивающуюся массу.\nКак бьёт: треугольник удерживает падающий потолок, пока союзники выбираются.\nКогда применять: для защиты союзников.",[["dur",6]],"Защищает союзников от обвала.",[["spd",-4]],"Боец неподвижен."),
   M("Укол в живот","Колющий","Как делается: боец перехватывает посох ближе к концу и коротким толчком двух рук вгоняет его конец в живот соперника. Без оружия то же движение делается сложенными пальцами, как показал Джин Мори.\nКак бьёт: удар приходится в солнечное сплетение или под рёбра и выбивает дыхание, заставляя соперника согнуться.\nКогда применять: в ближнем бою или чтобы прервать замах.",[["str",3],["spd",1]],"",[],"Отсутствуют."),
   M("Каксу-кори","Отвод","Как делается: Ханрян придумал его, глядя на Захват серпом Ре-Тхэквондо. Боец ведёт посох полукругом навстречу атаке, цепляет им атакующую руку, ногу или оружие и продолжает дугу в сторону.\nКак бьёт: атака соперника уводится мимо тела, а сам соперник проваливается вслед за своим ударом и открывается.\nКогда применять: как защита от прямых и размашистых ударов.",[["dur",4],["tech",2]],"Отводит одну атаку.",[],"Отсутствуют."),
   M("Предел","Удар-волна","Как делается: боец раскручивает посох одной рукой над головой, набирая скорость, и резко выстреливает им вперёд, как копьём.\nКак бьёт: из конца посоха вырывается огромная ударная волна. Полную силу не видели: Зевс остановил её пальцами.\nКогда применять: как мощный удар на дистанции.",[["str",12]],"",[["end",-4]],"")]},
 {id:"sarissa",name:"Македонская сарисса",orig:"Macedonian Sarissa",rarity:"original",types:["weapon","strike"],base:"Бой копьём и щитом (Древняя Македония)",
  founder:"Неизвестен, предположительно эпоха Филиппа II",masters:[["Александрос","потомок династии Аргеадов"],["Хосе","потомок династии Аргеадов"]],
  about:"Искусство копья и щита, вероятно рождённое в Македонии при Филиппе II и передаваемое по крови династии Аргеадов. Без оружия делает упор на тяжёлые удары кулаком, ломающие кости. Основная стойка: правое предплечье прикрывает лицо, левая рука держит его. Не подтверждено, но, судя по бою Александроса с Данте, в стиле есть и захваты, рычаги и удары ногами.",
  passive:[["str",2],["dur",1]],
  ability:["Строй фаланги","Стойка с закрытым лицом: первый удар соперника в каждом обмене получает −2 Силы."],
  limits:"Оружейные техники требуют копья.",
  moves:[
   M("Фаланга (Один заряженный выстрел)","Удар кулаком","Как делается: основная стойка: правое предплечье прикрывает лицо, левая рука держит его. Боец сжимает силу в кулаке за предплечьем и выстреливает прямым ударом из-за этого «щита», вкладывая весь корпус.\nКак бьёт: сжатая сила бьёт дальше, чем достаёт рука: удар работает и вблизи, и на дистанции. Им Александрос встретил Базальтовый кулак Хан Дэви и отсёк Данте руку, а Хосе вырубал нескольких бойцов разом.\nКогда применять: против прямой атаки — кулак в кулак, или против цели на средней дистанции.",[["str",7],["spd",2]],"Может бить на средней дистанции.",[["end",-2]],""),
   M("Фаланга — Пешая синтагма ×100","Копьё + нацсокровище","Как делается: Хосе берёт национальное сокровище — сариссу Филиппа II, которая умеет множиться, и создаёт сто её копий, выстроенных как македонская фаланга. Затем выполняет удар Фаланги.\nКак бьёт: сотня копий выстреливает в соперника одновременно, накрывая всю площадь перед бойцом.\nКогда применять: только с сариссой Филиппа II, против группы или крупной цели.",[["str",14],["spd",4]],"Атака по площади.",[["gp",-5],["end",-4]],"Только с сариссой Филиппа II.")]},

 {id:"taichi",name:"Тай-чи",orig:"Tai Chi Chuan",rarity:"special",types:["inner"],base:"Тайцзицюань",
  founder:"По легенде — даос Чжан Саньфэн (XII в.)",masters:[["Ко Гамдо","практик"],["Учитель Ко Гамдо","мастер"],["Безымянный жрец","южный стиль"],["Кан Дэхёп","использует отдельные приёмы"]],
  about:"Китайское искусство самообороны и оздоровления. Все знают медленную плавную форму, но у тай-чи есть вторая — быстрая и жёсткая, сохраняющая круговые текучие движения. Сила берётся из дыхания, веса и перенаправления чужой энергии. Мелкая деталь: у Ко Гамдо короткие рукава, как у южной школы, а безымянный жрец южного стиля — в длинных, как у северной.",
  passive:[["dur",1],["ctrl",1],["tech",1]],
  ability:["Мягкое перенаправление","Раз за бой боец может вернуть сопернику половину бонуса Силы его удара, если принял удар ладонями."],
  limits:"Требует спокойствия: если боец в ярости (по отыгрышу), способность не работает.",
  moves:[
   M("Шаг кролика","Передвижение","Как делается: боец резко отталкивается задней ногой и за один шаг пролетает всю дистанцию до соперника, не теряя стойки и равновесия.\nКак бьёт: сам не бьёт, но приносит бойца вплотную и передаёт набранный разгон в следующий удар.\nКогда применять: перед Ударом Драконьего посоха или любым ударом вплотную.",[["spd",5]],"Следующий удар +2 Силы.",[],"Отсутствуют."),
   M("Удар Драконьего посоха","Удар рукой","Как делается: боец влетает в соперника Шагом кролика и в момент приземления бьёт прямой, полностью выпрямленной рукой с раскрытым корпусом.\nКак бьёт: в удар уходит весь разгон: мощный удар в грудь или живот сносит соперника.\nКогда применять: сразу после Шага кролика.",[["str",6]],"",[["dur",-1]],"Корпус открыт."),
   M("Тяжесть рога дракона","Ударная волна","Как делается: боец с силой топает в землю, посылая волну по полу к сопернику.\nКак бьёт: ударная волна приходит под ноги соперника и сбивает его равновесие — почти как Удар Феникса каратэ.\nКогда применять: чтобы раскачать соперника перед атакой.",[["tech",3]],"Скорость соперника −2 на ход.",[],"Отсутствуют."),
