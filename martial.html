   M("Гора Стального Демона","Удар плечом","Как делается: боец скручивается вокруг своей оси, набирая центробежную силу, и врезается в соперника плечом и спиной.\nКак бьёт: удар плечом отбрасывает соперника далеко назад.\nКогда применять: в ближнем бою, когда соперник прижался.",[["str",5]],"Отбрасывание.",[],"Отсутствуют."),
   M("Удар ногой-топором","Удар ногой","Как делается: боец делает переворот, в конце которого обрушивает ногу сверху вниз, как топор.\nКак бьёт: пятка бьёт по плечам или голове соперника сверху.\nКогда применять: против соперника, пригнувшегося под удар.",[["str",4]],"",[["dur",-1]],""),
   M("Маятник в тысячу фунтов","Дыхание","Как делается: боец особым дыханием как бы «утяжеляет» тело, становясь непоколебимым, и в нужный момент тянет соперника на себя.\nКак бьёт: соперник не может сдвинуть бойца, а при рывке сам теряет центр тяжести и падает.\nКогда применять: против бойцов, которые давят массой или тянут в борьбу.",[["dur",4],["str",2]],"Соперник не может сдвинуть бойца с места.",[["spd",-2]],""),
   M("Десять тысяч конских ударов","Серия","Как делается: шквал быстрых ударов ладонями, сменяющих друг друга без паузы; в манхве показан мельком.\nКак бьёт: град ударов ладонями по корпусу и голове не даёт сопернику закрыться.\nКогда применять: как давящая серия.",[["spd",4]],"",[["end",-1]],""),
   M("Удар молотом","Удар рукой","Как делается: боец поднимает кулак и опускает его сверху вниз основанием, как молот; в манхве почти не показан.\nКак бьёт: удар по голове или ключице сверху.\nКогда применять: против пригнувшегося соперника.",[["str",3]],"",[],"Отсутствуют."),
   M("Высшее искусство тай-чи: Удар Пяти Стихий Инь-Ян","Внутренний удар","Как делается: боец гасит в себе эмоции, накапливает внутреннюю энергию и передаёт её сопернику одним касанием ладони.\nКак бьёт: внутри тела соперника взрывается ударная волна. Опытный противник может развернуть удар обратно — так Кан Мансок вернул его Ко Гамдо.\nКогда применять: в спокойном состоянии, как высший удар.",[["str",9],["ctrl",3]],"Игнорирует 2 уровня Стойкости.",[["end",-3]],"Требует спокойствия.")]},

 {id:"lance",name:"Lance de Combat",orig:"Lance De Combat · Фехтование",rarity:"original",types:["weapon"],base:"Фехтование (рапира)",
  founder:"Андре Оскар",masters:[["Андре Оскар","создатель, рапира Жанны д’Арк"],["Пэк Сынчхоль","подражатель (бита)"]],
  about:"Фехтовальный стиль, созданный Андре Оскаром для работы с его национальным сокровищем — рапирой Жанны д’Арк. Основа — серии сверхбыстрых уколов по множеству точек. Пэк Сынчхоль повторяет стиль битой и компенсирует отсутствие острия, закручивая биту и создавая поток воздуха. Сюда же входят классические фехтовальные приёмы Андре.",
  passive:[["spd",2],["tech",1]],
  ability:["Колющая серия","Серия уколов: каждые 12 ударов в одной технике дают +1 к Скорости до конца поста."],
  limits:"Требует клинка или длинного предмета. Без острия (бита, палка) урон ниже.",
  moves:[
   M("Douze Lance de Combat","Серия ×12","Как делается: боец встаёт в фехтовальную стойку, выставив клинок, и на огромной скорости делает двенадцать уколов подряд, перенося остриё с цели на цель: ноги, живот, грудь. Пэк Сынчхоль, у которого бита вместо рапиры, перед серией закручивает биту, создавая поток воздуха вместо острия.\nКак бьёт: двенадцать точек на теле соперника получают уколы почти одновременно — закрыть их все невозможно.\nКогда применять: как основная серия стиля.",[["spd",5]],"",[["end",-1]],""),
   M("Soixante-Douze Lance de Combat","Серия ×72","Как делается: та же механика, что у Douze: боец в фехтовальной стойке колет, переводя остриё с точки на точку. Но разгон сильнее, и боец успевает нанести семьдесят два укола, постоянно меняя углы атаки.\nКак бьёт: семьдесят два укола по всему телу. Хан Дэви пробивал эту серию Базальтовым кулаком, а против версии Андре понадобилась Буря Синего Дракона.\nКогда применять: когда двенадцати уколов мало.",[["spd",7],["str",2]],"",[["end",-3]],""),
   M("Cent Quarante-Quatre Lance de Combat","Серия ×144","Как делается: ещё более быстрая серия: боец почти не возвращает клинок к себе, а ведёт остриё от точки к точке короткими движениями кисти.\nКак бьёт: сто сорок четыре укола накрывают соперника — даже кукла Хан Дэви с трудом уворачивалась.\nКогда применять: против быстрых соперников.",[["spd",9],["str",3]],"",[["end",-4]],""),
   M("Mille Quatre Cent Quarante Lance de Combat","Серия ×1440","Как делается: предельная серия: рука с клинком движется так быстро, что вокруг соперника видно облако остриёв.\nКак бьёт: тысяча четыреста сорок уколов накрывают соперника целиком. Полный эффект в манхве не показан.\nКогда применять: с рапирой-нацсокровищем или по решению ГМа.",[["spd",14],["str",5]],"",[["end",-7]],"Только с рапирой-нацсокровищем или по решению ГМа."),
   M("Низкая кварта: Алый цветок","Выпад","Как делается: боец делает глубокий выпад — передняя нога уходит далеко вперёд, корпус наклоняется — и вгоняет клинок в корпус соперника снизу, в защиту «кварта». Затем резко выдёргивает его.\nКак бьёт: кровь хлещет из смертельной раны, раскрываясь «алым цветком». Андре любил добивать так после больших техник.\nКогда применять: как добивание после серии уколов.",[["str",6],["spd",2]],"Кровотечение: Выносливость соперника −1 за ход.",[["dur",-1]],""),
   M("Пассата сотто с разворотом","Нырок + укол","Как делается: боец резко опускает корпус почти до земли, уходя под атаку, ставит свободную руку на пол и одновременно колет снизу вверх.\nКак бьёт: клинок входит в верхнюю часть тела соперника, пока его удар проходит над головой: так Андре ранил куклу Хан Дэви в плечо даже под контратакой.\nКогда применять: как уклонение и атака одновременно.",[["spd",3],["tech",3]],"Срабатывает как уклонение + атака.",[],"Отсутствуют.")]},

 {id:"kusanagi",name:"Стиль Кусанаги",orig:"Kusanagi Style · Кусанаги-рю",rarity:"special",types:["weapon","strike"],base:"Кэндзюцу клана Кусанаги",
  founder:"Клан Кусанаги",masters:[["Кёити Кусанаги","единственный известный носитель"],["Хуэй Мори","скопировал часть техник"],["Джин Мори / Дан Мори","использовал"]],
  about:"Родовой стиль клана Кусанаги, сосредоточенный на фехтовании — и с мечом, и без него. Когда он был создан, неизвестно.",
  passive:[["tech",2],["spd",1]],
  ability:["Безмечный клинок","Рука может работать как меч: все техники стиля доступны без оружия с −2 к Силе."],
  limits:"С мечом — полная сила, без меча — −2 Силы.",
  moves:[
   M("Тёмный разрез","Безмечный","Как делается: пальцы сжаты, ладонь становится плоской и твёрдой, как клинок. Боец бьёт ребром ладони по траектории удара мечом — сверху наискось или горизонтально.\nКак бьёт: ребро ладони рассекает плоть, как настоящее лезвие.\nКогда применять: когда меча нет.",[["str",4]],"",[],"Отсутствуют."),
   M("Ядовитый укус","Меч · серия","Как делается: серия коротких быстрых разрезов: клинок жалит, как змея, и сразу возвращается, чтобы ужалить снова.\nКак бьёт: множество порезов приходится по одному или сразу нескольким соперникам вокруг.\nКогда применять: против нескольких противников вплотную.",[["spd",4],["str",2]],"До трёх целей.",[["end",-1]],""),

   M("Ловушка 108 змей","Меч · ультима","Как делается: добивающая техника клана: судя по названию — сеть из ста восьми разрезов, сплетающихся вокруг соперника. В манхве не показана.\nКак бьёт: соперник оказывается в «ловушке» из множества разрезов со всех сторон; точный эффект решает ГМ.\nКогда применять: как финальный удар.",[["spd",8],["str",6]],"",[["end",-5]],"")]},

   M("Лоу-кик","Удар ногой","Как делается: боец делает небольшой шаг в сторону от линии соперника, разворачивается на подушечке опорной стопы и бьёт голенью по бедру сверху вниз, доворачивая таз.\nКак бьёт: голень врезается в мышцу бедра; после пары попаданий нога немеет и соперник теряет подвижность.\nКогда применять: против бойцов, которые много двигаются.",[["str",2]],"При двух попаданиях подряд Скорость соперника −1.",[],"Отсутствуют."),
   M("Хай-кик","Удар ногой","Как делается: боец разворачивается на подушечке опорной стопы, поднимает колено и по кругу заводит голень на уровень головы, одной рукой прикрывая своё лицо.\nКак бьёт: голень врезается в висок или челюсть — чистое попадание может выключить соперника.\nКогда применять: когда соперник опустил руки.",[["str",4]],"",[["per",-1]],"Если соперник прочитал удар — боец на одной ноге и открыт."),
   M("Связка «двойка — лоу»","Комбинация","Как делается: боец бьёт двойку в голову, чтобы соперник поднял руки, и, не возвращаясь в стойку, сразу бьёт лоу-кик по открывшейся ноге.\nКак бьёт: соперник получает удары и по голове, и по ноге: закрыть оба уровня он не успевает.\nКогда применять: против соперника, закрывающегося высоко.",[["spd",2],["tech",1]],"",[["end",-1]],"")]},

 {id:"wrestling",name:"Борьба",orig:"Wrestling (вольная / греко-римская)",rarity:"regular",types:["grapple"],base:"Вольная и греко-римская борьба",founder:"Одно из древнейших искусств человечества",masters:[],
  about:"Искусство контроля: проходы в ноги, броски, удержания и работа в клинче. Борец не бьёт — он ломает равновесие соперника, переводит его на землю и давит весом. Против ударника выигрывает, если сумел сократить дистанцию.",
  passive:[["str",1],["end",1]],ability:null,limits:"Нет ударов: на дальней дистанции боец уязвим.",
  moves:[
   M("Проход в ноги","Сваливание","Как делается: боец резко опускает уровень, сгибая колени, ныряет под выставленные руки соперника, обхватывает обе его ноги под коленями и толкает плечом вперёд, одновременно подтягивая ноги на себя.\nКак бьёт: соперник теряет опору и падает на спину, а боец оказывается сверху; бой переходит в партер.\nКогда применять: против ударника, который бьёт с дальней дистанции.",[["spd",2],["str",1]],"Бой переходит в партер.",[["dur",-1]],"Можно нарваться на встречное колено."),
   M("Бросок прогибом","Бросок","Как делается: боец обхватывает корпус соперника спереди или сзади, приседает, отрывает его от земли и падает назад, выгибаясь в спине мостом.\nКак бьёт: соперник перелетает через бойца и врезается в землю головой и спиной.\nКогда применять: в клинче, когда руки на корпусе.",[["str",4]],"",[["end",-2]],""),
   M("Удержание","Контроль","Как делается: боец ложится поперёк соперника, прижимая его грудью к земле, одной рукой обхватывает голову, другой блокирует руку, а ноги расставляет для упора.\nКак бьёт: соперник не может встать и почти не может бить, а каждое движение тратит его силы.\nКогда применять: в партере сверху.",[["dur",2],["str",1]],"Соперник −2 Скорости, пока удержание не сорвано.",[["spd",-1]],""),
   M("Клинч","Контроль","Как делается: боец обхватывает шею соперника одной рукой, второй захватывает его руку и виснет на нём всем весом.\nКак бьёт: удары соперника гасятся на коротком расстоянии, а сам боец готовит бросок.\nКогда применять: против ударника, чтобы не дать ему бить.",[["tech",2]],"Удары соперника в клинче −1 Силы.",[],"Отсутствуют.")]},

 {id:"taekwondo",name:"Тхэквондо",orig:"Taekwondo (WT / ITF)",rarity:"regular",types:["strike"],base:"Корейское боевое искусство",founder:"Чхве Хон Хи и корейские мастера, 1950-е",masters:[],
  about:"Обычное спортивное тхэквондо — база, из которой выросли Северное ITF и Ре-Тхэквондо. Упор на быстрые и высокие удары ногами, работу на дистанции и прыжковую технику. Руки служат в основном для защиты.",
  passive:[["spd",1],["per",1]],ability:null,limits:"Слабая защита от борьбы и ударов руками вплотную.",
  moves:[
   M("Доллё-чаги","Круговой удар","Как делается: боец переносит вес на переднюю ногу, разворачивает опорную стопу пяткой к сопернику и поднимает бьющее колено. Нога разгибается по кругу, удар наносится подъёмом стопы, бедро доворачивается в момент контакта.\nКак бьёт: хлёсткий удар подъёмом в корпус или голову сбоку — быстрый и точный, основа спортивного тхэквондо.\nКогда применять: как основной удар для набора очков и связок.",[["spd",2],["str",1]],"",[],"Отсутствуют."),
   M("Ёп-чаги","Боковой удар","Как делается: колено поднимается к груди, корпус разворачивается боком к сопернику, опорная стопа уходит пяткой вперёд, и нога выстреливает ребром стопы по прямой, как поршень.\nКак бьёт: стопа таранит корпус и отталкивает соперника назад, сбивая его наступление.\nКогда применять: чтобы держать дистанцию.",[["str",2]],"Отбрасывание.",[],"Отсутствуют."),
   M("Твит-чаги","Удар назад","Как делается: боец разворачивается спиной к сопернику на опорной ноге, через плечо находит цель взглядом и выстреливает пяткой назад по прямой.\nКак бьёт: пятка врезается в живот или голову со всей инерцией разворота — один из самых сильных ударов ногой.\nКогда применять: как контратака на наступающего соперника.",[["str",3]],"",[["per",-1]],""),
   M("Тымё-чаги","Прыжковый удар","Как делается: боец отталкивается обеими ногами, в воздухе поднимает колено и бьёт ногой прямо вперёд или с разворота, затем приземляется в стойку.\nКак бьёт: удар приходит сверху в голову с силой прыжка.\nКогда применять: когда соперник замешкался или отступил.",[["str",3],["spd",1]],"",[["dur",-1]],"В воздухе нет опоры.")]},

 {id:"boxing",name:"Бокс",orig:"Boxing",rarity:"regular",types:["strike"],base:"Английский бокс",founder:"Правила маркиза Куинсберри, 1867",masters:[],
  about:"Искусство кулака. Работа ног, уклоны, нырки и комбинации руками на скорости, которую трудно отследить. Боксёр почти не бьёт ногами и не борется, зато в обмене руками он сильнее любого.",
  passive:[["spd",1],["per",1]],ability:null,limits:"Удары ногами и броски недоступны.",
  moves:[
   M("Джеб","Удар рукой","Как делается: боец выстреливает передней рукой по прямой без замаха, слегка доворачивая плечо, и сразу возвращает кулак к подбородку.\nКак бьёт: быстрый удар в лицо сбивает ритм и прицел соперника и мешает ему атаковать.\nКогда применять: для разведки и подготовки сильного удара.",[["spd",2]],"",[],"Отсутствуют."),
   M("Кросс","Удар рукой","Как делается: боец толкается задней ногой, разворачивает бедро и плечо и бьёт задней рукой прямым через центр.\nКак бьёт: удар несёт весь вес тела и часто нокаутирует.\nКогда применять: как главный нокаутирующий удар.",[["str",3]],"",[],"Отсутствуют."),
   M("Хук","Боковой удар","Как делается: боец сгибает руку в локте под прямым углом и бьёт сбоку, разворачивая корпус на передней ноге.\nКак бьёт: кулак врезается в челюсть или печень сбоку от защиты.\nКогда применять: в ближнем бою.",[["str",3],["tech",1]],"",[],"Отсутствуют."),
   M("Нырок и апперкот","Контратака","Как делается: боец приседает, уходя под удар соперника, и из нижнего положения бьёт кулаком снизу вверх, разгибая ноги.\nКак бьёт: кулак врезается в подбородок открывшегося соперника.\nКогда применять: в ответ на удар рукой.",[["per",2],["str",2]],"Контратака: срабатывает в ответ на удар рукой.",[["dur",-1]],"Ошибка тайминга — пропущенный удар.")]},

 {id:"bjj",name:"Бразильское джиу-джитсу",orig:"Brazilian Jiu-jitsu",rarity:"regular",types:["grapple"],base:"Дзюдо Мицуё Маэды → семья Грейси",founder:"Семья Грейси",masters:[],
  about:"Борьба в партере: стиль переводит бой на землю, где сила противника перестаёт решать, и заканчивает его удушением или рычагом. Боец БЖЖ спокойно лежит на спине — гард для него такая же защита, как стойка для ударника.",
  passive:[["tech",1],["end",1]],
  ability:["Гард","Лёжа на спине, боец не теряет защиту: атаки соперника в партере получают −2 Силы."],
  limits:"Почти бесполезен против нескольких противников одновременно.",
  moves:[
   M("Проход в ноги","Сваливание","Как делается: боец ныряет под руки соперника, обхватывает обе его ноги под коленями и толкает плечом, переводя на землю.\nКак бьёт: соперник падает на спину, и бой переходит в партер, где сильна борьба.\nКогда применять: чтобы перенести бой туда, где силён стиль.",[["spd",3],["tech",2]],"Бой переходит в партер.",[["dur",-1]],"Можно нарваться на колено."),
   M("Треугольник","Удушение ногами","Как делается: лёжа на спине в гарде, боец закидывает ноги на шею и одну руку соперника и смыкает их треугольником, зажимая голень под коленом.\nКак бьёт: бедро бойца и плечо самого соперника пережимают ему сонные артерии.\nКогда применять: из гарда.",[["tech",5]],"Соперник теряет 1 уровень Выносливости за ход, пока не вырвется.",[["spd",-2]],"Боец на спине."),
   M("Рычаг локтя","Рычаг","Как делается: боец захватывает руку соперника, зажимает её между ногами, ложится на спину и поднимает бёдра, выпрямляя локоть против сгиба.\nКак бьёт: локоть соперника выгибается и может сломаться.\nКогда применять: в партере.",[["tech",4],["str",2]],"Сила соперника −2 при полном рычаге.",[["spd",-1]],""),
   M("Удушение сзади","Удушение","Как делается: боец заходит за спину, обхватывает шею предплечьем так, что сгиб локтя под подбородком, и замыкает замок второй рукой за головой.\nКак бьёт: кровь перестаёт поступать в мозг, и соперник теряет сознание.\nКогда применять: когда занял спину соперника.",[["tech",5]],"При удержании 2 хода — соперник теряет сознание (по решению ГМа).",[["spd",-2]],"Нужно занять спину.")]},

 {id:"capoeira",name:"Капоэйра",orig:"Capoeira",rarity:"regular",types:["strike"],base:"Афро-бразильское искусство",founder:"Африканские рабы в Бразилии, XVI–XIX вв.",masters:[],
  about:"Боевой танец, замаскированный под игру. Боец постоянно качается в «жинге», крутится, встаёт на руки и бьёт ногами из неожиданных положений. Ритм сбивает соперника с толку, а махи ногами на вращении очень сильны.",
  passive:[["spd",1],["end",1]],ability:null,limits:"Удары руками почти не используются.",
  moves:[
   M("Жинга","Передвижение","Как делается: базовое движение капоэйры: боец постоянно переступает назад-вперёд, переносит вес с ноги на ногу и раскачивается корпусом, держа руки у лица.\nКак бьёт: сам не бьёт, но сбивает сопернику прицел и маскирует подготовку удара — из любой фазы жинги можно выстрелить ногой.\nКогда применять: постоянно, между ударами.",[["spd",2]],"Соперник −1 Восприятия против следующей атаки бойца.",[],"Отсутствуют."),
   M("Мея-луа-ди-компасу","Удар с разворота","Как делается: боец опускает руки к земле, опираясь на них, разворачивается спиной и выводит прямую ногу пяткой по широкой горизонтальной дуге.\nКак бьёт: пятка врезается в голову на огромной траектории; удар очень сильный, хотя и заметный.\nКогда применять: против соперника на средней дистанции.",[["str",3],["spd",1]],"",[["per",-1]],""),
   M("Мартелу","Удар ногой","Как делается: из жинги боец поднимает колено и выстреливает круговым ударом подъёмом стопы, как молотком.\nКак бьёт: быстрый удар приходится в голову сбоку.\nКогда применять: как быстрая атака между движениями.",[["str",2],["spd",1]],"",[],"Отсутствуют."),
   M("Растейра","Подсечка","Как делается: боец приседает почти до земли, опирается на руку и сметает опорную ногу соперника внутренней стороной стопы.\nКак бьёт: соперник теряет опору и падает.\nКогда применять: когда соперник стоит на одной ноге или бьёт ногой.",[["tech",2]],"Сбивает с ног.",[],"Отсутствуют.")]},

 {id:"kudo",name:"Кудо",orig:"Kudo · Дайдо-дзюку",rarity:"regular",types:["mixed"],base:"Каратэ + дзюдо + бокс",founder:"Адзума Такаси, 1981",masters:[],
  about:"Японское смешанное единоборство: удары руками, ногами, головой и коленями, броски и короткая борьба в партере. Бойцы работают в защитном шлеме, поэтому бьют в полный контакт, в том числе в голову.",
  passive:[["dur",1],["str",1]],ability:null,limits:"Партер ограничен: удушение или рычаг надо закончить за 1 ход.",
  moves:[
   M("Удар головой","Удар в клинче","Как делается: из захвата за плечи или шею боец резко притягивает соперника к себе и бьёт лбом в лицо, вкладывая движение корпуса.\nКак бьёт: лоб врезается в нос или скулу и ошеломляет; в кудо это разрешено, потому что бойцы в шлемах.\nКогда применять: в клинче.",[["str",3]],"",[["dur",-1]],"Боец сам получает отдачу."),
   M("Колено в клинче","Удар коленом","Как делается: боец обхватывает голову соперника обеими руками, тянет её вниз и одновременно бьёт коленом вверх.\nКак бьёт: колено врезается в лицо или солнечное сплетение.\nКогда применять: в клинче.",[["str",3]],"",[],"Отсутствуют."),
   M("Бросок и добивание","Связка","Как делается: боец подсечкой или броском через бедро роняет соперника и сразу, не давая опомниться, бьёт кулаком сверху.\nКак бьёт: соперник падает и тут же получает удар по лежащему.\nКогда применять: в ближнем бою.",[["tech",2],["str",1]],"",[["end",-1]],""),
   M("Маэ-гэри","Прямой удар ногой","Как делается: боец поднимает колено к груди и выстреливает стопой вперёд, ударяя подушечкой или подошвой.\nКак бьёт: удар в живот или грудь останавливает атакующего соперника.\nКогда применять: против наступления.",[["spd",2]],"",[],"Отсутствуют.")]},

 {id:"judo",name:"Дзюдо",orig:"Judo",rarity:"regular",types:["grapple"],base:"Дзюдзюцу",founder:"Кано Дзигоро, 1882",masters:[],
  about:"«Мягкий путь»: используй силу соперника против него. Захват за кимоно или одежду, слом равновесия (кудзуси) и бросок, в котором противник падает собственной инерцией. Есть удушения и рычаги, но главное — броски.",
  passive:[["tech",1],["dur",1]],ability:null,limits:"Почти нет ударов. Лучше всего работает, когда на сопернике одежда, за которую можно взяться.",
  moves:[
   M("Сэой-нагэ","Бросок через плечо","Как делается: боец захватывает рукав и ворот соперника, разворачивается к нему спиной, подсаживается под него и, наклоняясь вперёд, перебрасывает через плечо.\nКак бьёт: соперник падает на спину с высоты роста бойца.\nКогда применять: против соперника, давящего вперёд.",[["str",2],["tech",2]],"",[["spd",-1]],""),
   M("О-сото-гари","Подсечка","Как делается: боец шагает вплотную, толкает соперника назад руками и одновременно выбивает его опорную ногу своей ногой сзади.\nКак бьёт: соперник падает назад, сильно ударяясь спиной.\nКогда применять: когда соперник стоит на пятках.",[["tech",3]],"Сбивает с ног.",[],"Отсутствуют."),
   M("Кудзуси","Слом равновесия","Как делается: боец резко дёргает соперника за одежду в сторону, где у того нет опоры, — вперёд, назад или вбок.\nКак бьёт: сам не бросает, но ломает равновесие, и любой следующий бросок проходит легко.\nКогда применять: перед любым броском.",[["tech",2]],"Следующий бросок +2 Техники БИ.",[],"Отсутствуют."),
   M("Удушение отворотами","Удушение","Как делается: боец берётся за ворот соперника скрещенными руками и сводит предплечья на его шее, как ножницы.\nКак бьёт: шея соперника пережимается, и он задыхается.\nКогда применять: в партере или в стойке.",[["tech",3]],"Соперник −1 Выносливости за ход.",[["spd",-1]],"")]},

 {id:"karate",name:"Каратэ",orig:"Karate (традиционное)",rarity:"regular",types:["strike"],base:"Окинавские боевые искусства",founder:"Окинавские мастера; Фунакоси Гитин",masters:[],
  about:"Традиционное каратэ — база, из которой вырос Кёкусинкай Хан Дэви. Чёткие стойки, прямые удары с вложением бедра, блоки и ката. Каждый удар задуман как последний.",
  passive:[["str",1],["tech",1]],ability:null,limits:"Слабая работа в партере.",
  moves:[
   M("Ой-дзуки","Прямой удар","Как делается: боец делает длинный шаг вперёд и в момент постановки ноги выбрасывает кулак той же стороны, разворачивая его костяшками вниз. Рука и нога приходят одновременно.\nКак бьёт: вес тела и инерция шага целиком уходят в кулак — удар с дистанции, способный опрокинуть.\nКогда применять: для атаки, когда соперник стоит далеко.",[["str",3]],"",[],"Отсутствуют."),
   M("Гяку-дзуки","Обратный удар","Как делается: из стойки боец резко разворачивает бёдра и бьёт дальней рукой по прямой, а ближнюю руку в этот момент отводит к бедру.\nКак бьёт: самый сильный удар рукой в каратэ: вся сила бёдер уходит в кулак.\nКогда применять: как контратака после блока.",[["str",3],["tech",1]],"",[],"Отсутствуют."),
   M("Маваши-гэри","Круговой удар","Как делается: боец поднимает колено сбоку, разворачивает опорную стопу и бьёт ногой по кругу подушечкой стопы или голенью.\nКак бьёт: удар приходится в голову или корпус сбоку.\nКогда применять: как основной удар ногой.",[["str",2],["spd",1]],"",[],"Отсутствуют."),
   M("Агэ-укэ","Блок","Как делается: предплечье поднимается от груди вверх по дуге над головой и в конце скручивается наружу.\nКак бьёт: удар соперника сверху уходит над головой, а сам соперник открывается для контратаки.\nКогда применять: как защита от ударов сверху.",[["dur",3]],"Следующий удар +1 Силы.",[],"Отсутствуют.")]},

 {id:"pankration",name:"Панкратион",orig:"Pankration",rarity:"regular",types:["mixed"],base:"Древнегреческое единоборство",founder:"Древняя Греция, олимпийские игры 648 г. до н. э.",masters:[],
  about:"«Всеборье» древних олимпийских игр: разрешено почти всё, кроме укусов и выдавливания глаз. Удары, броски, удушения, рычаги — бой до сдачи. Предок современного ММА.",
  passive:[["str",1],["end",1]],ability:null,limits:"Отсутствуют.",
  moves:[
   M("Климакс","Бросок","Как делается: боец заходит за спину соперника, обхватывает его корпус, приседает и, разгибаясь, отрывает его от земли и бросает вниз.\nКак бьёт: соперник падает с высоты прямо на землю.\nКогда применять: когда соперник открыл спину.",[["str",3]],"",[["end",-1]],""),
   M("Удар пяткой по лежащему","Добивание","Как делается: боец поднимает колено высоко и топчущим ударом опускает пятку на лежащего соперника.\nКак бьёт: пятка бьёт по корпусу или голове соперника на земле — в древнем панкратионе так было можно.\nКогда применять: против лежащего соперника.",[["str",3]],"Только против лежащего соперника.",[],"Отсутствуют."),
   M("Удушение предплечьем","Удушение","Как делается: боец кладёт предплечье на горло соперника, а второй рукой давит ему на затылок, сжимая шею.\nКак бьёт: горло пережимается, и соперник задыхается.\nКогда применять: в партере.",[["tech",3]],"Соперник −1 Выносливости за ход.",[["spd",-1]],""),
   M("Удар в корпус","Удар рукой","Как делается: боец сгибает колени, опускается на уровень живота соперника и бьёт кулаком снизу вверх под рёбра.\nКак бьёт: удар выбивает дыхание и заставляет соперника согнуться.\nКогда применять: в ближнем бою.",[["str",2]],"Выносливость соперника −1.",[],"Отсутствуют.")]},

 {id:"kali",name:"Кали / Арнис",orig:"Kali · Arnis · Eskrima",rarity:"regular",types:["weapon","strike"],base:"Филиппинские боевые искусства",founder:"Филиппинские воины",masters:[],
  about:"Филиппинское искусство палок и ножей. Обучение начинается с оружия, а руки потом повторяют те же траектории. Быстрые потоки ударов, обезоруживания и работа двумя палками сразу.",
  passive:[["spd",1],["tech",1]],ability:null,limits:"Лучшие техники требуют палки или ножа.",
  moves:[
   M("Сината","Двойные палки","Как делается: две палки описывают непрерывные восьмёрки перед бойцом: пока одна бьёт, вторая уже замахивается. Кисти работают как маятники.\nКак бьёт: поток ударов с обеих сторон не прекращается — соперник не успевает вставить ни одного удара.\nКогда применять: с двумя палками.",[["spd",3],["str",1]],"",[["end",-1]],"Нужны две палки."),
   M("Обезоруживание","Контратака","Как делается: боец ловит руку с оружием своей рукой, второй бьёт по запястью и выкручивает его, уводя оружие от себя.\nКак бьёт: оружие выпадает из руки соперника.\nКогда применять: против вооружённого соперника.",[["tech",3]],"Соперник теряет оружие.",[],"Отсутствуют."),
   M("Укол ножом","Нож","Как делается: боец держит нож скрыто — вдоль предплечья — и коротким движением колет в корпус.\nКак бьёт: клинок входит в тело, рана кровоточит.\nКогда применять: только с ножом.",[["spd",2],["str",2]],"Кровотечение: Выносливость соперника −1.",[],"Только с ножом."),
   M("Хубуд","Контроль рук","Как делается: боец перехватывает руки соперника и передаёт их из своей руки в руку, как по цепочке, постоянно контролируя их.\nКак бьёт: руки соперника оказываются связаны, а его тело открывается для удара.\nКогда применять: в ближнем бою.",[["tech",2],["per",1]],"",[],"Отсутствуют.")]},

 {id:"ssireum",name:"Ссирым",orig:"Ssireum",rarity:"regular",types:["grapple"],base:"Корейская народная борьба",founder:"Корея, эпоха Когурё",masters:[],
  about:"Традиционная корейская борьба на песке. Борцы держат друг друга за пояс-сатпа на бедре и правой ноге и стараются уронить соперника любой частью тела выше колена. Огромная сила ног и корпуса.",
  passive:[["str",1],["dur",1]],ability:null,limits:"Нужно взяться за пояс или одежду.",
  moves:[
   M("Подъём за сатпа","Бросок","Как делается: борцы держат друг друга за пояс; боец приседает, подсаживается под соперника и, разгибаясь, отрывает его от земли за пояс.\nКак бьёт: соперник повисает в воздухе и падает набок.\nКогда применять: в захвате за пояс.",[["str",3]],"",[["end",-1]],""),
   M("Подножка изнутри","Подсечка","Как делается: боец заводит ногу между ног соперника и выбивает его опорную ногу изнутри, одновременно толкая корпус.\nКак бьёт: соперник теряет опору и падает.\nКогда применять: в захвате.",[["tech",2]],"Сбивает с ног.",[],"Отсутствуют."),
   M("Толчок корпусом","Таран","Как делается: боец упирается плечом в грудь соперника и толкает его вперёд мелкими сильными шагами.\nКак бьёт: соперник отступает, теряет опору и падает.\nКогда применять: в захвате, против более лёгкого соперника.",[["str",2],["dur",1]],"",[],"Отсутствуют."),
   M("Бросок через бедро","Бросок","Как делается: боец разворачивается спиной к сопернику, подсаживается бедром под его таз и бросает соперника через себя.\nКак бьёт: соперник падает на спину.\nКогда применять: в захвате.",[["str",2],["tech",1]],"",[],"Отсутствуют.")]},

 {id:"kravmaga",name:"Крав-мага",orig:"Krav Maga",rarity:"regular",types:["mixed"],base:"Израильская система самообороны",founder:"Ими Лихтенфельд, 1930–40-е",masters:[],
  about:"Самооборона, а не спорт: нейтрализовать угрозу как можно быстрее любым способом. Удары в пах, глаза и горло, защита от ножа и пистолета, одновременная защита и атака.",
  passive:[["per",1],["tech",1]],ability:null,limits:"Нет красивых и сильных техник: всё рассчитано на короткую стычку.",
  moves:[
   M("Защита с одновременной атакой","Контратака","Как делается: боец одной рукой отбивает удар соперника в сторону, а другой в тот же момент бьёт его в горло или лицо.\nКак бьёт: соперник получает удар, не успев закончить свою атаку.\nКогда применять: в ответ на любой удар.",[["per",2],["str",1]],"Контратака.",[],"Отсутствуют."),
   M("Удар в пах","Удар ногой","Как делается: боец бьёт ногой или коленом коротко снизу вверх в пах.\nКак бьёт: соперник сгибается от боли и замедляется.\nКогда применять: в ближнем бою.",[["spd",2]],"Соперник −1 Скорости на ход.",[],"Отсутствуют."),
   M("Обезоруживание ножа","Защита","Как делается: боец перехватывает руку с ножом, бьёт по ней и выкручивает, одновременно уводя клинок от своего тела.\nКак бьёт: нож выпадает из руки соперника.\nКогда применять: против нападения с ножом.",[["tech",3]],"Соперник теряет нож.",[["dur",-1]],"Ошибка — порез."),
   M("Удар ладонью в лицо","Удар рукой","Как делается: боец выстреливает основанием ладони прямо в нос или подбородок.\nКак бьёт: удар ошеломляет и не травмирует руку бойца.\nКогда применять: в ближнем бою.",[["str",2]],"",[],"Отсутствуют.")]},

 {id:"mma",name:"ММА",orig:"Mixed Martial Arts",rarity:"regular",types:["mixed"],base:"Бокс, борьба, БЖЖ, муай-тай",founder:"Современный спорт, UFC с 1993",masters:[],
  about:"Смешанные единоборства: боец одинаково умеет бить, бороться и сдавать соперника на земле. Ничего не знает лучше всех, но и слабых мест у него почти нет.",
  passive:[["str",1],["tech",1]],ability:null,limits:"Отсутствуют.",
  moves:[
   M("Граунд-энд-паунд","Добивание","Как делается: боец садится на соперника сверху, прижимает его коленями и бьёт кулаками и локтями сверху вниз.\nКак бьёт: соперник получает удары, лёжа на спине и почти не имея возможности защититься.\nКогда применять: сверху в партере.",[["str",3]],"Только сверху в партере.",[],"Отсутствуют."),
   M("Перевод от сетки","Сваливание","Как делается: боец прижимает соперника к стене или сетке, захватывает его ноги и переводит на землю.\nКак бьёт: соперник падает, и бой переходит в партер.\nКогда применять: в ближнем бою у стены.",[["str",2],["tech",1]],"",[],"Отсутствуют."),
   M("Супермен-панч","Удар рукой","Как делается: боец делает вид, что бьёт ногой, а сам отталкивается от этой ноги и выпрыгивает вперёд в прямой удар рукой.\nКак бьёт: кулак врезается в лицо соперника, ожидавшего удара ногой.\nКогда применять: против соперника, реагирующего на финты.",[["spd",2],["str",1]],"",[["dur",-1]],""),
   M("Гильотина","Удушение","Как делается: боец зажимает шею соперника под мышкой, а предплечьем давит ему на горло, поднимая локоть.\nКак бьёт: горло пережимается, и соперник задыхается.\nКогда применять: когда соперник ныряет в ноги.",[["tech",3]],"Соперник −1 Выносливости за ход.",[["spd",-1]],"")]},

 {id:"jigen",name:"Дзиген-рю",orig:"Jigen-ryū",rarity:"advanced",types:["weapon"],base:"Японское кэндзюцу (Сацума)",founder:"Того Тюи, XVI–XVII вв.",masters:[],
  about:"Школа меча из княжества Сацума с одной идеей: первый удар должен убить. Боец поднимает меч высоко над головой в стойке «тонбо» и обрушивает его с диким криком. Второго удара не требуется — так учили сацумских самураев.",
  passive:[["str",2],["spd",1]],ability:["Ни-но тати ирадзу","«Второй удар не нужен»: первая атака мечом в бою получает +2 Силы."],
  limits:"Требует меча. Защиты почти нет.",
  moves:[
   M("Тонбо","Стойка","Как делается: боец поднимает меч высоко у правого плеча, остриём в небо, локти широко, вес на передней ноге, и замирает, собирая силу.\nКак бьёт: сам не бьёт, но заряжает следующий удар огромной силой — из этой стойки рождается главный удар школы.\nКогда применять: перед первым ударом.",[["str",2]],"Следующий удар +2 Силы.",[["dur",-1]],"Корпус открыт."),
   M("Удар первого решения","Рубящий","Как делается: из стойки тонбо боец с диким криком «киэ» бросается вперёд и обрушивает меч наискось сверху вниз, вкладывая всё тело.\nКак бьёт: удар пробивает блок вместе с оружием соперника и рассекает его — второй удар обычно уже не нужен.\nКогда применять: как главный удар стиля.",[["str",6]],"Пробивает блок оружием.",[["spd",-2]],""),
   M("Тренировка на бревне","Серия","Как делается: боец рубит быстро и поочерёдно с левой и правой стороны, как сацумцы, которые тысячи раз в день бьют по деревянному столбу.\nКак бьёт: серия тяжёлых ударов с обеих сторон ломает защиту.\nКогда применять: как серия, когда соперник закрылся.",[["spd",3],["str",2]],"",[["end",-2]],""),
   M("Кэсагири","Диагональный","Как делается: боец ведёт клинок по диагонали от плеча соперника к его противоположному бедру, разворачивая корпус.\nКак бьёт: клинок рассекает соперника наискось.\nКогда применять: как основной разрез.",[["str",4]],"",[],"Отсутствуют.")]},

 {id:"iaido",name:"Иайдо",orig:"Iaidō",rarity:"advanced",types:["weapon"],base:"Японское искусство выхватывания меча",founder:"Хаясидзаки Дзинсукэ, XVI в.",masters:[],
  about:"Искусство мгновенного обнажения меча: удар начинается прямо из ножен. Мечник стоит спокойно, клинок спрятан, а в следующее мгновение соперник уже разрезан. Всё решает первая доля секунды.",
  passive:[["spd",2],["per",1]],ability:["Нукицукэ","Если меч в ножнах, первая атака бойца в обмене проходит раньше атаки соперника."],
  limits:"Требует меча в ножнах. После выхватывания способность не работает, пока меч не убран.",
  moves:[
   M("Нукицукэ","Выхватывание","Как делается: меч в ножнах; боец выхватывает клинок и тем же движением проводит горизонтальный разрез на уровне глаз или горла.\nКак бьёт: удар приходит раньше, чем соперник успевает начать атаку.\nКогда применять: из ножен, как первый удар.",[["spd",5]],"",[],"Отсутствуют."),
   M("Кирицукэ","Рубящий","Как делается: после выхватывания боец поднимает меч над головой и рубит сверху вниз, делая шаг вперёд.\nКак бьёт: сильный нисходящий разрез добивает соперника.\nКогда применять: после Нукицукэ.",[["str",4]],"",[],"Отсутствуют."),
   M("Тибури","Стряхивание","Как делается: боец резко взмахивает клинком, стряхивая с него кровь, и при этом не сводит глаз с упавшего соперника.\nКак бьёт: сам не бьёт, но сохраняет готовность к атаке.\nКогда применять: после удара.",[["per",2]],"",[],"Отсутствуют."),
   M("Носто","Возврат в ножны","Как делается: боец плавно возвращает клинок в ножны, ведя обух по пальцам левой руки.\nКак бьёт: сам не бьёт, но позволяет снова выхватить меч для Нукицукэ.\nКогда применять: чтобы восстановить Нукицукэ.",[],"Восстанавливает способность «Нукицукэ».",[["spd",-1]],"")]},

 {id:"kendo",name:"Кендо",orig:"Kendō",rarity:"advanced",types:["weapon"],base:"Кэндзюцу",founder:"Японские школы меча, XVIII в.",masters:[],
  about:"Путь меча на бамбуковых синаях: прямые и быстрые удары в голову, запястья, корпус и горло. Каждый удар сопровождается криком и шагом. Огромная скорость и дисциплина.",
  passive:[["spd",2],["tech",1]],ability:null,limits:"Требует меча или палки.",
  moves:[
   M("Мэн","Удар в голову","Как делается: боец поднимает меч над головой и с шагом вперёд и криком «мэн!» бьёт прямо сверху в макушку.\nКак бьёт: быстрый удар сверху в голову — самый быстрый удар кендо.\nКогда применять: как основной удар.",[["spd",3],["str",1]],"",[],"Отсутствуют."),
   M("Котэ","Удар по запястью","Как делается: короткий быстрый удар сверху по запястью руки, держащей оружие.\nКак бьёт: удар по запястью может выбить оружие из руки соперника.\nКогда применять: против вооружённого соперника.",[["spd",2],["tech",1]],"Может выбить оружие у соперника.",[],"Отсутствуют."),
   M("До","Удар в корпус","Как делается: боец проходит мимо соперника и на ходу наносит горизонтальный удар по его боку.\nКак бьёт: удар приходится по рёбрам.\nКогда применять: когда соперник поднял руки.",[["str",3]],"",[],"Отсутствуют."),
   M("Цуки","Укол в горло","Как делается: боец делает выпад и колет остриём прямо в горло.\nКак бьёт: остриё бьёт в горло, перекрывая дыхание.\nКогда применять: против соперника перед собой.",[["str",3],["spd",2]],"",[["dur",-1]],"")]},

 {id:"aikido",name:"Айкидо",orig:"Aikidō",rarity:"advanced",types:["grapple","inner"],base:"Дайто-рю айки-дзюдзюцу",founder:"Уэсиба Морихэй, 1920–30-е",masters:[],
  about:"Искусство гармонии: айкидока не атакует сам, а принимает атаку, входит в её движение и разворачивает её против нападающего. Круговые входы, рычаги на кисть и броски, в которых противник падает своей же силой.",
  passive:[["tech",2],["per",1]],ability:["Слияние","Против атаки соперника боец может провести бросок, получая +1 Силы за каждые 2 Силы удара соперника."],

/* ======= утилиты ======= */
const app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hash=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)};
function art(seed,color,word){
  const cx=[300,420,200,350][seed%4],cy=[220,160,260,200][(seed>>2)%4];let l="";
  for(let i=0;i<64;i++){const a=i/64*Math.PI*2+(seed%9)*.03,r1=50+((i*29+seed)%70);l+=`<line x1="${(cx+Math.cos(a)*r1).toFixed(1)}" y1="${(cy+Math.sin(a)*r1).toFixed(1)}" x2="${(cx+Math.cos(a)*900).toFixed(1)}" y2="${(cy+Math.sin(a)*900).toFixed(1)}" stroke="${i%6===0?color:"#fff"}" stroke-width="${i%6===0?4:1}" stroke-opacity="${i%6===0?.75:.16}"/>`}
  return `<svg viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><radialGradient id="g${seed}" cx="${cx/6}%" cy="${cy/8}%" r="60%"><stop offset="0" stop-color="${color}" stop-opacity=".55"/><stop offset="1" stop-color="#07080D" stop-opacity="0"/></radialGradient></defs><rect width="600" height="800" fill="#0E1119"/>${l}<rect width="600" height="800" fill="url(#g${seed})"/>${word?`<text x="${cx}" y="${cy+30}" text-anchor="middle" font-family="Rubik Mono One,Arial Black" font-size="92" fill="#fff" fill-opacity=".9" stroke="#07080D" stroke-width="8" paint-order="stroke" transform="rotate(-8 ${cx} ${cy})">${word}</text>`:""}</svg>`}
const rc=s=>RAR[s.rarity][1];
const media=s=>imgOf(s.id)?`${pic(imgOf(s.id))}`:art(hash(s.id),rc(s),"");
const modChip=([k,v],cls)=>`<span class="mod ${cls}">${esc(ST[k]||k)} ${v>0?"+":""}${v}</span>`;
let rf="all",tf="all",q="";

/* ======= история и категории ======= */
const LORE=[["lead", "В древние времена Землю делили люди, боги и чудовища. Чудовища были несравнимо сильнее людей и хотели властвовать над ними, а человечество жило в каменном веке — разрозненными кланами, и каждый клан выживал как мог."], ["", "Тогда Унгнё, вождь одного из кланов, обратилась к далёким богам с мольбой о силе. Боги долго решали и в конце концов согласились, но поставили условие: каждый раз, когда человек пользуется божественной силой, он старит или молодит себя. Так появился первый контракт с богами — то, что сегодня называют чарёком."], ["", "Один выдающийся клан тоже получил дар богов, но решил, что такая цена слишком высока. Его воины отказались зависеть от чужой силы и начали искать собственную: тренировали тело, оттачивали удары, захваты и шаги, передавали знания от мастера к ученику. Так родились боевые искусства — сила, которую человек создаёт сам."], ["", "Боевые искусства (무투 / 武闘, «Муту») — это системы и традиции боя, отточенные поколениями. Им учатся ради самозащиты, соревнований, физической формы и развития тела, разума и духа."], ["", "Мастер боевых искусств — воин, который сражается собственным телом: ударами, бросками, захватами. В мире «Бога старшей школы» граница размыта: мастерами считаются и фехтовальщики, и бойцы с посохом или копьём, и даже стрелки. Большинство стилей вселенной выросли из реальных единоборств, но довели их до сверхчеловеческого уровня."]];
const CATS={"regular": "Реальные единоборства нашего мира в их привычном виде: бокс, борьба, дзюдо, каратэ, ММА и другие. Им учат в любой секции, они дают крепкую базу, но не скрывают особых секретов. Бонусы небольшие, зато стиль доступен любому бойцу с самого старта.", "advanced": "Традиционные школы, требующие долгого обучения у мастера: кендо, иайдо, айкидо, джит кун до, Система. Часть техник уже выходит за рамки спорта — работа с дыханием, перехват, внутренняя сила. Бонусы выше, у некоторых стилей есть особая способность.", "original": "Личные и родовые стили, созданные конкретными бойцами мира GoH: стиль Кан Дэхёпа, Lance de Combat Андре Оскара, Ссамсу Тхэккён, Македонская сарисса и другие. Они выросли из реальных искусств, но переработаны под своего создателя и полны авторских приёмов. Получить такой стиль можно только у наследника или по сюжету.", "special": "Вершина боевых искусств мира «Бога старшей школы»: Ре-Тхэквондо, Лунный Меч, Игла Набон, Хоахёракгёк и другие великие школы. Эти стили способны тягаться с силой чарёка и даже превосходить её. У них самые сильные техники и особые способности. Доступны только с разрешения ГМа, через наставника или по сюжету."};

const loreHtml=()=>`<details class="lore"><summary>История боевых искусств</summary><div class="lb">${LORE.map(([c,t])=>`<p class="${c}">${esc(t)}</p>`).join("")}</div></details>`;
const catIn=k=>`<b>${RAR[k][0].toUpperCase()} · ${CATRU[k]}</b><span>${esc(CATS[k])}</span>`;
const catHtml=()=>`<div class="cats">${rf==="all"?RORDER.map(k=>`<button type="button" class="cat" data-r="${k}" style="--rc:${RAR[k][1]}">${catIn(k)}</button>`).join(""):`<div class="cat one" style="--rc:${RAR[rf][1]}">${catIn(rf)}</div>`}</div>`;

/* ======= главная ======= */
function renderHome(){
  const list=STYLES.filter(s=>(rf==="all"||s.rarity===rf)&&(tf==="all"||s.types.includes(tf))&&(!q||[s.name,s.orig,s.founder,...s.masters.map(m=>m[0])].join(" ").toLowerCase().includes(q)))
    .sort((a,b)=>RORDER.indexOf(a.rarity)-RORDER.indexOf(b.rarity));
  const nTech=STYLES.reduce((a,s)=>a+s.moves.length,0),nM=new Set(STYLES.flatMap(s=>s.masters.map(m=>m[0]))).size;
  app.innerHTML=`<section class="hero"><div class="txt"><span class="eyebrow">Вики сервера «Царь Горы»</span><h1>ВЫБЕРИ<em>СВОЙ СТИЛЬ</em></h1>
    <p>Энциклопедия боевых искусств мира «Бога старшей школы»: мастера, пассивные баффы стилей, особые способности и техники с бонусами к параметрам.</p>
    <div class="counter"><div><b>${STYLES.length}</b><span>стилей</span></div><div><b>${nTech}</b><span>техник</span></div><div><b>${nM}</b><span>мастеров</span></div></div></div>
    <div class="art">${art(7,"#2EE6FF","FIGHT!")}</div></section>
   ${loreHtml()}
   <div class="bar"><div class="chips"><button type="button" class="chip" data-r="all" aria-pressed="${rf==="all"}">Все редкости</button>${RORDER.map(k=>`<button type="button" class="chip r" style="--rc:${RAR[k][1]}" data-r="${k}" aria-pressed="${rf===k}" title="${RAR[k][2]}">${RAR[k][0]} · ${STYLES.filter(x=>x.rarity===k).length}</button>`).join("")}</div>
    <div class="barrow"><div class="chips">${[["all","Все типы"],...Object.entries(TYPES)].map(([k,n])=>`<button type="button" class="chip" data-t="${k}" aria-pressed="${tf===k}">${n}</button>`).join("")}</div>
    <input class="search" id="q" placeholder="Поиск: стиль, мастер…" value="${esc(q)}" aria-label="Поиск по стилям"></div></div>
   ${catHtml()}
   ${list.length?`<div class="grid">${list.map(s=>`<div class="tw" data-slot="${esc(s.id)}"><button class="tile${s.rarity==="special"?" myth":""}" style="--rc:${rc(s)}" type="button" data-id="${s.id}" aria-label="${esc(s.name)}"><span class="frame"></span><span class="inner">${media(s)}<span class="shade"></span></span>
     <span class="p1">P1</span><span class="rar">${RAR[s.rarity][0]}</span>
     <span class="nm"><b>${esc(s.name)}</b><span>${esc(s.masters.map(m=>m[0]).slice(0,2).join(", ")||s.types.map(t=>TYPES[t]).join(" · "))}</span>${s.draft?'<span><span class="draft">уточняется</span></span>':""}</span></button></div>`).join("")}</div>`
   :`<div class="empty">Ничего не нашлось.</div>`}`;
  app.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{rf=b.dataset.r;renderHome()});
  app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tf=b.dataset.t;renderHome()});
  const qi=document.getElementById("q");qi.oninput=()=>{q=qi.value.trim().toLowerCase();const p=qi.selectionStart;renderHome();const n=document.getElementById("q");n.focus();n.setSelectionRange(p,p)};
  app.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>go(b.dataset.id));
  gmTools();
}

/* ======= страница стиля ======= */
function renderStyle(id){
  const s=STYLES.find(x=>x.id===id);if(!s){renderHome();return}
  const [rn,rcol]=RAR[s.rarity];
  app.innerHTML=`<button class="back" type="button" id="back">← Все стили</button>
  <div class="sp"><div class="side"><div class="poster${s.rarity==="special"?" myth":""}${imgOf(s.id)?" hasimg":""}" style="--rc:${rcol}" data-slot="${esc(s.id)}"><span class="frame"></span><span class="inner">${media(s)}</span><span class="vname">${esc(s.name)}</span></div>
    <div class="card"><h2>Паспорт стиля</h2><dl class="pass"><dt>Редкость</dt><dd style="color:${rcol}">${rn}</dd><dt>Тип</dt><dd>${s.types.map(t=>TYPES[t]).join(", ")}</dd><dt>Основа</dt><dd>${esc(s.base)}</dd><dt>Основатель</dt><dd>${esc(s.founder)}</dd></dl></div>
    <div class="card"><h2>Мастера</h2>${s.masters.length?`<div class="people">${s.masters.map(([n,r])=>`<div class="person"><b>${esc(n)}</b>${esc(r)}</div>`).join("")}</div>`:`<p class="muted">Общедоступный стиль: на сервере его носителей пока нет.</p>`}</div></div>
  <div class="stack"><div class="head"><span class="eyebrow" style="color:${rcol}">${rn} стиль</span><h1>${esc(s.name)}</h1><span class="orig">${esc(s.orig)}</span>
    <div class="badges"><span class="badge" style="color:${rcol}">${rn}</span>${s.types.map(t=>`<span class="badge" style="color:var(--cy)">${TYPES[t]}</span>`).join("")}${s.draft?'<span class="draft">данные уточняются</span>':""}</div></div>
   <div class="card"><h2>О стиле</h2><p>${esc(s.about)}</p></div>
   <div class="card"><h2>Пассивные баффы</h2><p class="muted" style="margin-bottom:10px">Действуют, пока боец сражается этим стилем в бою.</p><div class="mods">${s.passive.map(m=>modChip(m,"p")).join("")||'<span class="muted">Нет</span>'}</div></div>
   ${s.ability?`<div class="card ability"><h2>Особая способность</h2><b class="an">${esc(s.ability[0])}</b><p>${esc(s.ability[1])}</p></div>`:""}
   <div class="card limits"><h2>Ограничения</h2><p>${esc(s.limits)}</p></div>
   <div class="card"><h2>Техники · ${s.moves.length}</h2><p class="note" style="margin-bottom:12px">Бонусы техник действуют только во время её использования.</p>
    ${s.moves.length?`<div class="moves">${s.moves.map((m,i)=>`<div class="move"><div class="mart${imgOf(s.id+"|"+m.name)?" hasimg":""}" data-slot="${esc(s.id+"|"+m.name)}">${imgOf(s.id+"|"+m.name)?`${pic(imgOf(s.id+"|"+m.name))}`:art(hash(s.id+i),rcol,"")}<span class="no">${String(i+1).padStart(2,"0")}</span></div>
      <div class="mb"><div class="mh"><b>${esc(m.name)}</b>${m.type?`<span class="tag">${esc(m.type)}</span>`:""}${m.draft?'<span class="draft">уточняется</span>':""}</div><p>${fmtDesc(m.desc)}</p>
       <div class="pm"><span class="l p">Плюсы</span><span class="r">${(m.plus||[]).map(x=>modChip(x,"p")).join("")}${m.plusNote?`<span>${esc(m.plusNote)}</span>`:""}${!(m.plus||[]).length&&!m.plusNote?"—":""}</span>
       <span class="l m">Минусы</span><span class="r">${(m.minus||[]).map(x=>modChip(x,"m")).join("")}${m.minusNote?`<span>${esc(m.minusNote)}</span>`:""}${!(m.minus||[]).length&&!m.minusNote?"Отсутствуют.":""}</span></div></div></div>`).join("")}</div>`
    :`<p class="muted">Техники уточняются.</p>`}</div>
  </div></div>`;
  document.getElementById("back").onclick=()=>go("");
  gmTools();
}


/* ======= картинки: хранятся в базе сайта, загружает ГМ ======= */
let IMG={},ADMIN=false,DB=null,AS=null,IMGJSON="{}";
const fmtDesc=d=>esc(d).replace(/^(Как делается:|Как бьёт:|Когда применять:)/gm,'<b class="dl">$1</b>');
const pic=u=>`<img class="bg" src="${esc(u)}" alt="" aria-hidden="true"><img class="fg" src="${esc(u)}" alt="" loading="lazy">`;
const imgOf=k=>IMG[k]?(window.BLOB_BASE||"")+IMG[k]:"";
const norm=x=>String(x||"").toLowerCase().replace(/ё/g,"е").replace(/\.[a-z0-9]+$/i,"").replace(/[^a-zа-я0-9]+/g,"");
function toast(m,keep){const t=document.getElementById("gtoast");t.textContent=m;t.hidden=false;clearTimeout(t._t);if(!keep)t._t=setTimeout(()=>t.hidden=true,5000)}
function rerender(){const y=window.scrollY;const a=document.activeElement&&document.activeElement.id;route(CUR);window.scrollTo(0,y);if(a==="q"){const n=document.getElementById("q");if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}}}
async function initImg(){
  try{
    if(!window.claude)return;
    DB=await claude.use("db");if(!DB)return;
    const u=await claude.use("user");ADMIN=u?!!(await u.isOwner()):false;
    if(ADMIN){AS=await claude.use("assets");rerender()}
    DB.doc("config/martial").onSnapshot(sn=>{const d=(sn.exists&&sn.data().img)||{};const j=JSON.stringify(d);if(j!==IMGJSON){IMG=d;IMGJSON=j;rerender()}},()=>{});
  }catch(e){}
}
async function shrink(f){
  if(/gif|svg/.test(f.type)||f.size<350000)return f;
  try{
    const bmp=await createImageBitmap(f);const k=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,"image/webp",.86));return b&&b.size<f.size?b:f;
  }catch(e){return f}
}
async function putImgs(pairs){ /* pairs: [[key,file]] */
  if(!AS){toast("Войди на главном сайте под аккаунтом ГМа.");return}
  let ok=0,fail=[];const next=Object.assign({},IMG),old=[];
  for(const [k,f] of pairs){
    toast(`Загружаю ${ok+fail.length+1} из ${pairs.length}…`,true);
    try{const b=await shrink(f);const r=await AS.upload(b,{type:b.type||f.type});if(next[k])old.push(next[k]);next[k]=r.id;ok++}
    catch(e){fail.push(f.name+(e&&e.code==="too_large"?" (больше 20 МБ)":e&&e.code==="unsupported_type"?" (формат не подходит)":""))}
  }
  if(ok){
    try{await DB.doc("config/martial").set({img:next});IMG=next;IMGJSON=JSON.stringify(next);rerender()}
    catch(e){toast("Картинки загрузились, но не сохранились в базе. Обнови страницу и попробуй ещё раз.");return}
    old.forEach(id=>AS.delete(id).catch(()=>{}));
  }
  toast(`Готово: ${ok} загружено.`+(fail.length?`\nНе вышло: ${fail.join(", ")}`:""));
}
async function delImg(k){
  if(!IMG[k])return;const next=Object.assign({},IMG);const id=next[k];delete next[k];
  try{await DB.doc("config/martial").set({img:next});IMG=next;IMGJSON=JSON.stringify(next);rerender();AS&&AS.delete(id).catch(()=>{});toast("Картинка убрана.")}
  catch(e){toast("Не удалось удалить. Попробуй ещё раз.")}
}
function pickOne(cb){const i=document.getElementById("gfile");i.value="";i.onchange=()=>{if(i.files[0])cb(i.files[0])};i.click()}
function pickMany(cb){const i=document.getElementById("gfiles");i.value="";i.onchange=()=>{if(i.files.length)cb([...i.files])};i.click()}

function gmTools(){
  if(!ADMIN)return;
  const s=CUR&&STYLES.find(x=>x.id===CUR);
  const bar=document.createElement("div");bar.className="gmbar";
  if(s){
    bar.innerHTML=`<b>Режим ГМа · картинки</b><span class="muted">«Пачкой» — выдели сразу много файлов. Файл с названием приёма (например «Хвечхук.png») ляжет в этот приём, файл «обложка.png» или с названием стиля — на обложку. Остальные лягут по порядку в приёмы без картинки. Проще всего — жми ✎ прямо на рамке нужного приёма или обложки: название файла не важно.</span><button class="gbtn" type="button" id="gbulk">Загрузить пачкой</button>`;
    const head=app.querySelector(".stack");head&&head.prepend(bar);
    document.getElementById("gbulk").onclick=()=>pickMany(files=>{
      const pairs=[],used=new Set(),rest=[];
      const byName=new Map(s.moves.map(m=>[norm(m.name),s.id+"|"+m.name]));
      const cover=new Set([norm(s.name),norm(s.id),norm(s.orig),"обложка","cover","стиль"]);
      for(const f of files){const n=norm(f.name);let k=byName.get(n);
        if(!k)for(const [mn,kk] of byName){if(n.length>3&&(mn.startsWith(n)||n.startsWith(mn))){k=kk;break}}
        if(!k&&cover.has(n))k=s.id;
        if(k&&!used.has(k)){used.add(k);pairs.push([k,f])}else rest.push(f)}
      const empty=s.moves.map(m=>s.id+"|"+m.name).filter(k=>!IMG[k]&&!used.has(k));
      if(!IMG[s.id]&&!used.has(s.id))empty.unshift(s.id);
      rest.forEach((f,i)=>{if(empty[i])pairs.push([empty[i],f])});
      const extra=rest.length-Math.min(rest.length,empty.length);
      if(!pairs.length){toast("Некуда класть: у всех приёмов уже есть картинки. Назови файлы как приёмы, чтобы заменить.");return}
      putImgs(pairs).then(()=>{if(extra>0)toast(`Лишних файлов: ${extra} — свободных рамок не осталось.`)});
    });
  }else{
    bar.innerHTML=`<b>Режим ГМа · обложки стилей</b><span class="muted">✎ на плитке — загрузить обложку этому стилю (название файла не важно). «Обложки пачкой» — сразу много файлов, если они названы как стили. Картинки приёмов — на странице стиля.</span><button class="gbtn" type="button" id="gbulk">Обложки пачкой</button>`;
    const g=app.querySelector(".bar");g&&g.before(bar);
    document.getElementById("gbulk").onclick=()=>pickMany(files=>{
      const pairs=[],miss=[];
      for(const f of files){const n=norm(f.name);const st=STYLES.find(x=>[x.name,x.id,x.orig.split("·")[0]].map(norm).includes(n))||STYLES.find(x=>n.length>3&&norm(x.name).startsWith(n));
        st?pairs.push([st.id,f]):miss.push(f.name)}
      if(!pairs.length){toast("Ни один файл не совпал с названием стиля.");return}
      putImgs(pairs).then(()=>{if(miss.length)toast(`Не нашёл стиль для: ${miss.join(", ")}`)});
    });
  }
  app.querySelectorAll("[data-slot]").forEach(el=>{
    const k=el.dataset.slot;const w=document.createElement("span");w.className="slotbtns";
    w.innerHTML=`<button type="button" title="Заменить картинку" aria-label="Заменить картинку">✎</button>${IMG[k]?`<button type="button" class="del" title="Убрать картинку" aria-label="Убрать картинку">✕</button>`:""}`;
    w.children[0].onclick=e=>{e.stopPropagation();pickOne(f=>putImgs([[k,f]]))};
    if(w.children[1])w.children[1].onclick=e=>{e.stopPropagation();if(confirm("Убрать эту картинку?"))delImg(k)};
    el.appendChild(w);
  });
}

function go(id){try{history.replaceState(null,"",id?"#"+id:"#")}catch(e){}route(id);window.scrollTo(0,0)}
let CUR="";
function route(id){CUR=id||"";id?renderStyle(id):renderHome()}
document.getElementById("home").onclick=()=>go("");
document.getElementById("toall").onclick=e=>{e.preventDefault();go("")};
route((location.hash||"").slice(1));
initImg();
</script>
