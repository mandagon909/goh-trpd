 {id:"kyokushin",name:"Кёкусинкай Каратэ",orig:"Full Contact Karate · Kyokushin",rarity:"original",types:["strike"],base:"Полноконтактное каратэ",
  founder:"Ояма Масутацу (реальная основа) · секретные техники — учитель Хан Дэви",masters:[["Хан Дэви","довёл стиль до совершенства"],["Учитель Хан Дэви","создал «Секретное искусство Четырёх Богов-Хранителей»"],["Хуэй Мори","скопировал стиль"]],
  about:"Полноконтактный боевой стиль, доведённый до совершенства Хан Дэви. Сочетает сокрушительные прямые удары, глухую непробиваемую защиту и укрощение кинетической энергии. Стиль закаляет дух и тело, превращая каждую атаку в цепочку непрерывной стихии. Венец стиля — «Танец Четырёх Богов»: связка из четырёх стоек, которую учитель Хан Дэви придумал специально против бойцов Ре-Тхэквондо. Первые три стойки ломают атаку, равновесие и защиту соперника и закручивают вокруг бойца поток воздуха, а четвёртая обрушивает этот поток на цель.",

  moves:[
   M("Разбитие Сотни Кирпичей","Удар ладонью / кулаком","Удар ребром ладони или кулаком в духе тамэсивари — искусства ломать предметы голой рукой. Годы набивки доводят его до автоматизма: боец вкладывает всю массу в одну точку контакта, и такой удар способен расколоть стопку из сотни кирпичей. Бьёт по корпусу или конечностям и пробивает даже жёсткую защиту.",[["str",5]],"При попадании стойкость соперника падает на 2 уровня.",[["spd",-2]],"На время исполнения удара."),
   M("Чоку Дзуки","Прямой удар + рубящий","Двухфазная связка. Сначала прямой удар кулаком по кратчайшей траектории от бедра: он идёт в грудь снизу вверх и приподнимает соперника, ломая ему стойку. Пока тот ещё в воздухе, боец добивает его рубящим ударом ребра ладони сверху вниз и вбивает в землю. Основа всего стиля: от постановки этого удара зависит сила всех последующих техник.",[["str",2]],"На следующий удар при точном попадании.",[],"Отсутствуют."),

   M("Базальтовый кулак","Прямой удар рукой","Фирменный удар Хан Дэви. Боец твёрдо врастает ногами в землю, разворачивает бёдра и выбрасывает прямой кулак, в который вложено всё тело — как застывшая лава, твёрдая и тяжёлая. Удар настолько плотный, что им можно встречать чужие техники в лоб и ломать их: так Дэви гасил даже многократные выпады рапиры. Отсюда растут все «базальтовые» вариации.",[["str",6]],"Может встретить и сбить атаку соперника, если тот бьёт в тот же момент.",[["spd",-1]],"Нужна устойчивая стойка: в прыжке или на скользкой опоре не работает."),
   M("Тройной Базальтовый кулак","Серия прямых ударов","Три Базальтовых кулака подряд без паузы, каждый подхватывает инерцию предыдущего. Задуман как ответ на многоударные связки: Хан Дэви встретил так «Третью стойку Хвечхука» — на каждый из трёх ударов ногой пришёлся свой кулак.",[["str",6],["spd",2]],"Отменяет до трёх ударов соперника в одной связке.",[["end",-2]],"Сильно выматывает руки."),
   M("Базальтовый апперкот","Апперкот","Вариация Базальтового кулака снизу вверх. Боец ныряет под атаку, взрывается ногами и бьёт кулаком по восходящей дуге. Силы хватает, чтобы подбросить в воздух сразу несколько противников, стоящих рядом.",[["str",6]],"Подбрасывает противника (и стоящих вплотную) в воздух.",[["dur",-1]],"В момент нырка корпус открыт."),
   M("Бразильский удар","Удар ногой сверху вниз","Удар ногой, который взлетает как обычный высокий хай-кик, а в последний миг ломается в колене и обрушивается сверху вниз, вбивая противника в пол. Главная хитрость — траектория: боец может выбрать любую из трёх целей (голова, корпус, ноги) прямо во время удара, поэтому защититься от него крайне сложно.",[["str",4],["tech",2]],"Соперник получает Восприятие −2 против этого удара.",[["dur",-1]],"Пока нога в воздухе, опора одна."),
   M("Хай-кик","Удар ногой","Классический мощный удар ногой выше уровня груди. Сильнее Бразильского удара, но его траектория прямая и легко читается, поэтому всё решает тайминг: бить нужно в момент, когда соперник уже раскрылся.",[["str",4]],"",[["per",-1]],"Если соперник ждал удара, промах открывает бойца."),
   M("Срезание бычьего рога","Рубящий удар ладонью","Открытая ладонь рубит по диагонали в голову или шею, как клинок. Название говорит само за себя: так, по легенде, можно срезать рог быку. Хорош, когда соперник закрылся прямыми блоками: диагональ проходит между ними.",[["str",4],["tech",1]],"",[],"Отсутствуют."),
   M("Смертельный удар","Добивающий удар","Удар на один нокаут. Боец замирает, собирает силу во всём теле и выпускает её одним кулаком. Ни капли энергии не теряется, не работает ни одна лишняя мышца — именно это делает удар таким страшным и таким трудным в исполнении.",[["str",9]],"Если попадает в незащищённого соперника — считается нокаутирующим (по решению ГМа).",[["spd",-3],["per",-2]],"На время концентрации боец уязвим."),
   M("Кулак Чёрной Черепахи","1-я стойка · прерывание","Первая стойка «Секретного искусства Четырёх Богов-Хранителей». Мощный прямой удар, брошенный навстречу начатой атаке соперника, — он не даёт атаке сложиться и рвёт ритм. Удар порождает ударную волну, которая отбрасывает и тех, кто стоит вокруг. Запускает поток воздуха для следующих стоек.",[["str",4],["dur",2]],"Прерывает технику соперника, если боец успел ударить первым.",[],"Отсутствуют."),
   M("Удар Феникса","2-я стойка · ударная волна","Вторая стойка. Боец с силой топает в землю, и ударная волна уходит по полу прямо под ноги противнику, выбивая равновесие. Варианты: топнуть прямо по ноге соперника (волна всё равно идёт от земли) или так ударить по полу, что плиты встают дыбом — так делал Хуэй Мори.",[["str",3],["tech",2]],"Скорость соперника −2 на следующий ход: он теряет равновесие.",[["spd",-1]],"Нужна твёрдая поверхность под ногами."),
   M("Танец Белого Тигра","3-я стойка · серия","Третья стойка. Шквал ударов руками и ногами, который пробивает защиту под разными углами. Используется и против толпы — Хан Дэви так разметал клонов Чегаль Тхэка. Вместе с Инерцией каждый следующий удар серии тяжелее предыдущего.",[["str",4],["spd",3]],"Работает против нескольких противников одновременно.",[["end",-2]],""),
   M("Буря Синего Дракона","4-я стойка · финал","Четвёртая и последняя стойка. Первые три стойки закручивают вокруг тела бойца поток воздуха; здесь боец берёт этот поток под контроль и бьёт им в соперника как сжатым тараном. Удар режет тело ветром: Джин Мори после него истекал кровью по всему телу, а сама волна разрушила половину арены.",[["str",10],["tech",3]],"Режущий урон по площади. Если до этого были 1–3 стойки — ещё +3 к Силе.",[["end",-4],["spd",-2]],"Без трёх предыдущих стоек сила вдвое ниже (по решению ГМа)."),
   M("Танец Четырёх Богов: Предел — Основа","Истинная форма","«Истинная» форма Танца. Вместо того чтобы выпустить ветер наружу, боец втягивает всю энергию трёх стоек и вихрь вокруг себя внутрь, сжимает их у тела и выпускает одним-единственным ударом кулака. Получивший такой удар описывал его силу как удар целой горы. Удар можно и не доводить до полной силы, если нужно сдержаться.",[["str",14],["tech",4]],"",[["end",-6],["spd",-3]],"Требует выполнить три стойки перед этим. После удара — откат на ход."),
   M("Обратный Синий Дракон","Контратака","Защитный разворот Синего Дракона: боец перехватывает поток воздуха, который летит в него, и разворачивает его обратно. Требует чувствовать воздух так же хорошо, как своё тело.",[["tech",3],["dur",2]],"Возвращает часть урона от ветровой атаки соперника.",[["spd",-1]],""),
   M("Обратный Хвечхук Знака Дракона: Древний Синий Дракон","Контратака на удар ногой","Ответ на «Хвечхук Знака Дракона» из Ре-Тхэквондо. Боец касается ноги, которой бьёт противник, и в момент касания забирает себе ветер, который рождает этот удар. Затем перенаправляет его в собственную «Бурю Синего Дракона» — соперник получает свою же силу назад.",[["tech",5],["str",4]],"Работает только против вихревых ударов ногами.",[["dur",-2]],"Ошибка тайминга — удар приходит в полную силу."),
   M("Двойной удар (с Хэтхэ)","Чарёк + стойка","Удар Феникса, в ударную волну которого вливается водяная сила чарёка Хэтхэ. По земле идёт не просто толчок, а волна воды, сбивающая с ног.",[["str",4],["ctrl",3]],"",[["gp",-2]],"Только при контракте с водяным чарёком."),
   M("Водяная стрела (с Хэтхэ)","Чарёк + серия","Вариант Танца Белого Тигра: боец ставит водяную стену чарёка Хэтхэ и бьёт по ней руками и ногами, выбивая из неё десятки водяных снарядов, которые накрывают противника.",[["spd",3],["ctrl",3]],"Атака на дистанции.",[["gp",-2]],"Только при контракте с водяным чарёком."),
   M("Буря Водяного Дракона (с Хэтхэ)","Чарёк + финал","Водяная версия Бури Синего Дракона. Базальтовый кулак, Двойной удар и Водяная стрела закручивают поток ветра, боец наполняет его водой чарёка и выпускает в виде водяного дракона. В отличие от оригинала не режет, а давит огромной массой воды.",[["str",10],["ctrl",4]],"",[["gp",-4],["end",-3]],"Только при контракте с водяным чарёком.")]},

 {id:"re-tkd",name:"Ре-Тхэквондо",orig:"Renewal Taekwondo",rarity:"special",types:["strike"],base:"Тхэквондо",
  founder:"Джин Тхэджин",masters:[["Джин Мори","главный носитель"],["Джин Тхэджин","основатель"],["Хуэй Мори","клон Джин Мори"],["Дан Мори","использовал стиль одной рукой"]],
  about:"Современное корейское боевое искусство, выросшее из мощных линейных ударов ногами ITF-тхэквондо. Джин Тхэджин создал его как ответ Северному ITF-тхэквондо: добавил удары руками, сваливания и навыки скрытного боя, чтобы бить в слабые места этой школы. Основа стиля — Хвечхук (удар с разворота) и десятки его вариаций, а вершина — «безоткатные» техники, в которых сила удара целиком уходит в цель и не возвращается в тело бойца.",
  passive:[["spd",2],["tech",2]],
  ability:["Безоткатность","Когда боец выполняет технику с идеально собранной энергией, отдача от удара не возвращается в тело — вся сила уходит в цель. Безоткатная версия любой техники стиля бьёт многократно сильнее и пробивает даже сверхпрочную броню."],
  limits:"«Безоткатность» требует безупречной базы: доступна только при Технике БИ ранга A и выше.",
  moves:[
   M("Хвечхук","Удар ногой с разворота","Базовый удар стиля и корень почти всех его техник. Боец разворачивается на опорной ноге и бьёт пяткой по горизонтальной дуге, вкладывая в удар всю скорость вращения тела. Цель — голова. Из Хвечхука растут фронтальный, нижний, тройной и драконий варианты.",[["str",3],["spd",2]],"",[],"Отсутствуют."),
   M("Фронтальный Хвечхук","Удар ногой","Хвечхук без полного разворота: нога выходит прямо перед собой и с хлёстом заходит в голову сбоку. Быстрее обычного, но слабее, поэтому хорош как стартер или добивание в связке.",[["spd",3]],"",[],"Отсутствуют."),
   M("Нижайший Хвечхук","Подсечка","Хвечхук у самого пола: боец приседает и разворотом на 180° сносит ноги противника пяткой. Валит даже тех, кто стоит в глухой стойке.",[["tech",2],["spd",2]],"Сбивает соперника с ног при попадании.",[["dur",-1]],"Боец в низкой позиции."),
   M("Третья стойка Хвечхука","Серия из трёх ударов","Три удара ногой подряд: первый с одной стороны, второй сразу с противоположной, третий — сзади, из-за спины. Первые два целят в голову и сотрясают мозг, третий добивает. Если соперник дёргается и отступает назад, урон только растёт. Безоткатная версия — одна из сильнейших техник Джин Мори.",[["str",5],["spd",4]],"Безоткатная версия (Техника БИ A+): ещё +5 к Силе.",[["per",-2]],"Во время вращения боец теряет соперника из виду."),
   M("Хвечхук Знака Дракона (Джин Хвечхук)","Вихревой удар","Хвечхук, вращение которого настолько быстрое и правильное, что вокруг ноги рождается вихрь — «дракон» ветра. Удар бьёт не только ногой, но и воздухом вокруг неё, сбивая всё на пути. Им пользуются и в Ссамсу Тхэккёне.",[["str",7],["spd",3]],"Ветер задевает и стоящих рядом.",[["end",-2]],""),
   M("Удар Синего Дракона","Вихревой удар","Развитие Знака Дракона: боец не просто создаёт вихрь, а ведёт его, направляя ветряного дракона в нужную сторону даже после удара.",[["str",7],["tech",3]],"Атака на средней дистанции, можно менять траекторию.",[["end",-3]],""),
   M("Джин Хвечхук Ноль","Безоткатный вихрь","Предельная версия Джин Хвечхука, где удар ноги и вихрь сливаются в одну безоткатную волну. Ничего лишнего: весь импульс уходит в цель.",[["str",12],["spd",4]],"",[["end",-5]],"Только при Технике БИ A+."),
   M("Аран","Удар локтем","Короткий удар локтем на ближней дистанции, от которого расходится ударная волна. Нужен, когда соперник влез вплотную и ногами не размахнуться.",[["str",4]],"Волна отталкивает соперника, разрывая клинч.",[],"Отсутствуют."),
   M("Клыки","Двойной удар локтями","Оба локтя одновременно обрушиваются сверху вниз — как челюсти, — на плечи, ключицы или голову противника. Обычно бьют, когда соперник согнулся или пытается пройти в ноги.",[["str",5]],"",[["dur",-1]],"Корпус открыт снизу."),
   M("Ловец Дракона","Бросок","Боец прыгает с вращением, обхватывает соперника за шею и на выходе из вращения роняет его головой вниз в землю. Кульминация связки после подбрасывающих ударов.",[["str",5],["tech",3]],"",[["dur",-2]],"Если соперник вырвался — боец падает сам."),
   M("Пэкту","Удар коленом","Удар коленом в голову. Версия Ре-Тхэквондо подбрасывает соперника вверх, открывая его для воздушной связки. Есть безоткатный вариант. (Северная школа делает его иначе — см. Северное ITF.)",[["str",4]],"Подбрасывает соперника для комбо.",[],"Отсутствуют."),
   M("Бо-Бып","Передвижение","Особая техника шагов, при которой боец перемещается так резко, что со стороны это похоже на телепортацию. Используется, чтобы мгновенно зайти сбоку или со спины.",[["spd",5]],"Следующая атака заходит с неожиданной стороны: соперник −2 Восприятия против неё.",[["end",-1]],""),
   M("Топор","Удар ногой сверху","Прыжок, нога поднимается над головой и рубит вниз, после чего боец уходит в сальто вперёд. Воздушная волна от удара отрывает противников от земли.",[["str",5]],"Подбрасывает соперников вокруг точки удара.",[["dur",-1]],"После сальто нужно время, чтобы встать в стойку."),
   M("Пэк Рок","Удар ногой вверх","Вертикальный удар ногой на 180°: стопа идёт снизу прямо в челюсть, как ножницы, раскрывающиеся вверх.",[["str",4],["spd",1]],"",[],"Отсутствуют."),
   M("Давление воздуха","Ударная волна","Резкий хлопок ладонями или удар по воздуху, рождающий волну давления, которая летит в соперника. Слабая, но дальнобойная: сбивает дыхание и ритм.",[["spd",2],["per",1]],"Атака на дистанции.",[],"Отсутствуют."),
   M("Ледяной удар","Контр-удар ногой","Оригинальная техника Джин Мори. Когда удары ногами сталкиваются, рождается турбулентность; боец ловит её своим ударом, поглощает и гасит, выводя чужую силу в ноль. Так Мори погасил огненный «Инферно Нирвана» Ссамсу.",[["tech",5],["dur",3]],"Гасит вихревую или огненную атаку ногой.",[["spd",-1]],""),
   M("Захват серпом","Подсечка-захват","Нога работает как серп: боец заводит её за ногу или шею противника и дёргает на себя, ломая равновесие. Часто открывает «Волчок».",[["tech",3]],"Соперник теряет равновесие: −1 Скорость на ход.",[],"Отсутствуют."),
   M("Волчок","Двойной удар с разворота","Продолжение Захвата серпом: пока соперник падает, боец закручивается и бьёт двумя ударами с разворота подряд.",[["str",4],["spd",2]],"",[["per",-1]],""),
   M("Земляная борозда","Низкий удар","Боец раскручивается, вдавливая носок в землю, и ведёт удар по коленям противника. Борозда рвёт землю и бросает в соперника обломки, а вращение у самой земли гасит встречный ветер.",[["str",3],["tech",3]],"Гасит ветровую атаку низом.",[["dur",-1]],""),
   M("Гор Ё","Двойной удар ногой","Два быстрых горизонтальных удара одной ногой в голову, без опускания ноги на пол.",[["spd",4]],"",[],"Отсутствуют."),
   M("Прямой удар ногой","Удар ногой","Прямой толчок стопой в корпус. Держит соперника на дистанции и сбивает его наступление.",[["str",2],["spd",1]],"",[],"Отсутствуют."),
   M("Чонгвон","Прямой удар рукой","Удар кулаком в стиле тхэквондо — быстрый, в лоб, чаще всего сериями. Руки в Ре-Тхэквондо добавил сам Джин Тхэджин.",[["spd",3]],"",[],"Отсутствуют."),
   M("Халла","Удар ногой вверх","Резкий удар ногой снизу вверх по центральной линии — под подбородок. Сносит голову назад и открывает корпус.",[["str",3],["spd",2]],"",[],"Отсутствуют."),
   M("Сокса","Удар коленом","Колено в голову из клинча или навстречу нырку соперника.",[["str",4]],"",[],"Отсутствуют."),
   M("Тхэбэк","Боковой удар ногой","Мощный боковой удар ребром стопы в корпус: таранит и отбрасывает.",[["str",4]],"Отбрасывает соперника.",[],"Отсутствуют."),
   M("Силла","Удар ногой вниз","Нисходящий удар ногой по голове или плечам — добивание соперника, который пригнулся.",[["str",4]],"",[],"Отсутствуют."),
   M("Ножницы","Прыжковый удар","Прыжок и диагональный удар ногой в воздухе, бьющий как лезвие ножниц.",[["str",3],["spd",2]],"",[["dur",-1]],"В воздухе нет опоры."),
   M("Нигава","Удар с сальто","Боец делает сальто назад, по пути бьёт ногой, а приземляясь — топчет упавшего соперника.",[["str",4],["spd",2]],"",[["end",-1]],""),
   M("Восходящий удар назад","Удар ногой","Удар пяткой назад и вверх по противнику, который зашёл со спины или прыгнул.",[["str",3],["per",1]],"",[],"Отсутствуют."),
   M("Обратный размашистый удар","Удар ногой","Разворот спиной к сопернику и удар пяткой по широкой дуге — «задняя вертушка».",[["str",4]],"",[["per",-1]],"Секунду боец не видит соперника."),
   M("Раундхаус","Круговой удар","Классический круговой удар ногой подъёмом стопы.",[["str",3],["spd",1]],"",[],"Отсутствуют."),
   M("Мах-панч","Удар рукой","Удар кулаком на скорости, при которой воздух перед ним сжимается в ударную волну.",[["spd",5]],"",[["end",-1]],""),
   M("Винтовой удар","Удар рукой","Прямой кулак со скручиванием предплечья в последний момент: удар ввинчивается в защиту, как сверло.",[["str",3],["tech",2]],"Игнорирует 1 уровень Стойкости соперника.",[],"Отсутствуют."),

   M("Ориджинал Джин Мори: Ось (Чичхук)","Удар + посох","Посох Жуи вбивается в землю как якорь, боец крутится вокруг него и бьёт с силой, оставляющей в земле ущелье.",[["str",14]],"",[["end",-5],["spd",-2]],"Нужен посох или прочный шест."),

 {id:"moonsword",name:"Стиль Лунного Меча",orig:"Moon Light Sword Style",rarity:"special",types:["weapon","strike"],base:"Неизвестно",
  founder:"Неизвестен (25 мастеров меча носили титул)",masters:[["Ю Мира","нынешний мастер меча"],["Отец Ю Миры","прошлый мастер меча"],["Жрец Рю","мастер стиля"],["Судья P","копировал стиль на финале турнира"]],

   M("13-й танец: Вихрь","Меч · контратака","Боец разворачивается всем телом в сторону летящей атаки: клинок одновременно принимает удар и, продолжая разворот, режет в открывшуюся брешь. Защита и атака в одном движении.",[["dur",2],["str",2]],"Контратака: срабатывает в ответ на удар соперника.",[["spd",-1]],""),
   M("14-й танец: Бумеранг","Меч · бросок","Меч бросается по дуге, вращаясь как бумеранг; он пролетает огромное расстояние на высокой скорости, режет цель и возвращается к хозяину.",[["spd",3]],"Атака на дистанции.",[],"Пока меч в полёте, боец безоружен."),
   M("17-й танец","Меч · воздушный","Танец для боя в воздухе: выполняется в прыжке или падении. Полностью его ни разу не показали, поэтому детали остаются на усмотрение ГМа.",[["spd",3],["tech",2]],"",[["dur",-1]],"Только в воздухе."),
   M("28-й танец: Рассечение","Меч · горизонтальный удар","Горизонтальный разрез такой чистоты, что режет стекло и металл, даже если в руке простая деревянная палка — режет не материал, а техника.",[["str",5]],"Работает с любым длинным предметом.",[["spd",-2]],"На время замаха."),
   M("35-й танец: Марионетки","Меч · выхватывание","Молниеносное выхватывание клинка: одно движение поражает минимум трёх противников сразу, каждого в нескольких точках тела.",[["spd",5],["tech",2]],"Атакует до трёх целей.",[["end",-2]],"Сильно выматывает."),
   M("Опадающие листья","Меч · серия","Три быстрых удара, ложащихся как падающие листья: голова, живот и подколенная впадина. Верх, середина и низ — закрыться от всех трёх разом почти невозможно.",[["spd",3],["tech",1]],"",[],"Отсутствуют."),
   M("Буйство Полной Луны","Меч · шквал","Шквал скоростных ударов с разных углов, наносящий огромный урон. Каждый удар заходит с новой стороны, соперник не успевает перестроить защиту.",[["str",4],["spd",4]],"",[["end",-3]],"После серии боец вымотан."),
   M("Лунное гало","Меч · нисходящий удар","Нисходящий удар, который прорезал даже бронекостюм Короля Обезьян. Клинок идёт по дуге-нимбу, и вся сила собирается в конце траектории.",[["str",6],["tech",2]],"Игнорирует 2 уровня Стойкости брони.",[["spd",-1]],""),
   M("Небесный Разрез","Меч · вертикальный удар","Удар с гигантским вертикальным радиусом: разрезает облака и раскалывает гору надвое. Корейское название — «Миринэ-гарыги», «рассечение Млечного Пути».",[["str",14],["tech",4]],"Огромная дальность по вертикали.",[["end",-6],["spd",-2]],"Долгий замах."),
   M("Раскол Галактики","Меч · рубящий","Мощный удар сверху вниз, раскалывающий саму землю под противником.",[["str",8]],"",[["spd",-2]],""),
   M("Раскол Горы","Меч · рубящий с шагом","Клинок поднимается высоко над головой и обрушивается вниз вместе с шагом вперёд — с силой гигантской волны.",[["str",7]],"",[["spd",-2]],""),
   M("Ледяной шторм","Меч · шквал","Шквал разрезов в разных направлениях из разных положений тела. Им Рю за мгновение разрезал двух Жрецов на куски.",[["str",6],["spd",5]],"Атакует несколько целей рядом.",[["end",-4]],""),
   M("Тонкое скольжение","Меч · диагональный","Скользящий диагональный разрез сверху вниз — короткий, точный, без лишнего движения.",[["spd",3]],"",[],"Отсутствуют."),
   M("Нулевой месяц","Меч · особый","Особая техника стиля вне счёта танцев. Подробности в манхве почти не раскрыты — применение и силу уточняет ГМ.",[["str",6],["tech",3]],"",[["end",-3]],""),
   M("Разрез морского тумана","Меч · скрытный","Удар, скрытый как туман над морем: клинок появляется из «ниоткуда». Детали уточняет ГМ.",[["spd",4],["tech",2]],"Соперник −1 Восприятия против удара.",[],"Отсутствуют."),
   M("Дуговой лунный разрез (Судья P)","Меч · двуручный","Х-образный разрез двумя клинками одновременно. Так P, управляя марионеткой Ю Миры, «вводила» стиль как комбинацию кнопок.",[["str",5],["spd",2]],"",[["end",-2]],"Нужны два клинка."),

   M("Лунный свет × Пумба: Кубическая нарезка","Меч · совместная","Совместная техника двух стилей: двумя клинками Ю Мира режет препятствие на аккуратные кубы. Требует знания Пумбы стиля Халлян.",[["str",6],["tech",4]],"",[["end",-3]],"Нужны два клинка и знание Пумбы."),
   M("1-й танец: Кран","Безмечный · захват","Боец хватает голову противника и резко скручивает её, нанося тяжёлую травму шее. Ю Мира пользуется им в ярости и без оружия, иногда по несколько раз подряд.",[["str",4]],"",[["dur",-2]],"Требует подойти вплотную."),
   M("Режущая ладонь","Безмечный","Ладонь складывается как клинок, и ребро режет плоть почти как настоящий меч.",[["str",3]],"",[],"Отсутствуют."),
   M("Пронзающий импульс","Безмечный · ки","Ладонь выпускает волну энергии — ударную волну, которая отбрасывает противника далеко и подбрасывает его в воздух.",[["str",3]],"Отбрасывание.",[["gp",-1]],""),
   M("Взрыв Божественного Пальца","Безмечный · снаряд","Мелкие предметы — камешки, монеты — щелчком пальца выстреливаются как пули и пробивают дерево.",[["spd",3],["per",2]],"Атака на дистанции.",[],"Отсутствуют.")]},

 {id:"nabong",name:"Игла Набон",orig:"Nabong Needle Ryu",rarity:"special",types:["medic","strike"],base:"Акупунктура",
  founder:"Вероятно, На Бончим",masters:[["На Бончим","«Божественный доктор», член Шестёрки"],["Джин Мори","освоил открытие точек"],["Ли Хянтан","ученица"],["Хуэй Мори","копия стиля"],["Нефритовый Император","владеет"],["666: Сатана","владеет"]],
  about:"Боевое искусство на основе акупунктуры: быстрые и мощные удары пальцами работают как иглы по точкам давления и жизненным точкам. Удар может ослабить противника, вернуть чувствительность онемевшей конечности, остановить кровь союзнику или сорвать ограничители собственного тела. Самый опасный стиль в руках того, кто знает анатомию.",
  passive:[["tech",2],["per",2]],
  ability:["Карта точек","Боец видит точки давления противника: при точном попадании по нужной точке может временно снизить один параметр соперника на 1 уровень."],
  limits:"Техники снятия ограничителей опасны для жизни: «Без боли» вместе со «Снятием ограничителей» может убить человека.",
  moves:[
   M("Иглоукалывание","Точки","Базовое умение: удар пальцем по выбранной точке. В зависимости от точки он режет боевую силу противника или, наоборот, возвращает чувствительность онемевшей конечности — так Джин Мори вылечил руку Ю Миры. Промах по нужной точке может ударить по самому бойцу: Мори однажды «выключил» себя и проиграл слабому участнику.",[["tech",2]],"Снижает параметр соперника на 1 уровень или лечит онемение союзника.",[],"При провале броска ГМ может обратить эффект на бойца."),
   M("Запечатывающая кровь игла","Точки","Удар по меридиану запирает кровь в участке тела: она скапливается, давит изнутри и рвёт сосуды. Снаружи — едва заметный тычок, внутри — серьёзное повреждение.",[],"Выносливость соперника −2 до конца боя.",[["spd",-1]],""),
   M("Блок артерий","Точки","Серия тычков, перекрывающих артерии: кровь перестаёт поступать в конечность, и противник не может ею пользоваться.",[],"Скорость и Сила соперника −2 на 2 поста (или блок одной конечности).",[],"Отсутствуют."),
   M("Нейтрализация акупунктуры","Точки · защита","Снятие чужого точечного воздействия — например, Блока артерий. Можно выполнить не только пальцем, но и ногой, как показал Хуэй Мори.",[["tech",2]],"Снимает один эффект точечного удара.",[],"Отсутствуют."),
   M("Без боли","Самоусиление","Удар по точке у сердца выключает ограничители, связанные с болью. Боец перестаёт чувствовать боль на пару часов и может сражаться на пределе: Джин Мори так разгонялся до невидимой скорости и проламывал Щит Эгиды.",[["str",6],["spd",6]],"",[["dur",-3]],"Когда эффект закончится — сильный откат и вся накопленная боль разом."),
   M("Снятие ограничителей","Самоусиление","Удар по точке в мозге снимает ограничители всего тела. Для правильного применения нужна Пилюля Мудреца.",[["all",9]],"",[["end",-6]],"Без Пилюли Мудреца — смертельно опасно. Вместе с «Без боли» может убить человека."),
   M("Пентаграмма","Точки · печать","На Бончим «рисует» пальцем-иглой в воздухе пятиугольник, и эта фигура работает как печать. Силы хватило, чтобы погасить способность чарёка Пак Мубона, тоже члена Шестёрки.",[["tech",5],["ctrl",4]],"Может погасить одну способность чарёка соперника.",[["gp",-3]],""),
   M("Ыйён Бончим","Лечение","Лечебная техника: боец последовательно бьёт по десятку меридианных точек на теле, останавливая кровотечение и залечивая часть ран.",[],"Восстанавливает союзнику или себе 1 уровень Стойкости (раз за бой).",[["spd",-2]],"Требует времени вне боя."),
   M("Лечение Дим Мак","Лечение · боевое","Быстрая версия лечения прямо во время боя. Работает намного быстрее, но слабее, и пациенту после неё нельзя сильно двигаться — об этом предупреждал Хуэй Мори.",[],"Снимает 1 штраф от ранения.",[["end",-1]],"Пациент не должен перенапрягаться."),
   M("Мгновенная смерть","Точки · смертельный","Тычок прямо в сердце, который должен убить мгновенно.",[["tech",6]],"Против неподготовленного соперника — смертельный удар (только с разрешения ГМа).",[["spd",-2]],"Нужен точный удар в незакрытую грудь."),
   M("Временная анабиоза","Точки","Удар в «ямку» под рёбрами — слабое место, которое на время погружает противника в состояние мнимой смерти.",[["tech",4]],"Соперник пропускает ход.",[],"Отсутствуют.")]},

 {id:"ssamsu",name:"Ссамсу Тхэккён",orig:"Ssam-Su Taekkyeon",rarity:"original",types:["strike"],base:"Тхэккён + Ре-Тхэквондо",

   M("Боевой пульс","Ладонь · ки","Ладонь ставится на цель и выпускает импульс энергии; на месте удара на мгновение остаётся отпечаток руки, а соперника отбрасывает. Близок к Импульсу ки Практического Тхэккёна, но бьёт скорее наружу, чем внутрь.",[["str",3]],"Отбрасывание.",[["gp",-1]],""),
   M("Просветление","Чтение","Касаясь соперника (обычно запястья), боец читает его мышцы и предсказывает следующее движение до того, как оно начнётся. Не спасает от двух атак, начатых одновременно.",[["per",5]],"Можно заранее заявить уклонение от следующей атаки соперника.",[],"Не работает против одновременных атак."),

   M("Рыболовный крюк","Захват ноги","Боец ловит атакующую ногу, подпрыгивает и обвивает её своими ногами, заканчивая рычагом на ногу.",[["tech",4]],"Соперник −2 Скорости до конца боя при полном рычаге.",[["dur",-1]],""),
   M("Удар Неба и Земли","Удар ногой сверху","Рубящий удар ногой сверху вниз, родственный «Удару Чудовищного Змея» Практического Тхэккёна.",[["str",5]],"",[["dur",-1]],""),
   M("Удар подъёмом вверх","Удар ногой","Удар подъёмом стопы, которым Пак Ильпхё встретил «Халлу» Ре-Тхэквондо. Похож на Бразильский удар каратэ.",[["str",3],["tech",1]],"Контратака на удар ногой снизу.",[],"Отсутствуют."),
   M("Внутренняя подсечка","Подсечка","Удар по подколенной впадине сзади, ломающий равновесие. Обычно входит в связку «Нирвана».",[["tech",2]],"Соперник теряет равновесие.",[],"Отсутствуют."),
   M("Удар коленом","Удар коленом","Колено в лицо с опорой на захват руки — подготовка к Нирване.",[["str",3]],"",[],"Отсутствуют."),
   M("Замок на ногу","Рычаг","Несмотря на название — рычаг на руку обеими руками. Нужен как опора для колена или Нирваны; Пак Ильпхё так вывихнул запястье Гвум Ги.",[["tech",3]],"Сила соперника −1 при вывихе.",[],"Отсутствуют."),

   M("Толчок ногой","Прямой удар ногой","Прямой толчок стопой, которым Ильпхё сбил «Ножницы» Ре-Тхэквондо в прыжке.",[["str",2],["spd",2]],"",[],"Отсутствуют."),
   M("Удар задней лошади","Удар назад","Удар ногой назад, как лягает лошадь. Им Ильпхё встретил «Земляную борозду».",[["str",4]],"",[],"Отсутствуют."),
   M("Раундхаус и коса","Ложный удар + бросок","Ложный круговой удар, который в последний момент захватывает шею соперника подколенным сгибом. Боец использует инерцию, переворачивает противника и прижимает к земле одной ногой, чтобы добить кулаком.",[["tech",4],["str",2]],"Соперник прижат к земле.",[],"Отсутствуют."),

   M("Истинное обнуляющее вращение","Вихрь","Боец вбивает стопу в землю и проводит силу вверх — колено, таз, поясница — до кончика другой стопы, выполняющей Ёкчхук. Вокруг тела закручивается ветер, собирается вокруг ноги и при контакте превращается в гигантский смерч.",[["str",10],["tech",3]],"",[["end",-4]],""),

   M("3-я ступень: Огненная Нирвана","Огонь · ультима","Финальная ступень. Огонь собирается в ноге, она поднимается вверх, и пламя превращается в гигантский огненный клинок, который обрушивается на соперника. Полной силы не видели: Джин Мори погасил его Ледяным ударом.",[["str",12]],"Огненный урон по площади.",[["end",-5]],"Требует 1-й и 2-й ступени."),
   M("Девятый хвост + Огненная Нирвана: Тройной разрушительный адский клык","Огонь + чарёк","Огненная Нирвана, усиленная всеми девятью хвостами чарёка-кумихо. Удар вверх поднимает гигантскую волну огня, удар вниз обрушивает её на врага. Этой техникой Пак Ильпхё победил Третьего наследного принца.",[["str",18],["ctrl",4]],"",[["gp",-6],["end",-6]],"Только с огненным чарёком и девятью хвостами.")]},
 {id:"practical-tk",name:"Практический Тхэккён",orig:"Practical Taekkyeon",rarity:"special",types:["strike"],base:"Тхэккён",

  passive:[["spd",1],["tech",1]],
  ability:null,limits:"Отсутствуют.",
  moves:[

   M("Подсечка с захватом руки","Бросок + локоть","Правая рука заходит под левую ногу соперника, правая нога цепляет его правую ногу, а левая нога закидывается на правое плечо. Боец прыгает вперёд, отрывает противника от земли, переворачивается всем телом и, используя инерцию и вес, обрушивает локоть.",[["tech",3],["str",2]],"",[["spd",-1]],"Если соперник устоял — боец на земле."),
   M("Удар Чудовищного Змея","Удар ногой сверху","Рубящий удар ногой сверху вниз. Когда Сынъа применила его против Джин Мори, он проломил центр ринга.",[["str",5]],"",[["dur",-1]],""),
   M("Лоу-кик","Удар ногой","Удар по бедру или голени: ломает равновесие, а при сильном попадании — и саму ногу.",[["str",2]],"При попадании Скорость соперника −1.",[],"Отсутствуют.")]},

 {id:"monkey",name:"Хоахёракгёк",orig:"Whoahyorakgeyok · Небесное искусство, 48-я форма",rarity:"special",types:["strike","mixed"],base:"Кунг-фу обезьяны",

   M("Удар Хоа","Удар рукой","Быстрый звериный удар рукой с непредсказуемой траектории. Открывает связку «Удар — Скольжение — Пинок».",[["str",4],["spd",1]],"",[],"Отсутствуют."),

   M("Затухающий удар","Подсечка","Как «флэр» в брейк-дансе: боец бросается на соперника, в последний момент ныряет вниз, встаёт на руки и, раскручивая ноги, сносит противника с ног.",[["spd",4],["tech",2]],"Сбивает с ног.",[],"Отсутствуют."),
   M("Серое вознесение","Подброс","Перекат назад на руки и мощный толчок ими вверх-вперёд; на выходе — удар ногой, подбрасывающий противника в воздух.",[["str",5],["spd",3]],"Подбрасывает соперника.",[],"Отсутствуют."),

   M("Молот Серого Дракона","Удар ногой-сверло","Летящий боковой удар ногой сверху вниз, во время которого боец вращается как сверло. Сила так велика, что противник продолжает лететь, вспахивая землю и оставляя за собой полосу разрушений.",[["str",10],["spd",4]],"",[["end",-3]],""),
   M("Высшее тайное искусство: Обезьяний коготь","Энергетические лезвия","Удар «тигриной лапой» выпускает из ногтей пять гигантских энергетических лезвий, режущих камень. Бьёт и вблизи, и на дистанции, можно повторять подряд.",[["str",12],["spd",4]],"Атака на дистанции, до 5 целей.",[["gp",-4]],"")]},

 {id:"sarissa",name:"Македонская сарисса",orig:"Macedonian Sarissa",rarity:"original",types:["weapon","strike"],base:"Бой копьём и щитом (Древняя Македония)",

   M("Пак Сао с ударом","Хлопок-блок + удар","Ладонь шлёпком отбивает руку соперника в сторону, а вторая рука в тот же миг бьёт в лицо.",[["spd",4],["str",3]],"Контратака.",[],"Отсутствуют."),
   M("Удар на дюйм","Взрывной удар","Удар без замаха с нескольких сантиметров: сила проходит волной от стоп через бёдра к кулаку. Отшвыривает соперника на метры.",[["str",7],["tech",3]],"Отбрасывание.",[["spd",-1]],"Нужен контакт вплотную."),
   M("Деревянный манекен","Серия блоков и ударов","Связка, отточенная на деревянном манекене Мук Ян Чонг: блок, захват, удар и подсечка ногой одним потоком.",[["tech",4],["str",3],["spd",2]],"",[["end",-2]],"")]}
);

/* ======= утилиты ======= */
const app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hash=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)};
function art(seed,color,word){
  const cx=[300,420,200,350][seed%4],cy=[220,160,260,200][(seed>>2)%4];let l="";
  for(let i=0;i<64;i++){const a=i/64*Math.PI*2+(seed%9)*.03,r1=50+((i*29+seed)%70);l+=`<line x1="${(cx+Math.cos(a)*r1).toFixed(1)}" y1="${(cy+Math.sin(a)*r1).toFixed(1)}" x2="${(cx+Math.cos(a)*900).toFixed(1)}" y2="${(cy+Math.sin(a)*900).toFixed(1)}" stroke="${i%6===0?color:"#fff"}" stroke-width="${i%6===0?4:1}" stroke-opacity="${i%6===0?.75:.16}"/>`}
  return `<svg viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><radialGradient id="g${seed}" cx="${cx/6}%" cy="${cy/8}%" r="60%"><stop offset="0" stop-color="${color}" stop-opacity=".55"/><stop offset="1" stop-color="#07080D" stop-opacity="0"/></radialGradient></defs><rect width="600" height="800" fill="#0E1119"/>${l}<rect width="600" height="800" fill="url(#g${seed})"/>${word?`<text x="${cx}" y="${cy+30}" text-anchor="middle" font-family="Rubik Mono One,Arial Black" font-size="92" fill="#fff" fill-opacity=".9" stroke="#07080D" stroke-width="8" paint-order="stroke" transform="rotate(-8 ${cx} ${cy})">${word}</text>`:""}</svg>`}
const rc=s=>RAR[s.rarity][1];
const media=s=>imgOf(s.id)?`<img src="${esc(imgOf(s.id))}" alt="" loading="lazy">`:art(hash(s.id),rc(s),"");
const modChip=([k,v],cls)=>`<span class="mod ${cls}">${esc(ST[k]||k)} ${v>0?"+":""}${v}</span>`;
let rf="all",tf="all",q="";

/* ======= главная ======= */
function renderHome(){
  const list=STYLES.filter(s=>(rf==="all"||s.rarity===rf)&&(tf==="all"||s.types.includes(tf))&&(!q||[s.name,s.orig,s.founder,...s.masters.map(m=>m[0])].join(" ").toLowerCase().includes(q)))
    .sort((a,b)=>RORDER.indexOf(a.rarity)-RORDER.indexOf(b.rarity));
  const nTech=STYLES.reduce((a,s)=>a+s.moves.length,0),nM=new Set(STYLES.flatMap(s=>s.masters.map(m=>m[0]))).size;
  app.innerHTML=`<section class="hero"><div class="txt"><span class="eyebrow">Вики сервера «Царь Горы»</span><h1>ВЫБЕРИ<em>СВОЙ СТИЛЬ</em></h1>
    <p>Энциклопедия боевых искусств мира «Бога старшей школы»: мастера, пассивные баффы стилей, особые способности и техники с бонусами к параметрам.</p>
    <div class="counter"><div><b>${STYLES.length}</b><span>стилей</span></div><div><b>${nTech}</b><span>техник</span></div><div><b>${nM}</b><span>мастеров</span></div></div></div>
    <div class="art">${art(7,"#2EE6FF","FIGHT!")}</div></section>
   <div class="bar"><div class="chips"><button type="button" class="chip" data-r="all" aria-pressed="${rf==="all"}">Все редкости</button>${RORDER.map(k=>`<button type="button" class="chip r" style="--rc:${RAR[k][1]}" data-r="${k}" aria-pressed="${rf===k}" title="${RAR[k][2]}">${RAR[k][0]} · ${STYLES.filter(x=>x.rarity===k).length}</button>`).join("")}</div>
    <div class="barrow"><div class="chips">${[["all","Все типы"],...Object.entries(TYPES)].map(([k,n])=>`<button type="button" class="chip" data-t="${k}" aria-pressed="${tf===k}">${n}</button>`).join("")}</div>
    <input class="search" id="q" placeholder="Поиск: стиль, мастер…" value="${esc(q)}" aria-label="Поиск по стилям"></div></div>
   ${list.length?`<div class="grid">${list.map(s=>`<button class="tile${s.rarity==="special"?" myth":""}" style="--rc:${rc(s)}" type="button" data-id="${s.id}" aria-label="${esc(s.name)}"><span class="frame"></span><span class="inner">${media(s)}<span class="shade"></span></span>
     <span class="p1">P1</span><span class="rar">${RAR[s.rarity][0]}</span>
     <span class="nm"><b>${esc(s.name)}</b><span>${esc(s.masters.map(m=>m[0]).slice(0,2).join(", ")||s.types.map(t=>TYPES[t]).join(" · "))}</span>${s.draft?'<span><span class="draft">уточняется</span></span>':""}</span></button>`).join("")}</div>`
   :`<div class="empty">Ничего не нашлось.</div>`}`;
  app.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{rf=b.dataset.r;renderHome()});
  app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tf=b.dataset.t;renderHome()});
  const qi=document.getElementById("q");qi.oninput=()=>{q=qi.value.trim().toLowerCase();const p=qi.selectionStart;renderHome();const n=document.getElementById("q");n.focus();n.setSelectionRange(p,p)};
  app.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>go(b.dataset.id));
  gmTools();
}

/* ======= страница стиля ======= */
function renderStyle(id){
  const s=STYLES.find(x=>x.id===id);if(!s){renderHome();return}
  const [rn,rcol]=RAR[s.rarity];
  app.innerHTML=`<button class="back" type="button" id="back">← Все стили</button>
  <div class="sp"><div class="side"><div class="poster${s.rarity==="special"?" myth":""}" style="--rc:${rcol}" data-slot="${esc(s.id)}"><span class="frame"></span><span class="inner">${media(s)}</span><span class="vname">${esc(s.name)}</span></div>
    <div class="card"><h2>Паспорт стиля</h2><dl class="pass"><dt>Редкость</dt><dd style="color:${rcol}">${rn}</dd><dt>Тип</dt><dd>${s.types.map(t=>TYPES[t]).join(", ")}</dd><dt>Основа</dt><dd>${esc(s.base)}</dd><dt>Основатель</dt><dd>${esc(s.founder)}</dd></dl></div>
    <div class="card"><h2>Мастера</h2>${s.masters.length?`<div class="people">${s.masters.map(([n,r])=>`<div class="person"><b>${esc(n)}</b>${esc(r)}</div>`).join("")}</div>`:`<p class="muted">Общедоступный стиль: на сервере его носителей пока нет.</p>`}</div></div>
  <div class="stack"><div class="head"><span class="eyebrow" style="color:${rcol}">${rn} стиль</span><h1>${esc(s.name)}</h1><span class="orig">${esc(s.orig)}</span>
    <div class="badges"><span class="badge" style="color:${rcol}">${rn}</span>${s.types.map(t=>`<span class="badge" style="color:var(--cy)">${TYPES[t]}</span>`).join("")}${s.draft?'<span class="draft">данные уточняются</span>':""}</div></div>
   <div class="card"><h2>О стиле</h2><p>${esc(s.about)}</p></div>
   <div class="card"><h2>Пассивные баффы</h2><p class="muted" style="margin-bottom:10px">Действуют, пока боец сражается этим стилем в бою.</p><div class="mods">${s.passive.map(m=>modChip(m,"p")).join("")||'<span class="muted">Нет</span>'}</div></div>
   ${s.ability?`<div class="card ability"><h2>Особая способность</h2><b class="an">${esc(s.ability[0])}</b><p>${esc(s.ability[1])}</p></div>`:""}
   <div class="card limits"><h2>Ограничения</h2><p>${esc(s.limits)}</p></div>
   <div class="card"><h2>Техники · ${s.moves.length}</h2><p class="note" style="margin-bottom:12px">Бонусы техник действуют только во время её использования.</p>
    ${s.moves.length?`<div class="moves">${s.moves.map((m,i)=>`<div class="move"><div class="mart" data-slot="${esc(s.id+"|"+m.name)}">${imgOf(s.id+"|"+m.name)?`<img src="${esc(imgOf(s.id+"|"+m.name))}" alt="" loading="lazy">`:art(hash(s.id+i),rcol,"")}<span class="no">${String(i+1).padStart(2,"0")}</span></div>
      <div class="mb"><div class="mh"><b>${esc(m.name)}</b>${m.type?`<span class="tag">${esc(m.type)}</span>`:""}${m.draft?'<span class="draft">уточняется</span>':""}</div><p>${esc(m.desc)}</p>
       <div class="pm"><span class="l p">Плюсы</span><span class="r">${(m.plus||[]).map(x=>modChip(x,"p")).join("")}${m.plusNote?`<span>${esc(m.plusNote)}</span>`:""}${!(m.plus||[]).length&&!m.plusNote?"—":""}</span>
       <span class="l m">Минусы</span><span class="r">${(m.minus||[]).map(x=>modChip(x,"m")).join("")}${m.minusNote?`<span>${esc(m.minusNote)}</span>`:""}${!(m.minus||[]).length&&!m.minusNote?"Отсутствуют.":""}</span></div></div></div>`).join("")}</div>`
    :`<p class="muted">Техники уточняются.</p>`}</div>
  </div></div>`;
  document.getElementById("back").onclick=()=>go("");
  gmTools();
}


/* ======= картинки: хранятся в базе сайта, загружает ГМ ======= */
let IMG={},ADMIN=false,DB=null,AS=null,IMGJSON="{}";
const imgOf=k=>IMG[k]?(window.BLOB_BASE||"")+IMG[k]:"";
const norm=x=>String(x||"").toLowerCase().replace(/ё/g,"е").replace(/\.[a-z0-9]+$/i,"").replace(/[^a-zа-я0-9]+/g,"");
function toast(m,keep){const t=document.getElementById("gtoast");t.textContent=m;t.hidden=false;clearTimeout(t._t);if(!keep)t._t=setTimeout(()=>t.hidden=true,5000)}
function rerender(){const y=window.scrollY;const a=document.activeElement&&document.activeElement.id;route(CUR);window.scrollTo(0,y);if(a==="q"){const n=document.getElementById("q");if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}}}
async function initImg(){
  try{
    if(!window.claude)return;
    DB=await claude.use("db");if(!DB)return;
    const u=await claude.use("user");ADMIN=u?!!(await u.isOwner()):false;
    if(ADMIN){AS=await claude.use("assets");rerender()}
    DB.doc("config/martial").onSnapshot(sn=>{const d=(sn.exists&&sn.data().img)||{};const j=JSON.stringify(d);if(j!==IMGJSON){IMG=d;IMGJSON=j;rerender()}},()=>{});
  }catch(e){}
}
async function shrink(f){
  if(/gif|svg/.test(f.type)||f.size<350000)return f;
  try{
    const bmp=await createImageBitmap(f);const k=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,"image/webp",.86));return b&&b.size<f.size?b:f;
  }catch(e){return f}
}
async function putImgs(pairs){ /* pairs: [[key,file]] */
  if(!AS){toast("Войди на главном сайте под аккаунтом ГМа.");return}
  let ok=0,fail=[];const next=Object.assign({},IMG),old=[];
  for(const [k,f] of pairs){
    toast(`Загружаю ${ok+fail.length+1} из ${pairs.length}…`,true);
    try{const b=await shrink(f);const r=await AS.upload(b,{type:b.type||f.type});if(next[k])old.push(next[k]);next[k]=r.id;ok++}
    catch(e){fail.push(f.name+(e&&e.code==="too_large"?" (больше 20 МБ)":e&&e.code==="unsupported_type"?" (формат не подходит)":""))}
  }
  if(ok){
    try{await DB.doc("config/martial").set({img:next});IMG=next;IMGJSON=JSON.stringify(next);rerender()}
    catch(e){toast("Картинки загрузились, но не сохранились в базе. Обнови страницу и попробуй ещё раз.");return}
    old.forEach(id=>AS.delete(id).catch(()=>{}));
  }
  toast(`Готово: ${ok} загружено.`+(fail.length?`\nНе вышло: ${fail.join(", ")}`:""));
}
async function delImg(k){
  if(!IMG[k])return;const next=Object.assign({},IMG);const id=next[k];delete next[k];
  try{await DB.doc("config/martial").set({img:next});IMG=next;IMGJSON=JSON.stringify(next);rerender();AS&&AS.delete(id).catch(()=>{});toast("Картинка убрана.")}
  catch(e){toast("Не удалось удалить. Попробуй ещё раз.")}
}
function pickOne(cb){const i=document.getElementById("gfile");i.value="";i.onchange=()=>{if(i.files[0])cb(i.files[0])};i.click()}
function pickMany(cb){const i=document.getElementById("gfiles");i.value="";i.onchange=()=>{if(i.files.length)cb([...i.files])};i.click()}

function gmTools(){
  if(!ADMIN)return;
  const s=CUR&&STYLES.find(x=>x.id===CUR);
  const bar=document.createElement("div");bar.className="gmbar";
  if(s){
    bar.innerHTML=`<b>Режим ГМа · картинки</b><span class="muted">«Пачкой» — выдели сразу много файлов. Файл с названием приёма (например «Хвечхук.png») ляжет в этот приём, файл «обложка.png» или с названием стиля — на обложку. Остальные лягут по порядку в приёмы без картинки. ✎ на рамке — заменить одну.</span><button class="gbtn" type="button" id="gbulk">Загрузить пачкой</button>`;
    const head=app.querySelector(".stack");head&&head.prepend(bar);
    document.getElementById("gbulk").onclick=()=>pickMany(files=>{
      const pairs=[],used=new Set(),rest=[];
      const byName=new Map(s.moves.map(m=>[norm(m.name),s.id+"|"+m.name]));
      const cover=new Set([norm(s.name),norm(s.id),norm(s.orig),"обложка","cover","стиль"]);
      for(const f of files){const n=norm(f.name);let k=byName.get(n);
        if(!k)for(const [mn,kk] of byName){if(n.length>3&&(mn.startsWith(n)||n.startsWith(mn))){k=kk;break}}
        if(!k&&cover.has(n))k=s.id;
        if(k&&!used.has(k)){used.add(k);pairs.push([k,f])}else rest.push(f)}
      const empty=s.moves.map(m=>s.id+"|"+m.name).filter(k=>!IMG[k]&&!used.has(k));
      if(!IMG[s.id]&&!used.has(s.id))empty.unshift(s.id);
      rest.forEach((f,i)=>{if(empty[i])pairs.push([empty[i],f])});
      const extra=rest.length-Math.min(rest.length,empty.length);
      if(!pairs.length){toast("Некуда класть: у всех приёмов уже есть картинки. Назови файлы как приёмы, чтобы заменить.");return}
      putImgs(pairs).then(()=>{if(extra>0)toast(`Лишних файлов: ${extra} — свободных рамок не осталось.`)});
    });
  }else{
    bar.innerHTML=`<b>Режим ГМа · обложки стилей</b><span class="muted">Выдели сразу много файлов: каждый ляжет на обложку стиля с таким же названием («Вин Чун.jpg», «Кёкусинкай Каратэ.png», «wingchun.png»). Картинки приёмов загружаются на странице стиля.</span><button class="gbtn" type="button" id="gbulk">Обложки пачкой</button>`;
    const g=app.querySelector(".bar");g&&g.before(bar);
    document.getElementById("gbulk").onclick=()=>pickMany(files=>{
      const pairs=[],miss=[];
      for(const f of files){const n=norm(f.name);const st=STYLES.find(x=>[x.name,x.id,x.orig.split("·")[0]].map(norm).includes(n))||STYLES.find(x=>n.length>3&&norm(x.name).startsWith(n));
        st?pairs.push([st.id,f]):miss.push(f.name)}
      if(!pairs.length){toast("Ни один файл не совпал с названием стиля.");return}
      putImgs(pairs).then(()=>{if(miss.length)toast(`Не нашёл стиль для: ${miss.join(", ")}`)});
    });
  }
  app.querySelectorAll("[data-slot]").forEach(el=>{
    const k=el.dataset.slot;const w=document.createElement("span");w.className="slotbtns";
    w.innerHTML=`<button type="button" title="Заменить картинку" aria-label="Заменить картинку">✎</button>${IMG[k]?`<button type="button" class="del" title="Убрать картинку" aria-label="Убрать картинку">✕</button>`:""}`;
    w.children[0].onclick=e=>{e.stopPropagation();pickOne(f=>putImgs([[k,f]]))};
    if(w.children[1])w.children[1].onclick=e=>{e.stopPropagation();if(confirm("Убрать эту картинку?"))delImg(k)};
    el.appendChild(w);
  });
}

function go(id){try{history.replaceState(null,"",id?"#"+id:"#")}catch(e){}route(id);window.scrollTo(0,0)}
let CUR="";
function route(id){CUR=id||"";id?renderStyle(id):renderHome()}
document.getElementById("home").onclick=()=>go("");
document.getElementById("toall").onclick=e=>{e.preventDefault();go("")};
route((location.hash||"").slice(1));
initImg();
</script>
