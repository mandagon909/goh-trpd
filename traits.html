<script>
const ST={str:"Сила",spd:"Скорость",dur:"Стойкость",end:"Выносливость",tech:"Техника БИ",ctrl:"Контроль Чарёка",gp:"Запас GP",per:"Восприятие"};

const RAR={common:["Common","#9AA3B5","Обычные"],rare:["Rare","#4D9CFF","Редкие"],epic:["Epic","#B57CFF","Эпические"],legendary:["Legendary","#FFB020","Легендарные"],mythic:["Mythic","#FF3B5C","Мифические"]};

нус\nКаждый раз, когда вы получаете ранение в бою, ваши выносливость и стойкость повышаются на +1 ранг.\n⚠ — Ограничение\nМаксимальный бонус — +5 рангов.", "modes": [{"name": "Ранен (максимум)", "bonuses": {"end": 5, "dur": 5}}], "gm": ["+1 к Выносливости и Стойкости за каждое ранение, максимум +5."]}, {"id": "lone_wolf", "group": "lone_wolf", "name": "Lone Wolf", "rarity": "epic", "flavor": "Вы привыкли полагаться исключительно на себя. Общение и командная работа никогда не были вашей сильной стороной, ведь вы не нуждаетесь в союзниках и способны справиться со всем самостоятельно. Оказавшись в одиночестве, вы словно сбрасываете все ограничения, позволяя своей истинной силе проявиться в полной мере.", "body": "**✚ — Бонус**\n\n**Когда вы сражаетесь один, вы получаете +4 ранга ко всем физическим характеристикам (сила, скорость, стойкость и выносливость), также +2 ранга к контролю Чарёка и восприятия.**\n\n**✖ — Штраф**\n\n**Пока рядом находится хотя бы один союзник, эффект полностью исчезает, а вместо него вы получаете -3 ранга ко всем физическим характеристикам и -2 ранга к контролю Чарёка и восприятия.**", "text": "✚ — Бонус\nКогда вы сражаетесь один, вы получаете +4 ранга ко всем физическим характеристикам (сила, скорость, стойкость и выносливость), также +2 ранга к контролю Чарёка и восприятия.\n✖ — Штраф\nПока рядом находится хотя бы один союзник, эффект полностью исчезает, а вместо него вы получаете -3 ранга ко всем физическим характеристикам и -2 ранга к контролю Чарёка и восприятия.", "modes": [{"name": "Сражается один", "bonuses": {"str": 4, "spd": 4, "dur": 4, "end": 4, "ctrl": 2, "per": 2}}, {"name": "Рядом союзник", "bonuses": {"str": -3, "spd": -3, "dur": -3, "end": -3, "ctrl": -2, "per": -2}}]}, {"id": "protector", "group": "protector", "name": "Protector", "rarity": "epic", "flavor": "В вашей жизни есть человек, ради которого вы готовы пойти на всё, даже пожертвовать собственной жизнью. Пока тот, кого вы поклялись защищать, находится рядом, ваша решимость становится источником невероятной силы. Чем серьёзнее угроза для этого человека, тем сильнее ваше желание защитить его любой ценой.", "body": "**✚ — Бонус**\n\n**Пока защищаемый вами человек находится рядом, вы получаете +3 ранга ко всем физическим характеристикам (сила, стойкость, скорость и выносливость).**\n\n**Если защищаемый человек получает смертельную рану, вы получаете +5 рангов ко всем физическим характеристикам (сила, стойкость, скорость и выносливость).**\n\n**⚠ — Ограничение**\n\n**В вашей жизни может быть только один человек, которого вы готовы защищать любой ценой.**", "text": "✚ — Бонус\nПока защищаемый вами человек находится рядом, вы получаете +3 ранга ко всем физическим характеристикам (сила, стойкость, скорость и выносливость).\nЕсли защищаемый человек получает смертельную рану, вы получаете +5 рангов ко всем физическим характеристикам (сила, стойкость, скорость и выносливость).\n⚠ — Ограничение\nВ вашей жизни может быть только один человек, которого вы готовы защищать любой ценой.", "modes": [{"name": "Защищаемый рядом", "bonuses": {"str": 3, "spd": 3, "dur": 3, "end": 3}}, {"name": "Защищаемый смертельно ранен", "bonuses": {"str": 5, "spd": 5, "dur": 5, "end": 5}}]}, {"id": "unyielding_will", "group": "unyielding_will", "name": "Unyielding Will", "rarity": "epic", "flavor": "Этот трейт дарует вам невероятную силу духа и несокрушимую волю к жизни. Даже когда тело истощено, а ситуация кажется безнадёжной, вы отказываетесь сдаваться и продолжаете сражаться. Оказавшись на грани смерти, ваша последняя воля пробуждает скрытые силы организма, позволяя вам превзойти собственные физические пределы и продолжить бой даже тогда, когда тело уже должно было остановиться.", "body": "**✚ — Бонус**\n\n**При достижении критического состояния вы получаете +5 рангов ко всем физическим характеристикам на 4 поста.**\n\n**Во время действия эффекта вы способны продолжать двигаться и сражаться даже при тяжелейших травмах, включая переломы костей.**\n\n**Один раз за бой во время действия эффекта вы можете нанести особую атаку, получив +5 рангов к силе и скорости.**\n\n**⚠ — Ограничение**\n\n**После окончания эффекта ваше тело полностью истощается, из-за чего вы теряете сознание и больше не способны продолжать бой.**", "text": "✚ — Бонус\nПри достижении критического состояния вы получаете +5 рангов ко всем физическим характеристикам на 4 поста.\nВо время действия эффекта вы способны продолжать двигаться и сражаться даже при тяжелейших травмах, включая переломы костей.\nОдин раз за бой во время действия эффекта вы можете нанести особую атаку, получив +5 рангов к силе и скорости.\n⚠ — Ограничение\nПосле окончания эффекта ваше тело полностью истощается, из-за чего вы теряете сознание и больше не способны продолжать бой.", "modes": [{"name": "Критическое состояние, 4 поста", "bonuses": {"str": 5, "spd": 5, "dur": 5, "end": 5}}, {"name": "Особая атака в критическом", "bonuses": {"str": 10, "spd": 10, "dur": 5, "end": 5}}], "gm": ["После эффекта — потеря сознания."]}, {"id": "slayer", "group": "slayer", "name": "Slayer", "rarity": "epic", "flavor": "Вы прирождённый убийца, не испытывающий жалости к своим жертвам. Для вас убийство — не необходимость, а источник удовольствия и способ испытать собственные возможности. Чем больше жизней вы отнимаете, тем сильнее становится ваша кровожадность, постепенно превращая вас в ещё более опасного противника.", "body": "**✚ — Бонус**\n\n**Во время боя насмерть с противником вы получаете +5 рангов ко всем характеристикам.**\n\n**Каждое убийство, совершённое вами с начала РП, приносит дополнительные SP:**\n\n**Убийство гражданского НПС: +15 SP.**\n**Убийство противника равного вам по силе: +25 SP.**\n**Убийство более сильного противника: +45–60 SP.**\n**Убийство игрока: +200 SP.**\n\n**⚠ — Ограничение**\n\n**Если вы проигрываете бой насмерть, все накопленные вами SP, необходимые для повышения статистики на следующий уровень, обнуляются.**", "text": "✚ — Бонус\nВо время боя насмерть с противником вы получаете +5 рангов ко всем характеристикам.\nКаждое убийство, совершённое вами с начала РП, приносит дополнительные SP:\nУбийство гражданского НПС: +15 SP.\nУбийство противника равного вам по силе: +25 SP.\nУбийство более сильного противника: +45–60 SP.\nУбийство игрока: +200 SP.\n⚠ — Ограничение\nЕсли вы проигрываете бой насмерть, все накопленные вами SP, необходимые для повышения статистики на следующий уровень, обнуляются.", "modes": [{"name": "Бой насмерть", "bonuses": {"str": 5, "spd": 5, "dur": 5, "end": 5, "tech": 5, "ctrl": 5, "gp": 5, "per": 5}}], "gm": ["SP за убийства: НПС +15, равный +25, сильнее +45–60, игрок +200.", "Проигрыш боя насмерть обнуляет накопленные SP до следующего уровня."]}, {"id": "runners_high", "group": "runners_high", "name": "Runner's High", "rarity": "epic", "flavor": "Эйфория бегуна — крайне редкое состояние, возникающее при экстремальной физической нагрузке. Когда тело достигает предела своих возможностей и продолжает работать вопреки усталости, мозг начинает выделять огромное количество гормонов, временно раскрывая скрытые резервы организма. В этот момент боль и истощение отходят на второй план, позволяя вам превзойти собственные физические пределы.", "body": "**✚ — Бонус**\n\n**Все физические характеристики и Техника БИ получают +5 рангов.**\n\n**Вы получаете повышенную устойчивость к боли и ускоренное восстановление выносливости, позволяя продолжать сражение даже при сильном истощении.**\n\n**✖ — Штраф**\n\n**После окончания эффекта Эйфории Бегуна вы получаете штраф в виде -4 ранга ко всем физическим характеристикам **\n\n**⚠ — Ограничение**\n\n**Эффект длится 5 постов.**\n\n**Эйфория не способна полностью устранить физический предел вашего тела. Если вы уже находитесь у своего физического предела, состояние не позволит вам совершить действие, превышающее возможности организма.**", "text": "✚ — Бонус\nВсе физические характеристики и Техника БИ получают +5 рангов.\nВы получаете повышенную устойчивость к боли и ускоренное восстановление выносливости, позволяя продолжать сражение даже при сильном истощении.\n✖ — Штраф\nПосле окончания эффекта Эйфории Бегуна вы получаете штраф в виде -4 ранга ко всем физическим характеристикам \n⚠ — Ограничение\nЭффект длится 5 постов.\nЭйфория не способна полностью устранить физический предел вашего тела. Если вы уже находитесь у своего физического предела, состояние не позволит вам совершить действие, превышающее возможности организма.", "modes": [{"name": "Эйфория, 5 постов", "bonuses": {"str": 5, "spd": 5, "dur": 5, "end": 5, "tech": 5}}, {"name": "После эйфории", "bonuses": {"str": -4, "spd": -4, "dur": -4, "end": -4}}]}, {"id": "anger_issues", "group": "anger_issues", "name": "Anger Issues", "rarity": "legendary", "flavor": "С самого рождения вы страдаете от неконтролируемых вспышек ярости. Чем сильнее давление, боль или отчаяние, тем слабее становится ваша внутренняя **«Печать»**. Это состояние измеряется уровнем **«Открытия»**: чем ниже процент, тем сильнее гнев овладевает вашим разумом, заставляя жертвовать рассудком ради силы. Узнать свой процент можно у куратора файта или ГМа.", "body": "### **[100%]**\n\nПолный контроль над собой. Обычное состояние.\n\n### **[90%]**\n\nВены проступают на лице, эмоции становится сложнее сдерживать.\n\n**✚ Сила и скорость: +1 ранг.**\n\n### **[75%]**\n\nГнев начинает брать верх над здравым смыслом. Движения становятся агрессивнее, но контроль Чарёка ухудшается.\n\n**✚ Все физические характеристики: +3 ранга.**\n\n**✖ Контроль Чарёка и Техника БИ: −1 ранг.**\n\n### **[50%]**\n\nВы практически перестаёте мыслить рационально и действуете преимущественно на инстинктах.\n\n**✚ Все физические характеристики: +5 рангов.**\n\n**✖ Контроль Чарёка и Техника БИ: −3 ранга.**\n\n### **[25%]**\n\nВы с трудом отличаете союзников от врагов, а действия становятся почти автоматическими.\n\n**✚ Все физические характеристики: +7 рангов.**\n\n**✖ Контроль Чарёка и Техника БИ: −6 рангов.**\n\n### **[0%]**\n\nПечать полностью разрушена. Вы : "**✚ — Бонус**\n\n**Если противник равен вам по силе, вы получаете +5 рангов ко всем физическим характеристикам (сила, скорость, выносливость и стойкость).**\n\n**Если противник превосходит вас на 5 и более рангов, вы входите в состояние боевого экстаза и получаете +8 рангов ко всем физическим характеристикам.**\n\n**После каждого боя вы дополнительно получаете +10% к полученным SP.**\n\n**✖ — Штраф**\n\n**Если противник слабее вас на 5 и более рангов, ваш интерес к битве угасает, и вы получаете −4 ранга ко всем физическим характеристикам.**", "text": "✚ — Бонус\nЕсли противник равен вам по силе, вы получаете +5 рангов ко всем физическим характеристикам (сила, скорость, выносливость и стойкость).\nЕсли противник превосходит вас на 5 и более рангов, вы входите в состояние боевого экстаза и получаете +8 рангов ко всем физическим характеристикам.\nПосле каждого боя вы дополнительно получаете +10% к полученным SP.\n✖ — Штраф\nЕсли противник слабее вас на 5 и более рангов, ваш интерес к битве угасает, и вы получаете −4 ранга ко всем физическим характеристикам.", "modes": [{"name": "Равный противник", "bonuses": {"str": 5, "spd": 5, "dur": 5, "end": 5}}, {"name": "Противник сильнее на 5+", "bonuses": {"str": 8, "spd": 8, "dur": 8, "end": 8}}, {"name": "Противник слабее на 5+", "bonuses": {"str": -4, "spd": -4, "dur": -4, "end": -4}}], "gm": ["+10% к SP после каждого боя."]}, {"id": "legend_of_the_past", "group": "legend_of_the_past", "name": "Legend of the Past", "rarity": "legendary", "flavor": "Ваш путь уже завершён. Вы достигли вершины своего мастерства и оставили своё имя в истории. Когда-то вы были легендой, чья сила внушала уважение и страх, однако теперь оставили службу и ушли в отставку. Несмотря на возраст и спокойную жизнь, ваш опыт и навыки всё ещё недосягаемы для большинства.", "body": "**✚ — Бонус**\n\n**Все ваши физические характеристики имеют ранг LR.**\n\n**Во время РП вы можете взять одного ученика. Если ученик тренируется или проводит спарринги вместе с вами, он получает +20% к получаемым SP.**\n\n**Если на ваших глазах ученику наносят смертельное ранение, вы теряете хладнокровие и до конца боя получаете +8 рангов ко всем физическим характеристикам. В этом состоянии вам разрешено тяжело калечить или убить противника.**\n\n**⚠ — Ограничение**\n\n**Вы не можете нападать на значительно более слабых противников или убивать других игроков без веской причины.**\n\n**Вы больше не можете повышать или прокачивать свои характеристики.**", "text": "✚ — Бонус\nВсе ваши физические характеристики имеют ранг LR.\nВо время РП вы можете взять одного ученика. Если ученик тренируется или проводит спарринги вместе с вами, он получает +20% к получаемым SP.\nЕсли на ваших глазах ученику наносят смертельное ранение, вы теряете хладнокровие и до конца боя получаете +8 рангов ко всем физическим характеристикам. В этом состоянии вам разрешено тяжело калечить или убить противника.\n⚠ — Ограничение\nВы не можете нападать на значительно более слабых противников или убивать других игроков без веской причины.\nВы больше не можете повышать или прокачивать свои характеристики.", "floor": {"str": 37, "spd": 37, "dur": 37, "end": 37}, "lock": true, "modes": [{"name": "Ученик смертельно ранен", "bonuses": {"str": 8, "spd": 8, "dur": 8, "end": 8}}], "gm": ["Можно взять одного ученика: +20% SP на совместных тренировках.", "Нельзя нападать на гораздо более слабых и убивать игроков без веской причины."]}, {"id": "heir_of_legend", "group": "heir_of_legend", "name": "Heir of Legend", "rarity": "legendary", "flavor": "Вы учились под крылом настоящей легенды и перенимали знания своего мастера. Его опыт, техника и сила стали фундаментом вашего собственного пути. Вы не просто ученик — вы наследник его боевого наследия, однако такой путь требует полной преданности одному стилю.", "body": "**✚ — Бонус**\n\n**Со старта вы можете выбрать один боевой стиль или особую силу, которой владеет ваш мастер, и получить её как часть своего собственного арсенала.**\n\n**+5 рангов к Технике БИ со старта.**\n\n**+4 ранга ко всем физическим параметрам (сила, скорость, стойкость и выносливость) со старта.**\n\n**⚠ — Ограничение**\n\n**Вы не можете изучать или получать другие боевые стили и особые силы. После выбора изменить его невозможно.**", "text": "✚ — Бонус\nСо старта вы можете выбрать один боевой стиль или особую силу, которой владеет ваш мастер, и получить её как часть своего собственного арсенала.\n+5 рангов к Технике БИ со старта.\n+4 ранга ко всем физическим параметрам (сила, скорость, стойкость и выносливость) со старта.\n⚠ — Ограничение\nВы не можете изучать или получать другие боевые стили и особые силы. После выбора изменить его невозможно.", "bonuses": {"tech": 5, "str": 4, "spd": 4, "dur": 4, "end": 4}, "gm": ["Один стиль или сила мастера со старта; другие стили и силы недоступны."]}, {"id": "direct_heir", "group": "direct_heir", "name": "Direct Heir", "rarity": "legendary", "flavor": "Вы являетесь прямым потомком легендарного человека/существа, чья сила стала частью вашей крови. Благодаря этой близкой связи с предком вы способны заимствовать его силу и пробудить лучшую версию Чарёка.", "body": "**✚ — Бонус**\n\n**Со старта вы можете выбрать одного легендарного предка и получить уникальный Чарёк, основанный на его силе.**\n\n**Также в бою вы можете заключить прямой контракт с предком и получить полную его силу.**\n\n**+5 рангов к Контролю Чарёка.**\n\n**+6 рангов к GP**", "text": "✚ — Бонус\nСо старта вы можете выбрать одного легендарного предка и получить уникальный Чарёк, основанный на его силе.\nТакже в бою вы можете заключить прямой контракт с предком и получить полную его силу.\n+5 рангов к Контролю Чарёка.\n+6 рангов к GP", "bonuses": {"ctrl": 5, "gp": 6}, "gm": ["Уникальный чарёк по силе предка; в бою — прямой контракт с предком."]}, {"id": "divine_blessing", "group": "divine_blessing", "name": "Divine Blessing", "rarity": "legendary", "flavor": "Вы заключили особую связь с божеством, позволив ему поселиться внутри оявляются первые физические изменения.\nВсе физические характеристики: +2 ранга.\n[30%]\nВы частично открываете доступ божеству. Тело начинает заметно искажаться, а его сила смешивается с вашей собственной.\nВсе физические характеристики и запасы GP: +4 ранга.\n[50%]\nПоловина табу снята. Божественная сущность начинает практически полностью подавлять человеческую природу.\nВсе физические характеристики и запасы GP: +6 рангов.\n[70%]\nВаше тело превращается в нечто, лишь отдалённо напоминающее человека. Божественная сила практически полностью контролирует физическую оболочку.\nВсе физические характеристики и запасы GP: +8 рангов.\n[100%] — Снятие табу\nВсе ограничения полностью сняты. Человек и божество практически сливаются воедино, превращая тело пользователя в полноценное воплощение божественной сущности.\nВсе физические характеристики и запасы GP: +10 рангов.\n⚠ — Ограничение\nЧем выше процент освобождения, тем сильнее изменяется ваше тело и сознание. При достижении 100% вы практически полностью теряете человеческий облик и контроль над собой.\nМаксимальный процент освобождения определяется потенциалом вашего персонажа и устанавливается куратором или ГМом.", "modes": [{"name": "Освобождение 10%", "bonuses": {"str": 2, "spd": 2, "dur": 2, "end": 2}}, {"name": "Освобождение 30%", "bonuses": {"str": 4, "spd": 4, "dur": 4, "end": 4, "gp": 4}}, {"name": "Освобождение 50%", "bonuses": {"str": 6, "spd": 6, "dur": 6, "end": 6, "gp": 6}}, {"name": "Освобождение 70%", "bonuses": {"str": 8, "spd": 8, "dur": 8, "end": 8, "gp": 8}}, {"name": "Освобождение 100%", "bonuses": {"str": 10, "spd": 10, "dur": 10, "end": 10, "gp": 10}}], "gm": ["Максимальный процент освобождения назначает куратор или ГМ."]}, {"id": "national_treasure", "group": "national_treasure", "name": "National Treasure", "rarity": "legendary", "flavor": "Вы являетесь одним из немногих людей, достойных получить особый артефакт, созданный и хранимый вашей нацией. Это не обычное оружие, а редчайшее сокровище, пере ивник превосходит вас на 6 и более рангов, вы получаете +7 рангов ко всем физическим характеристикам.\nПосле каждого завершённого сражения вы получаете ×1.5 к получаемому SP.\n⚠ — Ограничение\nВы не способны испытывать обычный страх перед противниками, значительно превосходящими вас по силе, и не можете отказаться от боя исключительно из-за разницы в силе.", "modes": [{"name": "Противник сильнее на 2–3", "bonuses": {"str": 3, "spd": 3, "dur": 3, "end": 3}}, {"name": "Противник сильнее на 4–5", "bonuses": {"str": 5, "spd": 5, "dur": 5, "end": 5}}, {"name": "Противник сильнее на 6+", "bonuses": {"str": 7, "spd": 7, "dur": 7, "end": 7}}], "gm": ["×1.5 к SP после каждого боя."]}, {"id": "superman_syndrome", "group": "superman_syndrome", "name": "Superman Syndrome", "rarity": "legendary", "flavor": "Вы родились с уникальной мутацией, возникшей ещё на стадии формирования организма. Она привела к аномальному развитию тела, огромному росту и невероятной плотности мышц, превратив вас в настоящего сверхчеловека с самого рождения. Однако столь сильное физическое развитие имеет обратную сторону: ваш организм значительно хуже адаптируется к новым условиям, а боевой интеллект изначально развит слабее.", "body": "**✚ — Бонус**\n\n**Ваш начальный рост составляет 200–220 см. В дальнейшем вы способны продолжать увеличивать свои размеры.**\n\n**Все физические характеристики со старта имеют ранг SSS+.**\n\n**Каждую неделю ваши физические характеристики автоматически получают +1 ранг.**\n\n**⚠ — Ограничение**\n\n**Максимальный ранг контроля Чарёка X ранг.**", "text": "✚ — Бонус\nВаш начальный рост составляет 200–220 см. В дальнейшем вы способны продолжать увеличивать свои размеры.\nВсе физические характеристики со старта имеют ранг SSS+.\nКаждую неделю ваши физические характеристики автоматически получают +1 ранг.\n⚠ — Ограничение\nМаксимальный ранг контроля Чарёка X ранг.", "floor": {"str": 26, "spd": 26, "dur": 26, "end": 26}, "cap": {"ctrl": 44}, "gm": ["Каждую неделю физические пара ]}, {"id": "advanced_technology", "group": "advanced_technology", "name": "Advanced Technology", "rarity": "legendary", "flavor": "Вы не обладаете Чарёком, однако это не стало для вас препятствием. Вместо сверхъестественной силы вы сделали ставку на технологии, создав или получив доступ к высокотехнологичным устройствам, способным компенсировать отсутствие магической энергии. Ваш арсенал постоянно развивается вместе с вами, позволяя использовать технологии, недоступные обычным людям.", "body": "**✚ — Бонус**\n\n**Вы не обладаете Чарёком, но можете использовать высокотехнологичное снаряжение для усиления своих физических и боевых возможностей.**\n\n**Со старта вы получаете один высокотехнологичный предмет или устройство, соответствующее вашей концепции.**\n\n**Вы можете создавать и улучшать технологическое снаряжение по мере развития персонажа.**\n\n**Технологии могут компенсировать отсутствие Чарёка, предоставляя различные боевые, защитные или вспомогательные возможности.**\n\n**⚠ — Ограничение**\n\n**Все технологии должны соответствовать уровню развития мира и быть одобрены анкетологом.**", "text": "✚ — Бонус\nВы не обладаете Чарёком, но можете использовать высокотехнологичное снаряжение для усиления своих физических и боевых возможностей.\nСо старта вы получаете один высокотехнологичный предмет или устройство, соответствующее вашей концепции.\nВы можете создавать и улучшать технологическое снаряжение по мере развития персонажа.\nТехнологии могут компенсировать отсутствие Чарёка, предоставляя различные боевые, защитные или вспомогательные возможности.\n⚠ — Ограничение\nВсе технологии должны соответствовать уровню развития мира и быть одобрены анкетологом.", "noCy": true, "gm": ["Технологии одобряет анкетолог."]}, {"id": "copycat", "group": "copycat", "name": "Copycat", "rarity": "legendary", "flavor": "Вы обладаете редчайшей способностью мгновенно анализировать и воспроизводить увиденные боевые стили. Достаточно один раз внимательно наблюдать за техникой противника, чтобы ваше тело запомнило принцип её выполнения и смогло воспроизвести его самостоятельно. Чем сложнее стиль, тем больше концентрации и понимания требуется для его полноценного освоения.", "body": "**✚ — Бонус**\n\n**Увидев боевой технику в действии, вы можете скопировать её.**\n\n**Вы способны копировать стили как во время сражения, так и наблюдая за тренировками других персонажей.**\n\n**Для копирования достаточно увидеть стиль в действии, однако освоение сложных техник может потребовать дополнительной тренировки.**\n\n**⚠ — Ограничение**\n\n**Вы не можете копировать уникальные способности, Чарёки или техники, основанные на физиологии, расе или врождённых особенностях другого персонажа.**", "text": "✚ — Бонус\nУвидев боевой технику в действии, вы можете скопировать её.\nВы способны копировать стили как во время сражения, так и наблюдая за тренировками других персонажей.\nДля копирования достаточно увидеть стиль в действии, однако освоение сложных техник может потребовать дополнительной тренировки.\n⚠ — Ограничение\nВы не можете копировать уникальные способности, Чарёки или техники, основанные на физиологии, расе или врождённых особенностях другого персонажа."}, {"id": "genius", "group": "genius", "name": "Genius", "rarity": "mythic", "flavor": "Вы являетесь настоящим гением. Чему бы вы ни решили научиться, освоение новых навыков даётся вам значительно легче, чем другим. Вы обладаете исключительной способностью быстро анализировать информацию, замечать закономерности и превращать полученные знания в практические навыки. Там, где другим требуются годы упорных тренировок, вам достаточно значительно меньшего времени, чтобы достичь впечатляющих результатов.", "body": "**✚ — Бонус**\n\n**+7 рангов ко всем характеристикам со старта.**\n\n**+25% к получаемым SP.**\n\n**Для повышения характеристик требуется на 15% меньше SP.**", "text": "✚ — Бонус\n+7 рангов ко всем характеристикам со старта.\n+25% к получаемым SP.\nДля повышения характеристик требуется на 15% меньше SP. ла, способная постепенно менять своего владельца, открывая ему доступ к совершенно новым возможностям. Однако истинный потенциал артефакта скрыт и раскрывается лишь по мере того, как носитель становится способен его выдерживать.", "body": "**✚ — Бонус**\n\n**Со старта вы получаете Второй Ключ Пандоры и можете использовать его силу на начальном уровне.**\n\n**По мере развития РП Ключ способен открывать новые способности и повышать свою эффективность.**\n\n**Сила Ключа может постепенно адаптироваться к вашему телу, позволяя безопасно использовать всё большую часть его потенциала.**\n\n**⚠ — Ограничение**\n\n**Вы не знаете полного потенциала Ключа в начале РП. Его новые способности и уровни силы могут быть открыты только через сюжетные события с разрешения ГМа.**\n\n**Второй Ключ Пандоры является уникальным артефактом и не может быть заменён или передан другому персонажу.**", "text": "✚ — Бонус\nСо старта вы получаете Второй Ключ Пандоры и можете использовать его силу на начальном уровне.\nПо мере развития РП Ключ способен открывать новые способности и повышать свою эффективность.\nСила Ключа может постепенно адаптироваться к вашему телу, позволяя безопасно использовать всё большую часть его потенциала.\n⚠ — Ограничение\nВы не знаете полного потенциала Ключа в начале РП. Его новые способности и уровни силы могут быть открыты только через сюжетные события с разрешения ГМа.\nВторой Ключ Пандоры является уникальным артефактом и не может быть заменён или передан другому персонажу.", "slots": 1}, {"id": "lost_divinity", "group": "lost_divinity", "name": "Lost Divinity", "rarity": "mythic", "flavor": "Когда-то вы были богом, который бросил вызов самому Небу. Небожители не смогли вас убить, поэтому сделали страшнее: стёрли ваше имя из всех летописей, запечатали силу и сбросили душу в круг перерождений. Теперь вы — реинкарнация **Безымянного Мятежника**, и сами об этом не знаете. Для окружающих вы обычный человек. По мере развития РП прошлое постепенно раскрывается, а вместе с  силы.\nНебеса помнят мятежника, даже если вы его не помните. Чем больше силы вы возвращаете, тем выше шанс, что вас заметят небожители, NOX и другие, кто когда-то его запечатал.\nНевозможно получить Чарёк.", "slots": 1, "bonuses": {"str": 5, "spd": 5, "dur": 5, "end": 5}, "noCy": true}];

/* ======= группы: ветки одного трейта показываются вместе ======= */
const GROUPS=(()=>{const m=new Map();TRAITS.forEach(t=>{const g=t.group||t.id;if(!m.has(g))m.set(g,{id:g,rarity:t.rarity,flavor:t.flavor,body:t.body,text:t.text,name:t.name.replace(/:.*$/,""),variants:[]});m.get(g).variants.push(t)});return [...m.values()]})();
const branchName=t=>t.name.includes(":")?t.name.split(":").slice(1).join(":").trim():t.name;
/* кто занял слоты: заполняется на сайте из базы, в превью пусто */
let HOLD={};
/* ======= утилиты ======= */
const app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hash=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)};
function art(seed,color,word){
  const cx=[300,420,200,350][seed%4],cy=[220,160,260,200][(seed>>2)%4];let l="";
  for(let i=0;i<64;i++){const a=i/64*Math.PI*2+(seed%9)*.03,r1=50+((i*29+seed)%70);l+=`<line x1="${(cx+Math.cos(a)*r1).toFixed(1)}" y1="${(cy+Math.sin(a)*r1).toFixed(1)}" x2="${(cx+Math.cos(a)*900).toFixed(1)}" y2="${(cy+Math.sin(a)*900).toFixed(1)}" stroke="${i%6===0?color:"#fff"}" stroke-width="${i%6===0?4:1}" stroke-opacity="${i%6===0?.75:.16}"/>`}
  return `<svg viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><radialGradient id="g${seed}" cx="${cx/6}%" cy="${cy/8}%" r="60%"><stop offset="0" stop-color="${color}" stop-opacity=".55"/><stop offset="1" stop-color="#07080D" stop-opacity="0"/></radialGradient></defs><rect width="600" height="800" fill="#0E1119"/>${l}<rect width="600" height="800" fill="url(#g${seed})"/>${word?`<text x="${cx}" y="${cy+30}" text-anchor="middle" font-family="Rubik Mono One,Arial Black" font-size="92" fill="#fff" fill-opacity=".9" stroke="#07080D" stroke-width="8" paint-order="stroke" transform="rotate(-8 ${cx} ${cy})">${word}</text>`:""}</svg>`}
const coverKey=t=>t.group||t.id;
const slotLine=v=>{if(!v.slots)return"";const h=HOLD[v.id]||[];return h.length>=v.slots?`<span class="slot busy">занят: ${esc(h.join(", "))}</span>`:`<span class="slot free">свободен · ${v.slots-h.length} из ${v.slots}</span>`};
const media=t=>imgOf(coverKey(t))?`<img class="fg" src="${esc(imgOf(coverKey(t)))}" alt="" loading="lazy">`:art(hash(t.id),RAR[t.rarity][1],"");
const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\*(.+?)\*/g,"<i>$1</i>");
function md(s){
  return String(s||"").split(/\n+/).map(l=>l.trim()).filter(Boolean).map(l=>{
    let m;
    if((m=l.match(/^#+\s*(.+)$/)))return `<h4 class="tier">${inl(m[1].replace(/\*\*/g,""))}</h4>`;
    if((m=l.match(/^\*\*\s*(✚|✖|⚠)\s*—\s*(.+?)\*\*$/))){const k=m[1]==="✚"?"plus":/Штраф/.test(m[2])?"minus":"limit";return `<div class="sh ${k}">${esc(m[2])}</div>`}
    return `<p>${inl(l)}</p>`}).join("");
}
const sign=v=>(v>0?"+":"")+v;
const chips=(o,cls)=>SKEYS.filter(k=>o&&o[k]).map(k=>`<span class="mod ${o[k]>0?"p":"m"}${cls?" "+cls:""}">${ST[k]} ${sign(o[k])}</span>`).join("");
const RANKS=["F","E","D","C","B","A","S","SS","SSS","SR","SSR","UR","LR","MR","X"];
const lvl=L=>RANKS[Math.floor(L/3)]+["-","","+"][L%3];
const cchips=o=>{if(!o)return"";const out=[],used=new Set();const grp=(keys,lbl)=>{const v=o[keys[0]];if(v&&keys.every(k=>o[k]===v)){out.push(`<span class="mod ${v>0?"p":"m"} sm">${lbl} ${sign(v)}</span>`);keys.forEach(k=>used.add(k))}};
  grp(SKEYS,"Все");if(!used.size)grp(["str","spd","dur","end"],"Физ.");SKEYS.filter(k=>o[k]&&!used.has(k)).forEach(k=>out.push(`<span class="mod ${o[k]>0?"p":"m"} sm">${ST[k]} ${sign(o[k])}</span>`));return out.join("")};
const hasAuto=t=>(t.bonuses&&SKEYS.some(k=>t.bonuses[k]))||(t.modes&&t.modes.length)||t.floor||t.cap||t.noCy||t.lock;
let rf="all",q="";

/* ======= главная ======= */
function renderHome(){
  const list=GROUPS.filter(t=>(rf==="all"||t.rarity===rf)&&(!q||(t.name+" "+t.flavor+" "+t.text+" "+t.variants.map(v=>v.name).join(" ")).toLowerCase().includes(q)))
    .sort((a,b)=>RORDER.indexOf(a.rarity)-RORDER.indexOf(b.rarity));
  app.innerHTML=`<section class="hero"><div class="txt"><span class="eyebrow">Вики сервера «Царь Горы»</span><h1>ТРЕЙТЫ<em>БОЙЦОВ</em></h1>
    <p>Врождённые таланты, черты характера, дары и проклятия. Трейт выбирается в анкете персонажа, и его бонусы сразу попадают в параметры бойца.</p>
    <div class="counter"><div><b>${GROUPS.length}</b><span>трейтов</span></div><div><b>${RORDER.length}</b><span>редкостей</span></div></div></div>
    <div class="art" data-slot="hero">${imgOf("hero")?`<img src="${esc(imgOf("hero"))}" alt="">`:art(5,"#FFB020","TRAIT")}</div></section>
   <section class="sec" id="list">
    <div class="cats">${RORDER.map(k=>`<button type="button" class="cat${k==="mythic"?" mythc":""}" data-r="${k}" aria-pressed="${rf===k}" style="--rc:${RAR[k][1]}"><b>${RAR[k][0].toUpperCase()} · ${RAR[k][2]} · ${GROUPS.filter(t=>t.rarity===k).length}</b></button>`).join("")}</div>
    <div class="bar"><div class="chips"><button type="button" class="chip" data-r="all" aria-pressed="${rf==="all"}">Все</button>${RORDER.map(k=>`<button type="button" class="chip" data-r="${k}" aria-pressed="${rf===k}">${RAR[k][0]}</button>`).join("")}</div>
     <input class="search" id="q" placeholder="Поиск по трейтам…" value="${esc(q)}" aria-label="Поиск по трейтам"></div>
    ${list.length?`<div class="grid">${list.map(t=>`<div class="tw" data-slot="${esc(coverKey(t))}"><button class="tile${t.rarity==="mythic"?" myth":""}" style="--rc:${RAR[t.rarity][1]}" type="button" data-id="${t.id}" aria-label="${esc(t.name)}"><span class="frame"></span><span class="inner">${media(t)}<span class="shade"></span></span>
      <span class="rar">${RAR[t.rarity][0]}</span>
      <span class="nm"><b>${esc(t.name)}</b><span class="tchips">${t.variants.length>1?`<span class="mod md sm">${t.variants.length} ветки на выбор</span>`:cchips(t.variants[0].bonuses)+(t.variants[0].modes&&t.variants[0].modes.length?`<span class="mod md sm">${t.variants[0].modes.length===1?"режим":t.variants[0].modes.length+" режима"}</span>`:"")}${t.variants.some(v=>v.slots)?`<span class="mod sm slotc">${t.variants.length>1?t.variants.length+" слота":"1 слот"}</span>`:""}</span></span></button></div>`).join("")}</div>`
    :`<div class="empty">Ничего не нашлось.</div>`}</section>`;
  app.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{rf=b.classList.contains("cat")&&rf===b.dataset.r?"all":b.dataset.r;renderHome()});
  const qi=document.getElementById("q");qi.oninput=()=>{q=qi.value.trim().toLowerCase();const p=qi.selectionStart;renderHome();const n=document.getElementById("q");n.focus();n.setSelectionRange(p,p)};
  app.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>go(b.dataset.id));
}

/* ======= страница трейта ======= */
function renderOne(id){
  const t=GROUPS.find(x=>x.id===id)||GROUPS.find(x=>x.variants.some(v=>v.id===id));if(!t){renderHome();return}
  const [rn,col,rru]=RAR[t.rarity];
  const autoOf=v=>{const auto=[];
  if(v.bonuses&&SKEYS.some(k=>v.bonuses[k]))auto.push(`<div class="arow"><span class="lbl">Постоянно</span><div class="mods">${chips(v.bonuses)}</div></div>`);
  if(v.floor)auto.push(`<div class="arow"><span class="lbl">Ранг со старта</span><div class="mods">${SKEYS.filter(k=>v.floor[k]!=null).map(k=>`<span class="mod p">${ST[k]} ${lvl(v.floor[k])}</span>`).join("")}</div></div>`);
  if(v.cap)auto.push(`<div class="arow"><span class="lbl">Потолок</span><div class="mods">${SKEYS.filter(k=>v.cap[k]!=null).map(k=>`<span class="mod m">${ST[k]} до ${lvl(v.cap[k])}</span>`).join("")}</div></div>`);
  if(v.modes&&v.modes.length)auto.push(`<div class="arow"><span class="lbl">Режимы — в бою, по условию</span><div class="modes">${v.modes.map(m=>`<div class="mode"><b>${esc(m.name)}</b><div class="mods">${chips(m.bonuses)}</div></div>`).join("")}</div></div>`);
  if(v.noCy)auto.push(`<div class="arow"><span class="lbl">Чарёк</span><div><span class="mod m">без чарёка со старта</span></div></div>`);
  if(v.lock)auto.push(`<div class="arow"><span class="lbl">Прокачка</span><div><span class="mod m">параметры не качаются</span></div></div>`);
  if(v.gm&&v.gm.length)auto.push(`<div class="arow"><span class="lbl">Учитывает ГМ</span><ul class="goals">${v.gm.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`);
  return auto.join("")};
  const multi=t.variants.length>1,lim=t.variants.some(v=>v.slots);
  app.innerHTML=`<button class="back" type="button" id="back">← Все трейты</button>
  <div class="sp"><div class="side"><div class="poster${t.rarity==="mythic"?" myth":""}${imgOf(coverKey(t))?" hasimg":""}" style="--rc:${col}" data-slot="${esc(coverKey(t))}"><span class="frame"></span><span class="inner">${media(t)}</span><span class="vname">${esc(t.name)}</span></div>
    <div class="card"><h2>Паспорт</h2><dl class="pass"><dt>Редкость</dt><dd style="color:${col}">${rn} · ${RONE[t.rarity]}</dd><dt>Выбор</dt><dd>В анкете персонажа${multi?": одна ветка на выбор":""}</dd>${lim?`<dt>Лимит</dt><dd>${multi?t.variants.length+" слота на сервер: по одному на ветку":"1 персонаж на весь сервер"}</dd>${multi?"":`<dt>Слот</dt><dd>${slotLine(t.variants[0])}</dd>`}`:""}</dl></div></div>
  <div class="stack"><div class="head"><span class="eyebrow" style="color:${col}">${rn} трейт</span><h1>${esc(t.name)}</h1>
    <div class="badges"><span class="badge" style="color:${col}">${rn}</span>${lim?`<span class="badge" style="color:var(--gold)">${multi?t.variants.length+" слота":"1 слот"}</span>`:""}${t.variants.some(v=>v.noCy)?'<span class="badge" style="color:var(--red)">без чарёка</span>':""}</div></div>
   ${t.flavor?`<div class="card flav"><p>${inl(t.flavor)}</p></div>`:""}
   <div class="card body"><h2>Эффект</h2><div class="mdb">${md(t.body)}</div></div>
   ${multi?t.variants.map(v=>`<div class="card auto"><h2>Ветка «${esc(branchName(v))}»</h2>${v.slots?`<div class="arow"><span class="lbl">Слот на сервере</span><div>${slotLine(v)}</div></div>`:""}${autoOf(v)}</div>`).join("")
    :(hasAuto(t.variants[0])||(t.variants[0].gm||[]).length?`<div class="card auto"><h2>Что сайт ставит сам</h2><p class="note" style="margin-bottom:12px">При выборе трейта в анкете эти бонусы сразу попадают в параметры бойца. Режимы показываются рядом с параметрами и действуют только при своём условии.</p>${autoOf(t.variants[0])}</div>`:"")}
  </div></div>`;
  document.getElementById("back").onclick=()=>go("");
}


/* ======= картинки: хранятся в базе сайта, загружает ГМ ======= */
let IMG={},ADMIN=false,DB=null,AS=null,IMGJSON="{}";
const imgOf=k=>IMG[k]?(window.BLOB_BASE||"")+IMG[k]:"";
const norm=x=>String(x||"").toLowerCase().replace(/ё/g,"е").replace(/\.[a-z0-9]+$/i,"").replace(/[^a-zа-я0-9]+/g,"");
function toast(m,keep){const t=document.getElementById("gtoast");t.textContent=m;t.hidden=false;clearTimeout(t._t);if(!keep)t._t=setTimeout(()=>t.hidden=true,5000)}
function rerender(){const y=window.scrollY;route(CUR);window.scrollTo(0,y)}
async function initDB(){
  try{if(!window.claude)return;DB=await claude.use("db");if(!DB)return;
    DB.doc("config/traits").onSnapshot(sn=>{const d=(sn.exists&&sn.data().img)||{};const j=JSON.stringify(d);if(j!==IMGJSON){IMG=d;IMGJSON=j;rerender()}},()=>{});
    DB.collection("fighters").onSnapshot(sn=>{const h={};sn.docs.forEach(dc=>{const f=dc.data()||{};(Array.isArray(f.traits)?f.traits:[]).forEach(t=>{if(t&&t.key){(h[t.key]=h[t.key]||[]).push(f.name||"боец")}})});const j=JSON.stringify(h);if(j!==JSON.stringify(HOLD)){HOLD=h;rerender()}},()=>{});
    const u=await claude.use("user");ADMIN=u?!!(await u.isOwner()):false;if(ADMIN){AS=await claude.use("assets");rerender()}}catch(e){}
}
async function shrinkImg(f){
  if(/gif|svg/.test(f.type)||f.size<350000)return f;
  try{const bmp=await createImageBitmap(f);const k=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);const b=await new Promise(r=>c.toBlob(r,"image/webp",.86));return b&&b.size<f.size?b:f}catch(e){return f}
}
async function putImgs(pairs){
  if(!AS){toast("Войди на главном сайте под аккаунтом ГМа.");return}
  let ok=0,fail=[];const next=Object.assign({},IMG),old=[];
  for(const [k,f] of pairs){toast(`Загружаю ${ok+fail.length+1} из ${pairs.length}…`,true);
    try{const b=await shrinkImg(f);const r=await AS.upload(b,{type:b.type||f.type});if(next[k])old.push(next[k]);next[k]=r.id;ok++}
    catch(e){fail.push(f.name+(e&&e.code==="too_large"?" (больше 20 МБ)":e&&e.code==="unsupported_type"?" (формат не подходит)":""))}}
  if(ok){try{await DB.doc("config/traits").set({img:next});IMG=next;IMGJSON=JSON.stringify(next);rerender()}
    catch(e){toast("Картинки загрузились, но не сохранились в базе. Обнови страницу и попробуй ещё раз.");return}
    old.forEach(id=>AS.delete(id).catch(()=>{}))}
  toast(`Готово: ${ok} загружено.`+(fail.length?`\nНе вышло: ${fail.join(", ")}`:""));
}
async function delImg(k){
  if(!IMG[k])return;const next=Object.assign({},IMG);const id=next[k];delete next[k];
  try{await DB.doc("config/traits").set({img:next});IMG=next;IMGJSON=JSON.stringify(next);rerender();AS&&AS.delete(id).catch(()=>{});toast("Картинка убрана.")}
  catch(e){toast("Не удалось удалить. Попробуй ещё раз.")}
}
function pickOne(cb){const i=document.getElementById("gfile");i.value="";i.onchange=()=>{if(i.files[0])cb(i.files[0])};i.click()}
function pickMany(cb){const i=document.getElementById("gfiles");i.value="";i.onchange=()=>{if(i.files.length)cb([...i.files])};i.click()}
function gmTools(){
  if(!ADMIN)return;
  const bar=document.createElement("div");bar.className="gmbar";
  bar.innerHTML=`<b>Режим ГМа · обложки трейтов</b><span class="muted">✎ на плитке или на обложке — загрузить картинку трейту, ✎ в шапке — картинка шапки. «Обложки пачкой» — выдели много файлов, названных как трейты (например «Lone Wolf.png»).</span><button class="gbtn" type="button" id="gbulk">Обложки пачкой</button>`;
  const at=CUR?app.querySelector(".stack"):app.querySelector("#list");at&&(CUR?at.prepend(bar):at.before(bar));
  document.getElementById("gbulk").onclick=()=>pickMany(files=>{const pairs=[],miss=[];
    for(const f of files){const n=norm(f.name);const t=TRAITS.find(x=>[x.name,x.id,x.group].map(norm).includes(n))||TRAITS.find(x=>n.length>3&&norm(x.name).startsWith(n));t?pairs.push([coverKey(t),f]):miss.push(f.name)}
    if(!pairs.length){toast("Ни один файл не совпал с названием трейта.");return}
    putImgs(pairs).then(()=>{if(miss.length)toast(`Не нашёл трейт для: ${miss.join(", ")}`)})});
  app.querySelectorAll("[data-slot]").forEach(el=>{const k=el.dataset.slot;const w=document.createElement("span");w.className="slotbtns";
    w.innerHTML=`<button type="button" title="Заменить картинку" aria-label="Заменить картинку">✎</button>${IMG[k]?`<button type="button" class="del" title="Убрать картинку" aria-label="Убрать картинку">✕</button>`:""}`;
    w.children[0].onclick=e=>{e.stopPropagation();pickOne(f=>putImgs([[k,f]]))};
    if(w.children[1])w.children[1].onclick=e=>{e.stopPropagation();const b=w.children[1];if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="?";setTimeout(()=>{b.dataset.armed="";b.textContent="✕"},3000);return}delImg(k)};
    el.appendChild(w)});
}

function go(id){try{history.replaceState(null,"",id?"#"+id:"#")}catch(e){}route(id);window.scrollTo(0,0)}
let CUR="";
function route(id){CUR=id||"";id?renderOne(id):renderHome();gmTools()}
document.getElementById("home").onclick=()=>go("");
document.getElementById("toall").onclick=e=>{e.preventDefault();go("")};
route((location.hash||"").slice(1));
initDB();
</script>
