<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Организации — Царь Горы | ТРП по «Богу старшей школы»</title>
<meta name="description" content="Вики организаций ТРП-сервера «Царь Горы»: турнир GOH, Ассоциация Нищих, Шестёрка и NOX — устройство, цели, состав и как вступить.">
<meta name="theme-color" content="#07080D">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>body{margin:0}[hidden]{display:none!important}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="app/config.js"></script>
<script src="app/supabase-shim.js"></script>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rubik+Mono+One&family=Rubik:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: та же система, что вики боевых искусств и сокровищ; организации — широкие карточки-досье, внутри — паспорт, лестница иерархии и состав с портретами. Одна тёмная тема намеренно. */
:root{
  --bg:#0C0E15; --panel:#141824; --panel2:#1B2030; --line:#2A3146; --ink:#EEF1F8; --muted:#8C94AB; --soft:#C9CFDF;
  --cy:#2EE6FF; --or:#FF6A1A; --gold:#FFD23F; --red:#FF3B5C; --green:#3DDC84; --vio:#B57CFF; --night:#07080D;
  --display:"Russo One","Arial Black",sans-serif; --sfx:"Rubik Mono One","Russo One",sans-serif;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background-color:var(--bg);background-image:radial-gradient(rgba(255,210,63,.06) 1.2px,transparent 1.5px);background-size:10px 10px;color:var(--ink);font:15px/1.55 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--night)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.1;text-wrap:balance}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#07080Dee;backdrop-filter:blur(6px);border-bottom:2px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.logo{display:flex;gap:10px;align-items:center;background:none;border:0;cursor:pointer;padding:0;text-align:left}
.logo .k{font:20px var(--sfx);color:var(--night);background:var(--gold);padding:3px 10px 5px;clip-path:polygon(8% 0,100% 0,92% 100%,0 100%)}
.logo .t{font:17px var(--display);letter-spacing:.03em}
.logo small{display:block;font:500 10.5px var(--mono);color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.navr{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.navr a{font:14px var(--display);color:var(--ink);text-decoration:none;padding:7px 12px;border:2px solid var(--line);clip-path:polygon(6% 0,100% 0,94% 100%,0 100%)}
.navr a:hover{border-color:var(--gold);color:var(--gold)}
.navr a.ds{background:#5865F2;border-color:#5865F2;color:#fff}
main{padding-block:26px 80px}
.eyebrow{font:700 11px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.muted{color:var(--muted)}
.flag{display:inline-flex;align-items:center;font:700 10.5px var(--mono);letter-spacing:.1em;color:var(--night);background:var(--red);padding:3px 8px;text-transform:uppercase}
.flag.b{background:var(--gold)}

.hero{position:relative;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);border:2px solid var(--line);background:var(--panel);overflow:hidden;margin-bottom:28px}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.hero .txt{padding:34px 30px;display:grid;gap:14px;align-content:center}
.hero h1{font:clamp(24px,4vw,52px)/.95 var(--sfx);letter-spacing:-.02em;overflow-wrap:anywhere}
.hero h1 em{font-style:normal;color:var(--gold);display:block}
.hero p{margin:0;max-width:52ch;color:var(--soft)}
.hero .art{position:relative;min-height:300px;clip-path:polygon(14% 0,100% 0,100% 100%,0 100%)}
@media (max-width:820px){.hero .art{clip-path:none;min-height:200px}}
.hero .art svg{position:absolute;inset:0;width:100%;height:100%}
.counter{display:flex;gap:20px;flex-wrap:wrap}
.counter div{display:grid}
.counter b{font:30px var(--display);color:var(--gold)}
.counter span{font:600 11px var(--mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}

.sec{display:grid;gap:14px;margin-bottom:30px}
.sech{display:flex;align-items:center;gap:12px;font:24px var(--display)}
.sech::before{content:"";width:12px;height:24px;background:var(--gold);transform:skewX(-18deg)}
.lore{border:2px solid var(--line);background:var(--panel)}
.lore summary{cursor:pointer;list-style:none;padding:16px 20px;display:flex;align-items:center;gap:12px;font:20px var(--display)}
.lore summary::-webkit-details-marker{display:none}
.lore summary::before{content:"";width:10px;height:20px;background:var(--gold);transform:skewX(-18deg)}
.lore summary::after{content:"＋";margin-left:auto;color:var(--gold)}
.lore[open] summary::after{content:"−"}
.lore .lb{padding:0 20px 22px;display:grid;gap:12px;max-width:80ch}
.lore .lb p{margin:0;color:var(--soft)}
.lore .lb p.lead{font-style:italic;color:var(--ink);font-size:16px}
.lore .lb h3{font-size:16px;color:var(--gold);margin-top:6px}

.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:14px}
.rule{background:var(--panel);border:2px solid var(--line);padding:16px 18px;display:grid;gap:10px;align-content:start;min-width:0}
.rule h3{font-size:17px;display:flex;gap:10px;align-items:center}
.rule h3::before{content:"";width:8px;height:16px;background:var(--rc,var(--gold));transform:skewX(-18deg)}
.rule p{margin:0;color:var(--soft);font-size:14px}
.rule ul{margin:0;padding-left:18px;display:grid;gap:6px;color:var(--soft);font-size:14px}
.rule li b,.rule p b{color:var(--ink)}
.rule.key{border-color:var(--gold);background:linear-gradient(135deg,rgba(255,210,63,.09),transparent 60%)}
.no-list li::marker{color:var(--red)}

.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr));gap:12px}
.cat{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:6px;align-content:start;padding:14px 16px;background:var(--panel);border:2px solid var(--line);border-left:6px solid var(--rc)}
.cat:hover,.cat:focus-visible{border-color:var(--rc)}
.cat[aria-pressed="true"]{border-color:var(--rc);background:var(--panel2)}
.cat b{font:16px var(--display);color:var(--rc)}
.cat span{font-size:13.5px;color:var(--soft);line-height:1.5}

.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--panel);padding:6px 14px;font:13px var(--display);cursor:pointer;clip-path:polygon(7% 0,100% 0,93% 100%,0 100%)}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--night)}
.search{border:2px solid var(--line);background:var(--panel);padding:8px 12px;min-width:240px;max-width:100%}
.search::placeholder{color:var(--muted)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.tile{position:relative;display:block;text-align:left;cursor:pointer;padding:0;border:0;background:none;aspect-ratio:3/4;max-width:100%;transition:transform .14s}
.tile .frame{position:absolute;inset:0;clip-path:polygon(10% 0,100% 0,90% 100%,0 100%);background:var(--rc)}
.tile .inner{position:absolute;inset:3px 4px;clip-path:polygon(10% 0,100% 0,90% 100%,0 100%);background:var(--panel2);overflow:hidden}
.tile .inner svg,.tile .inner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .3s}
.tile .shade{position:absolute;inset:0;background:linear-gradient(0deg,rgba(7,8,13,.96) 12%,rgba(7,8,13,.1) 62%)}
.tile .rar{position:absolute;top:12px;right:15%;font:700 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;background:#07080Dcc;border:1px solid var(--rc);color:var(--rc)}
.tile .nm{position:absolute;left:12%;right:10%;bottom:16px;display:grid;gap:4px}
.tile .nm b{font:20px/1.05 var(--display)}
.tile .nm span{font-size:12.5px;color:var(--soft)}
.tile:hover,.tile:focus-visible{transform:translateY(-4px)}
.tile:hover .inner svg,.tile:hover .inner img{transform:scale(1.05)}
.empty{border:2px dashed var(--line);padding:30px;text-align:center;color:var(--muted)}

.form{border:2px solid var(--line);background:var(--panel);padding:16px 18px;display:grid;gap:12px}
.form ol{margin:0;padding-left:22px;columns:2 280px;column-gap:28px;color:var(--soft);font-size:14px}
.form li{break-inside:avoid;padding:3px 0}
.form li b{color:var(--ink)}
.form .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:2px solid var(--gold);background:var(--gold);color:var(--night);font:14px var(--display);padding:8px 14px;cursor:pointer;clip-path:polygon(5% 0,100% 0,95% 100%,0 100%)}
.form pre{margin:0;max-height:260px;overflow:auto;background:var(--night);border:1px solid var(--line);padding:12px;font:12.5px/1.5 var(--mono);color:var(--soft);white-space:pre-wrap}

.back{background:none;border:0;color:var(--gold);cursor:pointer;font:600 14px var(--body);padding:0;margin-bottom:14px}
.sp{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:26px;align-items:start}
@media (max-width:900px){.sp{grid-template-columns:1fr}}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);display:grid;gap:16px}
@media (max-width:900px){.side{position:static}}
.poster{position:relative;aspect-ratio:3/4;max-width:100%}
@media (max-width:900px){.poster{aspect-ratio:4/3}}
.poster .frame{position:absolute;inset:0;clip-path:polygon(8% 0,100% 0,92% 100%,0 100%);background:var(--rc)}
.poster .inner{position:absolute;inset:4px 5px;clip-path:polygon(8% 0,100% 0,92% 100%,0 100%);overflow:hidden;background:var(--panel2)}
.poster .inner svg,.poster .inner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.poster .vname{position:absolute;right:11%;top:20px;bottom:20px;writing-mode:vertical-rl;font:clamp(24px,3.4vw,38px)/1 var(--sfx);color:#fff;text-shadow:3px 3px 0 var(--night);overflow:hidden}
.head{display:grid;gap:8px;margin-bottom:20px}
.head h1{font-size:clamp(30px,5vw,54px)}
.head .orig{font:600 14px var(--mono);color:var(--muted)}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{font:700 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border:2px solid currentColor}
.card{background:var(--panel);border:2px solid var(--line);padding:16px 18px;min-width:0}
.card h2{font-size:18px;margin-bottom:10px;display:flex;gap:10px;align-items:center}
.card h2::before{content:"";width:10px;height:18px;background:var(--gold);transform:skewX(-18deg)}
.card p{margin:0;max-width:72ch;color:var(--soft)}
.stack{display:grid;gap:18px;min-width:0}
dl.pass{margin:0;display:grid;grid-template-columns:auto 1fr}
dl.pass dt,dl.pass dd{margin:0;padding:8px 0;border-top:1px solid var(--line)}
dl.pass dt{color:var(--muted);font-size:13px;padding-right:12px}
dl.pass dd{font-weight:500;overflow-wrap:anywhere}
.mods{display:flex;flex-wrap:wrap;gap:6px}
.mod{font:700 12.5px var(--mono);padding:3px 9px;border:1.5px solid currentColor;white-space:nowrap}
.mod.p{color:var(--green)}.mod.m{color:var(--red)}
.ult{border-color:var(--gold);background:linear-gradient(135deg,rgba(255,210,63,.1),transparent 60%)}
.ult b.an{display:block;font:20px var(--display);color:var(--gold);margin-bottom:6px}
.char{border-color:var(--vio)}
.char h2::before{background:var(--vio)}
.limits h2::before{background:var(--red)}
.syn h2::before{background:var(--cy)}
.people{display:flex;flex-wrap:wrap;gap:8px}
.person{background:var(--panel2);border:1px solid var(--line);padding:6px 10px;font-size:13.5px;color:var(--soft)}
.person b{display:block;font:14px var(--display);color:var(--ink)}
.moves{display:grid;gap:14px}
.move{display:grid;grid-template-columns:110px minmax(0,1fr);background:var(--panel2);border:2px solid var(--line);overflow:hidden}
@media (max-width:560px){.move{grid-template-columns:1fr}.move .mart{min-height:80px}}
.move .mart{position:relative;min-height:120px;background:var(--night)}
.move .mart svg{position:absolute;inset:0;width:100%;height:100%}
.move .mart .no{position:absolute;left:8px;bottom:6px;font:26px var(--sfx);color:#fff;text-shadow:2px 2px 0 var(--night)}
.move .mb{padding:12px 14px;display:grid;gap:8px;min-width:0}
.move .mh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.move .mh b{font:17px var(--display)}
.move .tag{font:700 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;background:var(--night);border:1px solid var(--line);color:var(--gold)}
.move p{margin:0;font-size:14px;color:var(--soft);white-space:pre-wrap}
.move p b{color:var(--ink)}
.pm{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:start;font-size:13.5px}
.pm .l{font:700 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding-top:4px}
.pm .l.p{color:var(--green)}.pm .l.m{color:var(--red)}
.pm .r{display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--soft)}
.note{font-size:12.5px;color:var(--muted);border-left:3px solid var(--gold);padding-left:10px;margin:0}
footer{border-top:2px solid var(--line);padding-block:20px;color:var(--muted);font-size:13px}
.tile.myth .frame,.poster.myth .frame{background:linear-gradient(135deg,#FF3B5C,#FFD23F,#B57CFF,#2EE6FF);background-size:300% 300%;animation:myth 4s linear infinite}
@keyframes myth{to{background-position:300% 0}}
.sel{min-width:170px;cursor:pointer}
.sel option{background:var(--panel);color:var(--ink)}
.txtb{display:grid;gap:10px}
.manhwa h2::before{background:var(--cy)}
.look h2::before{background:var(--vio)}
.can{border-color:#3A4260}
.cats{margin-bottom:4px}
.herotry{position:absolute;right:12px;bottom:12px;z-index:2;cursor:pointer;font:13px var(--display);background:var(--gold);color:var(--night);padding:6px 12px;border:2px solid var(--night)}
.tile .who{position:absolute;top:40px;right:15%;font:700 10px var(--mono);letter-spacing:.1em;padding:3px 7px;background:var(--gold);color:var(--night)}

.orgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(520px,100%),1fr));gap:18px}
.orgtile{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);background:var(--panel);border:2px solid var(--line);border-left:6px solid var(--rc);min-height:240px;width:100%;transition:transform .14s,border-color .14s}
.orgtile:hover,.orgtile:focus-visible{border-color:var(--rc);transform:translateY(-3px)}
@media (max-width:560px){.orgtile{grid-template-columns:1fr}.orgtile .oart{min-height:150px}}
.oart{position:relative;overflow:hidden;background:var(--panel2)}
.oart svg,.oart img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.oart .shade{position:absolute;inset:0;background:linear-gradient(90deg,transparent 40%,rgba(20,24,36,.9))}
.okind{position:absolute;left:10px;top:10px;font:700 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;background:#07080Dcc;border:1px solid var(--rc);color:var(--rc)}
.obody{display:grid;gap:8px;align-content:start;padding:18px 20px;min-width:0}
.obody>b{font:26px/1.05 var(--display);color:var(--ink)}
.ofull{font:600 12px var(--mono);color:var(--muted)}
.olead{color:var(--soft);font-size:14.5px}
.ometa{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13px;color:var(--muted);margin-top:4px}
.ometa b{color:var(--ink);font-weight:500}
.ojoin{font:700 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--rc);border:1.5px solid var(--rc);padding:2px 7px}
.orgtile.myth{border-image:linear-gradient(135deg,#FF3B5C,#FFD23F,#B57CFF,#2EE6FF) 1;border-left-width:6px}
.head .lead{margin:6px 0 0;color:var(--soft);font-size:16px;max-width:62ch}
.goals{margin:0;padding-left:18px;display:grid;gap:6px;color:var(--soft);font-size:14px}
.goals li::marker{color:var(--rc)}
.ladder{list-style:none;margin:0;padding:0;display:grid;gap:0;counter-reset:lv}
.ladder li{counter-increment:lv;display:grid;grid-template-columns:44px minmax(0,1fr);grid-template-rows:auto auto;column-gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.ladder li:first-child{border-top:0}
.ladder li::before{content:counter(lv);grid-row:1/3;font:22px var(--sfx);color:var(--rc);align-self:start}
.ladder b{font:16px var(--display)}
.ladder span{color:var(--soft);font-size:14px}
.members{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:12px}
.member{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;background:var(--panel2);border:1px solid var(--line);padding:12px;align-items:start}
.member.custom{border-color:var(--vio)}
.mav{position:relative;width:72px;height:90px;background:var(--night);border:2px solid var(--rc);display:grid;place-items:center;overflow:hidden}
.mav span{font:24px var(--sfx);color:var(--rc)}
.mav img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 15%}
.mtx{display:grid;gap:4px;min-width:0}
.mtx .mh{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline}
.mtx b{font:16px var(--display)}
.mrole{font:600 12px var(--mono);color:var(--rc)}
.mrole i{color:var(--muted);font-style:normal}
.mtx p{margin:0;font-size:13.5px;color:var(--soft)}
.ctag{font:700 9.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;background:var(--vio);color:var(--night);padding:2px 6px}
.sp .card h2::before{background:var(--rc,var(--gold))}

.hero .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.poster .frame,.poster .inner{clip-path:none}
.poster.hasimg{aspect-ratio:auto;padding:4px;background:var(--rc)}
.poster.hasimg .frame,.poster.hasimg .vname{display:none}
.poster.hasimg .inner{position:relative;inset:auto}
.poster.hasimg img.fg{position:relative!important;inset:auto!important;height:auto!important;max-height:80vh;display:block;width:100%}
.gmbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border:2px dashed var(--gold);background:rgba(255,210,63,.06);padding:12px 14px;margin-bottom:18px}
.gmbar b{font:15px var(--display);color:var(--gold)}
.gmbar .muted{font-size:13px;flex:1 1 260px}
.gbtn{border:2px solid var(--gold);background:var(--gold);color:#07080D;font:14px var(--display);padding:7px 14px;cursor:pointer}
.tw{position:relative;min-width:0}
.mav{overflow:visible}
.slotbtns{position:absolute;right:10px;top:10px;display:flex;gap:6px;z-index:3}
.mav .slotbtns{right:-6px;top:-6px;gap:3px}
.mav .slotbtns button{width:26px;height:26px;font-size:13px}
.tw .slotbtns{top:auto;bottom:10px;left:10px;right:auto}
.slotbtns button{width:34px;height:34px;border:2px solid #07080D;background:var(--gold);color:#07080D;font:16px var(--display);cursor:pointer;box-shadow:2px 2px 0 #07080D}
.slotbtns button.del{background:var(--red);color:#fff}
.gtoast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:50;background:#07080D;border:2px solid var(--gold);color:var(--ink);padding:10px 16px;max-width:min(560px,calc(100vw - 32px));font-size:14px;white-space:pre-wrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  const cx=[300,420,200,350][seed%4],cy=[220,160,260,200][(seed>>2)%4];let l="";
  for(let i=0;i<64;i++){const a=i/64*Math.PI*2+(seed%9)*.03,r1=50+((i*29+seed)%70);l+=`<line x1="${(cx+Math.cos(a)*r1).toFixed(1)}" y1="${(cy+Math.sin(a)*r1).toFixed(1)}" x2="${(cx+Math.cos(a)*900).toFixed(1)}" y2="${(cy+Math.sin(a)*900).toFixed(1)}" stroke="${i%6===0?color:"#fff"}" stroke-width="${i%6===0?4:1}" stroke-opacity="${i%6===0?.75:.16}"/>`}
  return `<svg viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><radialGradient id="g${seed}" cx="${cx/6}%" cy="${cy/8}%" r="60%"><stop offset="0" stop-color="${color}" stop-opacity=".55"/><stop offset="1" stop-color="#07080D" stop-opacity="0"/></radialGradient></defs><rect width="600" height="800" fill="#0E1119"/>${l}<rect width="600" height="800" fill="url(#g${seed})"/>${word?`<text x="${cx}" y="${cy+30}" text-anchor="middle" font-family="Rubik Mono One,Arial Black" font-size="92" fill="#fff" fill-opacity=".9" stroke="#07080D" stroke-width="8" paint-order="stroke" transform="rotate(-8 ${cx} ${cy})">${word}</text>`:""}</svg>`}
const media=(k,color,word)=>imgOf(k)?`<img class="fg" src="${esc(imgOf(k))}" alt="" loading="lazy">`:art(hash(k),color,word||"");
const paras=a=>a.map(p=>`<p>${esc(p)}</p>`).join("");
const initials=n=>n.split(/[\s·]+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();

/* ======= главная ======= */
function renderHome(){
  const nM=ORGS.reduce((a,o)=>a+o.members.length,0);
  app.innerHTML=`<section class="hero"><div class="txt"><span class="eyebrow">Вики сервера «Царь Горы»</span><h1>ОРГАНИЗАЦИИ<em>МИРА GOH</em></h1>
    <p>Турнир, который исполняет желания, братство нищих, которое видит всё, шестеро сильнейших людей мира и культ, который служит богам. Кто чего хочет, кто кому подчиняется и как туда попасть.</p>
    <div class="counter"><div><b>${ORGS.length}</b><span>организации</span></div><div><b>${nM}</b><span>персонажей</span></div></div></div>
    <div class="art" data-slot="hero">${media("hero","#FFD23F","ORDER")}</div></section>
   <section class="sec"><h2 class="sech">Организации</h2>
    <div class="orgs">${ORGS.map(o=>`<div class="tw" data-slot="${o.id}"><button class="orgtile${o.myth?" myth":""}" type="button" data-id="${o.id}" style="--rc:${o.color}">
      <span class="oart">${media(o.id,o.color,"")}<span class="shade"></span><span class="okind">${esc(o.kind)}</span></span>
      <span class="obody"><b>${esc(o.name)}</b><span class="ofull">${esc(o.full)}</span><span class="olead">${esc(o.lead)}</span>
       <span class="ometa"><span>Глава: <b>${esc(o.head)}</b></span><span class="ojoin">${esc(o.join)}</span></span></span></button></div>`).join("")}</div></section>`;
  app.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>go(b.dataset.id));
}

/* ======= страница организации ======= */
function renderOrg(id){
  const o=ORGS.find(x=>x.id===id);if(!o){renderHome();return}
  const c=o.color;
  app.innerHTML=`<button class="back" type="button" id="back">← Все организации</button>
  <div class="sp" style="--rc:${c}"><div class="side"><div class="poster${o.myth?" myth":""}${imgOf(o.id)?" hasimg":""}" style="--rc:${c}" data-slot="${o.id}"><span class="frame"></span><span class="inner">${media(o.id,c,"")}</span><span class="vname">${esc(o.name)}</span></div>
    <div class="card"><h2>Паспорт</h2><dl class="pass"><dt>Тип</dt><dd style="color:${c}">${esc(o.kind)}</dd><dt>Глава</dt><dd>${esc(o.head)}</dd><dt>Где</dt><dd>${esc(o.base)}</dd><dt>Состав</dt><dd>${o.members.length}</dd><dt>Вступление</dt><dd>${esc(o.join)}</dd></dl></div>
    <div class="card"><h2>Цели</h2><ul class="goals">${o.goals.map(g=>`<li>${esc(g)}</li>`).join("")}</ul></div></div>
  <div class="stack"><div class="head"><span class="eyebrow" style="color:${c}">${esc(o.kind)}</span><h1>${esc(o.name)}</h1><span class="orig">${esc(o.full)}</span>
    <p class="lead">${esc(o.lead)}</p></div>
   <div class="card"><h2>Об организации</h2><div class="txtb">${paras(o.about)}</div></div>
   <div class="card"><h2>${esc(o.ranksTitle)}</h2><ol class="ladder">${o.ranks.map(([n,d])=>`<li><b>${esc(n)}</b><span>${esc(d)}</span></li>`).join("")}</ol>${o.ranksNote?`<p class="note" style="margin-top:12px">${esc(o.ranksNote)}</p>`:""}</div>
   <div class="card"><h2>${esc(o.membersTitle)} · ${o.members.length}</h2>${o.membersNote?`<p class="note" style="margin-bottom:12px">${esc(o.membersNote)}</p>`:""}
    <div class="members">${o.members.map((m,i)=>{const k=o.id+"|"+m.name;return `<div class="member${m.custom?" custom":""}"><div class="mav" data-slot="${esc(k)}">${imgOf(k)?`<img src="${esc(imgOf(k))}" alt="">`:`<span>${esc(initials(m.name))}</span>`}</div>
      <div class="mtx"><div class="mh"><b>${esc(m.name)}</b>${m.custom?'<span class="ctag">кастомный персонаж</span>':""}</div><span class="mrole">${esc(m.role)}${m.orig?` · <i>${esc(m.orig)}</i>`:""}</span><p>${esc(m.desc)}</p></div></div>`}).join("")}</div></div>
   <div class="card ult"><h2>Для игроков</h2><div class="txtb">${paras(o.players)}</div></div>
  </div></div>`;
  document.getElementById("back").onclick=()=>go("");
}


/* ======= картинки: хранятся в базе сайта, загружает ГМ ======= */
let IMG={},ADMIN=false,DB=null,AS=null,IMGJSON="{}";
const imgOf=k=>IMG[k]?(window.BLOB_BASE||"")+IMG[k]:"";
const norm=x=>String(x||"").toLowerCase().replace(/ё/g,"е").replace(/\.[a-z0-9]+$/i,"").replace(/[^a-zа-я0-9]+/g,"");
function toast(m,keep){const t=document.getElementById("gtoast");t.textContent=m;t.hidden=false;clearTimeout(t._t);if(!keep)t._t=setTimeout(()=>t.hidden=true,5000)}
function rerender(){const y=window.scrollY;route(CUR);window.scrollTo(0,y)}
async function initDB(){
  try{if(!window.claude)return;DB=await claude.use("db");if(!DB)return;
    DB.doc("config/orgs").onSnapshot(sn=>{const d=(sn.exists&&sn.data().img)||{};const j=JSON.stringify(d);if(j!==IMGJSON){IMG=d;IMGJSON=j;rerender()}},()=>{});
    const u=await claude.use("user");ADMIN=u?!!(await u.isOwner()):false;if(ADMIN){AS=await claude.use("assets");rerender()}}catch(e){}
}
async function shrinkImg(f){
  if(/gif|svg/.test(f.type)||f.size<350000)return f;
  try{const bmp=await createImageBitmap(f);const k=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);const b=await new Promise(r=>c.toBlob(r,"image/webp",.86));return b&&b.size<f.size?b:f}catch(e){return f}
}
async function putImgs(pairs){
  if(!AS){toast("Войди на главном сайте под аккаунтом ГМа.");return}
  let ok=0,fail=[];const next=Object.assign({},IMG),old=[];
  for(const [k,f] of pairs){toast(`Загружаю ${ok+fail.length+1} из ${pairs.length}…`,true);
    try{const b=await shrinkImg(f);const r=await AS.upload(b,{type:b.type||f.type});if(next[k])old.push(next[k]);next[k]=r.id;ok++}
    catch(e){fail.push(f.name+(e&&e.code==="too_large"?" (больше 20 МБ)":e&&e.code==="unsupported_type"?" (формат не подходит)":""))}}
  if(ok){try{await DB.doc("config/orgs").set({img:next});IMG=next;IMGJSON=JSON.stringify(next);rerender()}
    catch(e){toast("Картинки загрузились, но не сохранились в базе. Обнови страницу и попробуй ещё раз.");return}
    old.forEach(id=>AS.delete(id).catch(()=>{}))}
  toast(`Готово: ${ok} загружено.`+(fail.length?`\nНе вышло: ${fail.join(", ")}`:""));
}
async function delImg(k){
  if(!IMG[k])return;const next=Object.assign({},IMG);const id=next[k];delete next[k];
  try{await DB.doc("config/orgs").set({img:next});IMG=next;IMGJSON=JSON.stringify(next);rerender();AS&&AS.delete(id).catch(()=>{});toast("Картинка убрана.")}
  catch(e){toast("Не удалось удалить. Попробуй ещё раз.")}
}
function pickOne(cb){const i=document.getElementById("gfile");i.value="";i.onchange=()=>{if(i.files[0])cb(i.files[0])};i.click()}
function pickMany(cb){const i=document.getElementById("gfiles");i.value="";i.onchange=()=>{if(i.files.length)cb([...i.files])};i.click()}
function gmTools(){
  if(!ADMIN)return;
  const o=CUR&&ORGS.find(x=>x.id===CUR);
  const bar=document.createElement("div");bar.className="gmbar";
  if(o){bar.innerHTML=`<b>Режим ГМа · картинки</b><span class="muted">✎ на обложке и на каждом портрете. «Портреты пачкой» — выдели много файлов, названных как персонажи (например «Со Ханрян.png»); файл «обложка» ляжет на обложку организации.</span><button class="gbtn" type="button" id="gbulk">Портреты пачкой</button>`;
    const st=app.querySelector(".stack");st&&st.prepend(bar);
    document.getElementById("gbulk").onclick=()=>pickMany(files=>{const pairs=[],miss=[];
      for(const f of files){const n=norm(f.name);
        if(["обложка","cover",norm(o.name),norm(o.id)].includes(n)){pairs.push([o.id,f]);continue}
        const m=o.members.find(x=>[x.name,x.orig].map(norm).includes(n))||o.members.find(x=>n.length>3&&norm(x.name).startsWith(n));
        m?pairs.push([o.id+"|"+m.name,f]):miss.push(f.name)}
      if(!pairs.length){toast("Ни один файл не совпал с именем персонажа.");return}
      putImgs(pairs).then(()=>{if(miss.length)toast(`Не нашёл персонажа для: ${miss.join(", ")}`)})})}
  else{bar.innerHTML=`<b>Режим ГМа · картинки</b><span class="muted">✎ в шапке — картинка шапки страницы, ✎ на карточке — обложка организации. Портреты персонажей — на странице организации.</span>`;
    const sec=app.querySelector(".sec");sec&&sec.before(bar)}
  app.querySelectorAll("[data-slot]").forEach(el=>{const k=el.dataset.slot;const w=document.createElement("span");w.className="slotbtns";
    w.innerHTML=`<button type="button" title="Заменить картинку" aria-label="Заменить картинку">✎</button>${IMG[k]?`<button type="button" class="del" title="Убрать картинку" aria-label="Убрать картинку">✕</button>`:""}`;
    w.children[0].onclick=e=>{e.stopPropagation();pickOne(f=>putImgs([[k,f]]))};
    if(w.children[1])w.children[1].onclick=e=>{e.stopPropagation();const b=w.children[1];if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="?";setTimeout(()=>{b.dataset.armed="";b.textContent="✕"},3000);return}delImg(k)};
    el.appendChild(w)});
}

function go(id){try{history.replaceState(null,"",id?"#"+id:"#")}catch(e){}route(id);window.scrollTo(0,0)}
let CUR="";
function route(id){CUR=id||"";id?renderOrg(id):renderHome();gmTools()}
document.getElementById("home").onclick=()=>go("");
document.getElementById("toall").onclick=e=>{e.preventDefault();go("")};
route((location.hash||"").slice(1));
initDB();
</script>
